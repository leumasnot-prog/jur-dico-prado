SP) - Wesley Luiz Alves de Paula (OAB: 274238/SP) - 1° andar"},{"id":682883489,"data":"2026-07-30","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial de Direito Público","numero":"2131198-24.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"IZABEL CRISTINA DE AGUIAR","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CASSIA JORGE DE MORAES","oab":"SP/407536"}],"texto":"DESPACHO\r\n\r\nNº 2131198-24.2026.8.26.0000 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Agravo de Instrumento - Guariba - Agravante: Município de Pradópolis - Agravada: Izabel Cristina de Aguiar - Agravo de Instrumento Processo nº 2131198-24.2026.8.26.0000 Relator(a): HELOÍSA MIMESSI Órgão Julgador: 5ª Câmara de Direito Público SESSÃO DE JULGAMENTO NA MODALIDADE VIRTUAL - RESOLUÇÃO CNJ 591/24 Data da pauta: 11/08/2026 às 00:01 Número da pauta: 83 Íntegra da pauta de julgamento: https://esaj.tjsp.jus.br/pauta-julgamento-virtual Torno público, nos termos da Resolução n.º 984/2025, que regulamenta o julgamento eletrônico no âmbito do Tribunal de Justiça do Estado de São Paulo, por meio do sistema SAJ e, em conformidade com a Resolução CNJ n.º 591/2024, que os presentes autos serão julgados eletronicamente em sessão virtual. Eventuais pedidos de DESTAQUE (oposição ao julgamento virtual), deverão ser feitos, por meio eletrônico, no portal do ESAJ (https://esaj.tjsp.jus.br/pauta-julgamento-virtual) (Selecione o Órgão julgador e em seguida a data da sessão virtual e clique em \"consultar\"> localize o processo na pauta e clique em \"acompanhar julgamento\"> na parte inferior estará habilitado o pedido de \"destaque\" e \"esclarecimento\"), até 48 (quarenta e oito) horas antes do início da sessão e deferido pelo(a) Relator(a). NOTA: DESTAQUES DEFERIDOS NÃO DISPENSAM AS PARTES DE REALIZAR INSCRIÇÃO PARA PREFERÊNCIA SIMPLES OU SUSTENTAÇÃO ORAL, PERMANECENDO OBRIGATÓRIA A REALIZAÇÃO DE INSCRIÇÃO PELAS PARTES NA SESSÃO QUE VIER A SER DESIGNADA. Nas hipóteses de cabimento de SUSTENTAÇÃO ORAL, é facultado o seu envio por meio eletrônico, no próprio processo, não sendo aceito outro meio, após a publicação da pauta e até 48 (quarenta e oito) horas antes de iniciado o julgamento em ambiente virtual, conforme manual de peticionamento no site: https://www.tjsp.jus.br/Download/PeticionamentoEletronico/Manual_PETIC_ELETRONICO_SAJSG_Julg_Virtual.Pdf MEMORIAIS deverão ser encaminhados, exclusivamente, para os e-mails institucionais dos gabinetes disponíveis em: https://www.tjsp.jus.br/CanaisComuni"},{"id":683058215,"data":"2026-07-30","tribunal":"TJSP","orgao":"Processamento 3º Grupo - 7ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"2008261-12.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"LA EQUIPAMENTOS INDUSTRIAIS EIRELI","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"},{"nome":"SILVIO MARTINS","polo":"P"}],"advogados":[{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CARLOS AUGUSTO MANELLA RIBEIRO","oab":"SP/278733"},{"nome":"SAULO EMANUEL ATIQUE","oab":"SP/218159"},{"nome":"MARIA CLAUDIA SACO DUARTE","oab":"SP/479017"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"DESPACHO\r\n\r\nNº 2008261-12.2026.8.26.0000 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Agravo de Instrumento - Guariba - Agravante: Clovis Bronzati - Agravado: Silvio Martins - Agravado: La Equipamentos Industriais Eireli - Agravado: Município de Pradópolis - Certifique a serventia o decurso de prazo para apresentação de contrarrazões ao recurso. - Magistrado(a) Eduardo Gouvêa - Advs: Clovis Bronzati (OAB: 279195/SP) - Gilberto Fagundes de Oliveira (OAB: 325606/SP) - Viviane Cristina Bronzati (OAB: 444669/SP) - Saulo Emanuel Atique (OAB: 218159/SP) - Carlos Augusto Manella Ribeiro (OAB: 278733/SP) - Maria Claudia Saco Duarte (OAB: 479017/SP) - Wesley Luiz Alves de Paula (OAB: 274238/SP) (Procurador) - 1° andar"},{"id":683068735,"data":"2026-07-30","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1000365-45.2026.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"IZABEL CRISTINA DE AGUIAR","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"CASSIA JORGE DE MORAES","oab":"SP/407536"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000365-45.2026.8.26.0222 - Procedimento Comum Cível - Internação compulsória - Izabel Cristina de Aguiar - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - Vistos. Às fls. 141/143 foi determinada a realização de avaliação psiquiátrica atualizada do requerido perante o CAPS do Município de Pradópolis, a fim de subsidiar a deliberação acerca da efetivação da tutela de urgência deferida às fls. 42/44. Sobreveio o relatório médico elaborado pelo CAPS, o qual concluiu pela persistência da indicação de internação psiquiátrica compulsória, consignando que o requerido apresenta descompensação psiquiátrica associada ao uso de substâncias psicoativas, com risco aumentado à integridade física própria e de terceiros, bem como que já se encontram esgotadas as possibilidades de manejo em regime ambulatorial e de internação voluntária. Consta, ainda, ausência de adesão ao tratamento e incapacidade de consentir adequadamente com o cuidado necessário. Diante desse cenário, verifica-se que permanecem presentes os fundamentos que ensejaram o deferimento da tutela de urgência, razão pela qual sua efetivação é medida que se impõe. Assim, determino o imediato cumprimento da tutela de urgência deferida às fls. 42/44, devendo os requeridos adotar as providências necessárias para disponibilização de vaga para internação psiquiátrica do requerido, nos exatos termos da decisão anteriormente proferida. Oficie-se, com urgência, ao CAPS do Município de Pradópolis, à Secretaria Municipal de Saúde de Pradópolis e ao DRS-XIII, encaminhando-se cópia desta decisão e da decisão de fls. 42/44 para imediato cumprimento. Servirá a presente decisão, assinada digitalmente e devidamente instruída, como OFÍCIO. Intimem-se. - ADV: CASSIA JORGE DE MORAES (OAB 407536/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":683402369,"data":"2026-07-30","tribunal":"TJSP","orgao":"Turma de Uniformização de Jurisprudência do Sistema dos Juizados Especiais","numero":"0001510-20.2026.8.26.9061","classe":"PEDIDO DE UNIFORMIZAçãO DE INTERPRETAçãO DE LEI CíVEL","tipo":"Intimação","documento":"Intimação de acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"LUZIA DE SOUZA BARROS SILVA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADóPOLIS","polo":"P"}],"advogados":[{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"INTIMAÇÃO DE ACÓRDÃO\r\n\r\nNº 0001510-20.2026.8.26.9061 - Processo Digital - Pedido de Uniformização de Interpretação de Lei Cível - São Paulo - Requerente: Luzia de Souza Barros Silva - Requerido: Prefeitura Municipal de Pradópolis - Magistrado(a) Jose Evandro Mello Costa - Não conheceram. V. U. - PEDIDO DE UNIFORMIZAÇÃO DE INTERPRETAÇÃO DE LEI. PRETENSÃO DE INDENIZAÇÃO POR DANOS MORAIS EM VIRTUDE DA NEGATIVA ADMINISTRATIVA DE PENSÃO POR MORTE. NÃO DEMONSTRAÇÃO DE DIVERGÊNCIA ANALÍTICA COM BASE EM JURISPRUDÊNCIA PREDOMINANTE CONSOLIDADA. ARBITRAMENTO DE DANOS MORAIS É MATÉRIA FÁTICO-PROBATÓRIA, QUE EXIGE COTEJO DO ABALO MORAL SOFRIDO, O QUE AFASTA A ATUAÇÃO DA TURMA DE UNIFORMIZAÇÃO. INADEQUAÇÃO DA VIA PARA REANÁLISE FÁTICO PROBATÓRIA. APLICAÇÃO DAS SÚMULAS Nº 1 E Nº 10 DESTA E. TURMA DE UNIFORMIZAÇÃO. PEDIDO NÃO CONHECIDO. Para eventual interposição de recurso extraordinário, comprovar o recolhimento de R$ 1.325,45 na Guia de Recolhimento da União - GRU, do tipo 'Cobrança' - Ficha de Compensação, a ser emitida no sítio eletrônico do Supremo Tribunal Federal (http://www.stf.jus.br www.stf.jus.br ) ou recolhimento na plataforma PAG Tesouro, nos termos das Resoluções nºs 733/2021 e 766/2022 do STF; e para recursos não digitais ou para os digitais que contenham mídias ou outros objetos que devam ser remetidos via malote, o valor referente a porte de remessa e retorno em guia FEDTJ, código 140-6, no Banco do Brasil S.A. ou internet, conforme Instrução Normativa nº. 297, de 14 de maio de 2024, Resoluções nºs. 833 de 13 de maio de 2024 e 914 de 1º de julho de 2026 do STF e Provimento nº. 831/2004 do CSM. - Advs: Clovis Bronzati (OAB: 279195/SP) - Viviane Cristina Bronzati (OAB: 444669/SP) - Gilberto Fagundes de Oliveira (OAB: 325606/SP) - Wesley Luiz Alves de Paula (OAB: 274238/SP) - e-mail: turmadeuniformizacao@tjsp.jus.br"},{"id":683411443,"data":"2026-07-30","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1000367-15.2026.8.26.0222","classe":"MANDADO DE SEGURANçA CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 1000367-15.2026.8.26.0222 - Mandado de Segurança Cível - Garantias Constitucionais - Clovis Bronzati - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - Cuida-se de embargos de declaração opostos em relação à decisão proferida. Conheço dos embargos declaratórios, para, no mérito, rejeitá-los por não vislumbrar qualquer vício aptos a ensejar sua procedência. Analisando a decisão publicada não vislumbro os defeitos apontados, aptos a impedir a exata compreensão e alcance da manifestação, nos moldes do art. 1.022, do Código de Processo Civil. Pretende o embargante, na realidade, a modificação do entendimento externado pela magistrada, o que só é possível em sede de recurso cabível. Com efeito, os efeitos infringentes nos aclamatórios somente devem ser admitidos excepcionalmente quando existentes as respectivas hipóteses de cabimento, o que não é o caso da hipótese presente. Esse Juízo determinou ao impetrante os devidos recolhimentos, sob pena de cancelamento da distribuição, decisão publicada aos 14/05/20256 conforme f. 73. Aos 26/05/2026 conforme f. 108-109 houve a publicação da decisão que determinou o cancelamento da distribuição. O autor peticionou informando que em 29/06/2026 (f. 124/125) cumpriu a determinação. Verifica-se que a parte autora deixou transcorrer, em muito, o prazo que lhe foi regularmente concedido para o recolhimento das custas e despesas processuais, sem a adoção da providência determinada. Ausente fato novo capaz de justificar a revisão do decisum, fica mantida a decisão por seus próprios fundamentos. Se o Embargante não concorda com a fundamentação expendida na decisão embargada - afinal, as decisões judiciais nem sempre satisfazem os interesses daqueles que procuram o Judiciário -, e já que a questão não comporta solução pela via estreita e bem definida dos embargos de declaração, deve a irresignação, se o caso, ser deduzida por meio de outra via. Ante a inexistência de vícios, rejeito os embargos de declaração, mantendo a decisão tal qual lançada. Intime-se. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP)"},{"id":681620863,"data":"2026-07-29","tribunal":"TST","orgao":"1ª Turma","numero":"0011196-47.2014.5.15.0029","classe":"AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA","tipo":"Intimação","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://sessao-integracao-backend.prd.rede.tst/documentos/PJe--2842/11196-47.2014.5.15.0029/certidao-inclusao-pauta/MjkvMDcvMjAyNiAwMDowMDowMCMxMTU4MzA3ODQ3","partes":[{"nome":"CARLOS EDUARDO NUNES ROSSI","polo":"P"},{"nome":"GESSICA APARECIDA NUNES ROSSI","polo":"P"},{"nome":"ISABEL RODRIGUES NUNES ROSSI","polo":"P"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"SP/394178"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CAROLINE COLMANETTI SILVA GIARLLARIELLI","oab":"SP/348818"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Pauta de Julgamento (processos PJe) da Sessão Ordinária da Primeira Turma, a realizar-se exclusivamente em ambiente eletrônico (sessão virtual).\n\nA sessão virtual terá início no dia 24/08/2026 e encerramento 31/08/2026.\n\n1. Sustentação oral na sessão virtual:\n\n1.1. Sustentações eletrônicas: Nas hipóteses de cabimento de sustentação oral, fica facultado ao advogado encaminhar a sustentação por meio eletrônico, após a publicação da pauta até 48 horas antes do início da sessão virtual (art. 134-A do RITST). Neste caso, o julgamento será realizado em ambiente eletrônico (sessão virtual).\n\n1.2. Formato e responsabilidade: As sustentações devem seguir as especificações técnicas do Tribunal (Ato SEGJUD.GP nº 129/2025), e o advogado firmará termo de declaração de que se encontra devidamente habilitado nos autos e de responsabilidade pelo conteúdo do arquivo enviado (art. 134-A, §§ 3º e 4º, do RITST).\n\n\n\n2. Destaque para julgamento em sessão presencial:\n\n2.1. Prazo: O pedido de destaque pode ser feito desde a publicação da pauta até 48 horas antes do início da sessão virtual (art. 135, II, do RITST).\n\n2.2. Requerimento: O advogado deve formalizar o pedido de destaque por meio de inscrição eletrônica no endereço https://www.tst.jus.br/portal-da-advocacia.\n\n2.3. Condição: O pedido de destaque só poderá ser realizado se o julgamento do processo comportar sustentação oral, e será submetido à consideração do relator. Em caso de deferimento, o processo será remetido para julgamento presencial, com publicação de nova pauta (art. 135 do RITST).\n\n\n\nObservação: Caso opte por encaminhar a sustentação oral por meio eletrônico, o advogado não poderá requerer o destaque do processo para julgamento presencial (art. 134-A, § 5º, do RITST).\n\n\nProcesso AIRR - 11196-47.2014.5.15.0029 incluído no PLENARIO VIRTUAL.\nRelator: MINISTRO HUGO CARLOS SCHEUERMANN.\n\nALEX ALEXANDER ABDALLAH JUNIOR\nSecretário da 1ª Turma."},{"id":681051404,"data":"2026-07-29","tribunal":"TRT15","orgao":"1ª Vara do Trabalho de Jaboticabal","numero":"0010872-37.2026.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Lista de distribuição","documento":"Distribuição","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/visualizacao/26072800300650600000301828025?instancia=1","partes":[{"nome":"GUILHERME DE SOUZA GIGAR","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"T.E.M. EMERGENCIAS MEDICAS LTDA - EM RECUPERACAO JUDICIAL","polo":"P"}],"advogados":[{"nome":"MARCIA APARECIDA TEIXEIRA TELES GOMES","oab":"SP/472414"},{"nome":"BETHANIA GIGAR SANTOS CAMACHO","oab":"SP/415432"},{"nome":"EDUARDO TELES GOMES","oab":"SP/435712"}], larecimentos no prazo de 06/10/2026 a 13/10/20"},{"id":681365116,"data":"2026-07-29","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0000249-56.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA CONTRA A FAZENDA PúBLICA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MICHELE GARCIA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 0000249-56.2026.8.26.0222 (processo principal 1001024-25.2024.8.26.0222) - Cumprimento de Sentença contra a Fazenda Pública - Equivalência salarial - Michele Garcia - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Pague-se o Sr. Perito. Digam as partes sobre o laudo pericial em 10 dias. Int. - ADV: CLOVIS BRONZATI (OAB 279195/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":681497039,"data":"2026-07-29","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial de Direito Público","numero":"1001821-64.2025.8.26.0222","classe":"APELAçãO CíVEL","tipo":"Intimação","documento":"VISTA","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MAIZA PATRICIA BARANDA MARINHO","polo":"A"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"DANIELA SOARES MENDONÇA","oab":"SP/412705"}],"texto":"VISTA\r\n\r\nNº 1001821-64.2025.8.26.0222 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Apelação Cível - Guariba - Apelante: Maiza Patricia Baranda Marinho - Apelado: Município de Pradópolis - Vista à(s) parte(s) contrária(s) para apresentar(em) contrarrazões ao(s) recurso(s) interposto(s), no prazo legal. - Advs: Daniela Soares Mendonça (OAB: 412705/SP) - Wesley Luiz Alves de Paula (OAB: 274238/SP) (Procurador) - 1º andar"},{"id":681675969,"data":"2026-07-29","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial de Direito Público","numero":"0001285-07.2024.8.26.0222","classe":"APELAçãO CíVEL","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANA PAULA APARECIDA SILVA DE PAULA","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"PAULO CESAR MARCOLINO","oab":"SP/128165"}],"texto":"DESPACHO\r\n\r\nNº 0001285-07.2024.8.26.0222 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Apelação Cível - Guariba - Apte/Apdo: Município de Pradópolis - Apdo/Apte: Ana Paula Aparecida Silva de Paula - Apelação Cível Processo nº 0001285-07.2024.8.26.0222 Relator(a): CLAUDIO AUGUSTO PEDRASSI Órgão Julgador: 2ª Câmara de Direito Público SESSÃO DE JULGAMENTO NA MODALIDADE VIRTUAL - RESOLUÇÃO CNJ 591/24 Data da pauta: 10/08/2026 às 00:01 Número da pauta: 120 Íntegra da pauta de julgamento: https://esaj.tjsp.jus.br/pauta-julgamento-virtual Torno público, nos termos da Resolução n.º 984/2025, que regulamenta o julgamento eletrônico no âmbito do Tribunal de Justiça do Estado de São Paulo, por meio do sistema SAJ e, em conformidade com a Resolução CNJ n.º 591/2024, que os presentes autos serão julgados eletronicamente em sessão virtual. Eventuais pedidos de DESTAQUE (oposição ao julgamento virtual), deverão ser feitos, por meio eletrônico, no portal do ESAJ (https://esaj.tjsp.jus.br/pauta-julgamento-virtual) (Selecione o Órgão julgador e em seguida a data da sessão virtual e clique em \"consultar\"> localize o processo na pauta e clique em \"acompanhar julgamento\"> na parte inferior estará habilitado o pedido de \"destaque\" e \"esclarecimento\"), até 48 (quarenta e oito) horas antes do início da sessão e deferido pelo(a) Relator(a). NOTA: DESTAQUES DEFERIDOS NÃO DISPENSAM AS PARTES DE REALIZAR INSCRIÇÃO PARA PREFERÊNCIA SIMPLES OU SUSTENTAÇÃO ORAL, PERMANECENDO OBRIGATÓRIA A REALIZAÇÃO DE INSCRIÇÃO PELAS PARTES NA SESSÃO QUE VIER A SER DESIGNADA. Nas hipóteses de cabimento de SUSTENTAÇÃO ORAL, é facultado o seu envio por meio eletrônico, no próprio processo, não sendo aceito outro meio, após a publicação da pauta e até 48 (quarenta e oito) horas antes de iniciado o julgamento em ambiente virtual, conforme manual de peticionamento no site: https://www.tjsp.jus.br/Download/PeticionamentoEletronico/Manual_PETIC_ELETRONICO_SAJSG_Julg_Virtual.Pdf MEMORIAIS deverão ser encaminhados, exclusivamente, para os e-mails institucionais dos gabinetes disponíveis em: https://www.tjsp.jus.br/Canais"},{"id":680414032,"data":"2026-07-28","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0011490-16.2025.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072715052606500000301763908?instancia=1","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"WOLNEY DE OLIVEIRA LIMA","polo":"A"}],"advogados":[{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0011490-16.2025.5.15.0029 AUTOR: WOLNEY DE OLIVEIRA LIMA RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID ba872b5 proferido nos autos. Órgão Julgador de Origem: 1ª VARA DO TRABALHO DE JABOTICABAL DESPACHO Designo audiência de instrução, para o dia 28/01/2027 10:15, a ser realizada por VIDEOCONFERÊNCIA/TELEPRESENCIAL. A parte reclamada poderá se opor ao Juízo 100% Digital no prazo de 05 dias. Com a adoção do Juízo 100% Digital, todas as audiências serão realizadas exclusivamente de modo telepresencial, assumindo as partes expressamente todos os riscos em caso de dificuldade de conexão e acesso, seja por partes, advogados ou testemunhas, e eventuais prejuízos processuais que possam ser causados por essa modalidade de audiência. Diante da impossibilidade técnica, não serão realizadas audiências híbridas ou mistas. Ressalva-se que as intimações continuarão a ser realizadas pelo sistema DEJT, mesmo nos processos que tramitam em Juízo 100% Digital. As partes devem comparecer para depor, sob pena de aplicação dos efeitos da confissão (TST, Súmula, 74, item I). Todas as testemunhas deverão comparecer independentemente de intimação, SOB PENA DE PRECLUSÃO, sendo que não será expedida Carta Precatória. Caso seja necessária a prévia comunicação da testemunha, cópia desta decisão, assinada eletronicamente, pode ser usada para intimação. Cumpre à parte interessada exibir o documento à testemunha, por e-mail ou outro meio idôneo, e proceder à respectiva anexação ao processo eletrônico até a véspera da audiência, sob pena de preclusão de sua oitiva em caso de impossibilidade de comparecimento e/ou problemas de conexão. Aplicação dos arts. 455, caput, e §§ 1º e 2º do CPC e art. 8º do Capítulo NOT da CNC. Cabe aos advogados comunicar diretamente aos respectivos clientes a data e horário da audiência, bem como o link e as instruções de acesso ao ambiente virtual da audiência. ATENÇÃO: o link que dá acesso à sala em que se realizará é: https://us02web.zoom.us/j/88029879844?pwd=NDNXMkZ2QzJQdzc2MmVkRmdJcEFJdz09 ID da reunião: 8802987984"},{"id":680546484,"data":"2026-07-28","tribunal":"TRT15","orgao":"Gabinete da Vice-Presidência Judicial - Análise de Recurso","numero":"0010367-98.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072716101407600000155247815?instancia=2","partes":[{"nome":"JOSANA APARECIDA ZAMBIANCO POSSI","polo":"P"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"}],"advogados":[{"nome":"ODAIR JOSE BARCELOS DA SILVA","oab":"SP/314524"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO ÓRGÃO ESPECIAL - ANÁLISE DE RECURSO Relatora: MARGARETE APARECIDA GULMANELI SOLCIA ROT 0010367-98.2025.5.15.0120 RECORRENTE: MUNICIPIO DE PRADOPOLIS RECORRIDO: JOSANA APARECIDA ZAMBIANCO POSSI INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID d5722e2 proferida nos autos. ROT 0010367-98.2025.5.15.0120 - 7ª Câmara Valor da condenação: R$ 58.000,00 Recorrente:   1. MUNICIPIO DE PRADOPOLIS Recorrido:   Advogado(s):   JOSANA APARECIDA ZAMBIANCO POSSI ODAIR JOSE BARCELOS DA SILVA (SP314524) RECURSO DE: MUNICIPIO DE PRADOPOLIS   PRESSUPOSTOS EXTRÍNSECOS Recurso tempestivo (ciência da decisão em 04/05/2026 - Id 594192b; recurso apresentado em 05/05/2026 - Id fc77f0a). Regular a representação processual (nos termos da Súmula 436, item I/TST). Isento de preparo (CLT, art. 790-A e DL 779/69, art. 1º, IV).   PRESSUPOSTOS INTRÍNSECOS 1.1  DIREITO INDIVIDUAL DO TRABALHO (12936) / VERBAS REMUNERATÓRIAS, INDENIZATÓRIAS E BENEFÍCIOS (13831) / VALE TRANSPORTE Quanto ao tema em destaque, o v. acórdão decidiu com amparo nos elementos fático-probatórios contidos nos autos, conforme trecho a seguir transcrito: \"(...) A Lei nº 7.418/85, que instituiu o vale-transporte, não estabelece distinção entre transporte coletivo urbano e intermunicipal para a concessão do benefício. Cumpre ressaltar que é incontroverso nos autos que a reclamante foi admitida pelo Município reclamado em 21/03/2018, mantendo vínculo empregatício regido pela CLT, com contrato de trabalho atualmente ativo, não se verificando a existência de legislação municipal que disponha em sentido diverso. Nesse contexto, o ente público, ao contratar pelo regime celetista, submete-se às normas trabalhistas, não podendo impor limitações municipais a direitos previstos em lei federal, sob pena de afronta à competência legislativa da União (art. 22, I, da CF). Dessa forma, o vale-transporte encontra-se previsto na Lei nº 7.418/85, regulamentada pelo Decreto nº 95.247/87, constituindo direito legalmente assegurado ao empregado. A propósito, conforme consignado pelo juízo de origem, a Súmula nº 460 do TST dispõe que: \" É do empregador o ôn"},{"id":679833057,"data":"2026-07-28","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial de Direito Privado 3","numero":"2087616-71.2026.8.26.0000","classe":"EMBARGOS DE DECLARAçãO CíVEL","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"},{"nome":"PEDRO ANTONIO BRONZATI","polo":"A"},{"nome":"VERA LúCIA MAGNUSSON BRONZATTI","polo":"A"}],"advogados":[{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"DESPACHO\r\n\r\nNº 2087616-71.2026.8.26.0000/50000 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Embargos de Declaração Cível - Guariba - Embargte: Vera Lúcia Magnusson Bronzatti (Justiça Gratuita) - Embargte: Pedro Antonio Bronzati - Embargda: Município de Pradópolis - Vistos. Voto nº 15129. Ao Julgamento virtual (Res. CNJ 591/24). Int. São Paulo, 8 de junho de 2026. - Magistrado(a) José Augusto Genofre Martins - Advs: Clovis Bronzati (OAB: 279195 olução CNJ n.º 591/2024, que os presentes autos serão julgados eletronicamente em sessão virtual. Eventuais pedidos de DESTAQUE (oposição ao julgamento virtual), deverão ser feitos, por meio eletrônico, no portal do ESAJ (https://esaj.tjsp.jus.br/pauta-julgamento-virtual) (Selecione o Órgão julgador e em seguida a data da sessão virtual e clique em \"consultar\"> localize o processo na pauta e clique em \"acompanhar julgamento\"> na parte inferior estará habilitado o pedido de \"destaque\" e \"esclarecimento\"), até 48 (quarenta e oito) horas antes do início da sessão e deferido pelo(a) Relator(a). NOTA: DESTAQUES DEFERIDOS NÃO DISPENSAM AS PARTES DE REALIZAR INSCRIÇÃO PARA PREFERÊNCIA SIMPLES OU SUSTENTAÇÃO ORAL, PERMANECENDO OBRIGATÓRIA A REALIZAÇÃO DE INSCRIÇÃO PELAS PARTES NA SESSÃO QUE VIER A SER DESIGNADA. Nas hipóteses de cabimento de SUSTENTAÇÃO ORAL, é facultado o seu envio por meio eletrônico, no próprio processo, não sendo aceito outro meio, após a publicação da pauta e até 48 (quarenta e oito) horas antes de iniciado o julgamento em ambiente virtual, conforme manual de peticionamento no site: https://www.tjsp.jus.br/Download/PeticionamentoEletronico/Manual_PETIC_ELETRONICO_SAJSG_Julg_Virtual.Pdf MEMORIAIS deverão ser encaminhados, exclusivamente"},{"id":680796217,"data":"2026-07-28","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010262-24.2025.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072718513860100000301809871?instancia=1","partes":[{"nome":"EDBERTO LUIS MIRANDA","polo":"A"},{"nome":"ELIANA APARECIDA DE CASTRO MARTINS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA ATOrd 0010262-24.2025.5.15.0120 AUTOR: ELIANA APARECIDA DE CASTRO MARTINS RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID e7227d6 proferida nos autos. DECISÃO Vistos, etc. Ante a expressa concordância das partes, HOMOLOGO o laudo pericial de id d579b21 por considerá-lo em conformidade com a sentença e v. Acórdão e para que produzam jurídicos efeitos. Honorários periciais contábeis, que neste ato arbitro no importe de R$1.500,00 em favor do perito EDBERTO LUIS MIRANDA, CPF: 071.519.038-55, a cargo da reclamada, será acrescido ao valor da condenação. As contribuições previdenciárias já se encontram deduzidas do crédito do autor. Custas processuais isentas, nos termos do artigo 790-A, I, da CLT. Não há imposto de renda a ser retido do crédito do autor, uma vez que as verbas tributáveis ficam abaixo do limite de isenção, conforme previsto na Instrução Normativa RFB 1.500/2014. Desnecessária a intimação da União-PGF-PSF, ante os termos da Portaria Normativa PGF/AGU Nº 47, DE 7 DE JULHO DE 2023. Por economia e celeridade processuais, deverá o autor, no prazo de cinco dias, informar seus dados bancários e cadastrar a conta bancária no endereço eletrônicohttps://siscondj-adv.trt15.jus.br/adv-dados-bancarios-cadastro/. Será de responsabilidade do exequente informar se já houve o recebimento deste crédito por Ação Civil Coletiva, devendo informar este juízo. Honorários advocatícios em favor do patrono da reclamada: Tendo em vista a concessão de gratuidade de justiça à parte autora, declaro suspensa a exigibilidade quanto aos honorários sucumbenciais, por 2 anos, extinguindo-se tal obrigação após o decurso desse prazo se o credor não demonstrar, inequivocadamente, durante o aludido interregno, a eventual insubsistência da condição de hipossuficiência econômica que ensejou a concessão de gratuidade da justiça, ressalvando que fica vedada a dedução automática de tais honorários do crédito a que tem direito o autor nesta ação ou em qualquer outro processo, de modo que caberá ao credor comprovar que deixou de existir a situação de insu"},{"id":679191823,"data":"2026-07-27","tribunal":"TRT15","orgao":"LIQ1 - Araraquara","numero":"0010498-55.2025.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072417562804000000301639481?instancia=1","partes":[{"nome":"CRISTIANE GONCALVES BRITO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"MELINA CORREA HERNANDES","oab":"SP/289374"},{"nome":"ODAIR JOSE BARCELOS DA SILVA","oab":"SP/314524"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ1 - ARARAQUARA ATOrd 0010498-55.2025.5.15.0029 AUTOR: CRISTIANE GONCALVES BRITO RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID d354586 proferido nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL DESPACHO A reclamada concorda com os cálculos da parte contrária. Intime-se o reclamante para que  junte aos autos, no prazo de 05 dias, o arquivo de cálculo no formato .PJC (arquivo gerado no sistema PJECALC Cidadão) diretamente no PJE. Para tanto, seguem as orientações para inserção do arquivo .pjc no sistema Pje: 1) Cadastrar os documentos das partes (CPF e CNPJ) no momento da elaboração dos cálculos no programa PjeCalc. 2) Ao exportar o cálculo, o arquivo .pjc precisa ser salvo e não pode ser aberto, do contrário será corrompido. 3) Obrigatoriamente, é necessário vincular primeiro o arquivo em PDF através da escolha do tipo de documento “planilha de cálculo” ou “planilha de atualização de cálculo”. Isso porque apenas estes dois tipos de documentos permitirão o surgimento de mais um campo para a juntada do arquivo .pjc. Assim, somente após a vinculação do PDF como “planilha de cálculo” ou “planilha de atualização de cálculo” é que o sistema dará oportunidade de se incluir o arquivo de extenão .pjc. 4) Informar a parte credora e a parte devedora. 5) A seguir, vincular o arquivo .pjc. Alerta-se que a vinculação do arquivo .pjc é um pouco lenta por ser um arquivo pesado e pode dar a falsa impressão de que a operação não está sendo concluída. 6) Operação concluída, o arquivo .pjc aparecerá vinculado. IMPORTANTE: Certifiquem-se sempre de que o programa PjeCalc Cidadão esteja com os índices atualizados para que não haja distorções de valores quando da importação do cálculo para o PjeCalc Institucional. Dúvidas ou orientações sobre noções básicas, importação de arquivos, instalação ou atualização do sistema PJECALC CIDADÃO poder obtidas acessando o link: https://sites.google.com.br/trt15.jus.br/pje-calc-cidadadao. Cumprido, tornem conclusos para decisão de liquidação. ARARAQUARA/SP, 24 de julho de 2026 ANDREA MARIA PFRIMER F"},{"id":679484098,"data":"2026-07-27","tribunal":"TRT15","orgao":"Gabinete do Desembargador Eder Sivers - 12ª Câmara","numero":"0010071-24.2026.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Lista de distribuição","documento":"Distribuição","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/visualizacao/26072500300367900000155185764?instancia=2","partes":[{"nome":"ELIETE TERESA GARCIA BRAGHINI","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"DANILO HENRIQUE NUNES","oab":"SP/359381"}],"texto":"Processo 0010071-24.2026.5.15.0029 distribuído para 12ª Câmara - Gabinete do Desembargador Eder Sivers - 12ª Câmara na data 24/07/2026 \n Para maiores informações, clique no link a seguir: https://pje.trt15.jus.br/pjekz/visualizacao/26072500300367900000155185764?instancia=2"},{"id":679487086,"data":"2026-07-27","tribunal":"TRT15","orgao":"Gabinete do Desembargador Marcos da Silva Porto - 6ª Câmara","numero":"0010072-09.2026.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Lista de distribuição","documento":"Distribuição","meio":"Diário de Justiça Eletr  Resolução CNJ n.º 591/2024, que os presentes autos serão julgados eletronicamente em sessão virtual. Eventuais pedidos de DESTAQUE (oposição ao julgamento virtual), deverão ser feitos, por meio eletrônico, no portal do ESAJ (https://esaj.tjsp.jus.br/pauta-julgamento-virtual) (Selecione o Órgão julgador e em seguida a data da sessão virtual e clique em \"consultar\"> localize o processo na pauta e clique em \"acompanhar julgamento\"> na parte inferior estará habilitado o pedido de \"destaque\" e \"esclarecimento\"), até 48 (quarenta e oito) horas antes do início da sessão e deferido pelo(a) Relator(a). NOTA: DESTAQUES DEFERIDOS NÃO DISPENSAM AS PARTES DE REALIZAR INSCRIÇÃO PARA PREFERÊNCIA SIMPLES OU SUSTENTAÇÃO ORAL, PERMANECENDO OBRIGATÓRIA A REALIZAÇÃO DE INSCRIÇÃO PELAS PARTES NA SESSÃO QUE VIER A SER DESIGNADA. Nas hipóteses de cabimento de SUSTENTAÇÃO ORAL, é facultado o seu envio por meio eletrônico, no próprio processo, não sendo aceito outro meio, após a publicação da pauta e até 48 (quarenta e oito) horas antes de iniciado o julgamento em ambiente virtual, conforme manual de peticionamento no site: https://www.tjsp.jus.br/Download/PeticionamentoEletronico/Manual_PETIC_ELETRONICO_SAJSG_Julg_Virtual.Pdf MEMORIAIS deverão ser encaminhados, exclusivamente, para os e-mails institucionais dos gabinetes disponíveis em: https://www.tjsp.jus.br/CanaisComunic"},{"id":678748658,"data":"2026-07-27","tribunal":"TJSP","orgao":"Processamento 5º Grupo - 11ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"2095941-35.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANTONIO FRANCISCO DE MELLO","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"VANILZA CRISTINA DA SILVA","oab":"SP/302110"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"DESPACHO\r\n\r\nNº 2 NDO AO INTÉRPRETE RESTRINGIR O QUE A LEI NÃO RESTRINGE. SENTENÇA DE PROCEDÊNCIA MANTIDA. RECURSO PARCIALMENTE PROVIDO, PARA OBSERVAR A PRESCRIÇÃO QUINQUENAL. Para eventual interposição de recurso extraordinário, comprovar o recolhimento de R$ 1.325,45 na Guia de Recolhimento da União - GRU, do tipo 'Cobrança' - Ficha de Compensação, a ser emitida no sítio eletrônico do Supremo Tribunal Federal (http://www.stf.jus.br www.stf.jus.br ) ou recolhimento na plataforma PAG Tesouro, nos termos das Resoluções nºs 733/2021 e 766/2022; e para recursos não digitais ou para os digitais que contenham mídias ou outros objetos que devam ser remetidos via malote, o valor referente a porte de remessa e retorno em guia FEDTJ, código 140-6, no Banco do Brasil S.A. ou internet, conforme Resolução nº 875 do STF, de 23 de junho de 2025, e Provimento nº 831/2004 do CSM - Advs: Wesley Luiz Alves de Paula (OAB: 274238/SP) - Lucas Henrique de Oliveira (OAB: 282643/SP) - 16º Andar, Sala 1607"},{"id":679656801,"data":"2026-07-27","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1002349-98.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANA CLAúDIA FERREIRA PINHEIRO","polo":"A"},{"nome":"CRISTIANE APARECIDA ALVES MACARI","polo":"A"},{"nome":"FABIANA SALES COSTA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"SUELI ROSA GUEDES JAEN","polo":"A"},{"nome":"VANESSA GIMENEZ AURéLIO","polo":"A"},{"nome":"VâNIA DE SOUZA GUEDES","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"ANDRÉ FARAONI","oab":"SP/185599"}],"texto":"Processo 1002349-98.2025.8.26.0222 - Procedimento Comum Cível - Isonomia/Equivalência Salarial - Ana Claúdia Ferreira Pinheiro - - Cristiane Aparecida Alves Macari - - Fabiana Sales Costa - - Sueli Rosa Guedes Jaen - - Vanessa Gimenez Aurélio - - Vânia de Souza Guedes - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Primeiramente, ressalte-se que eventuais matérias preliminares arguidas serão analisadas em momento oportuno por força da decisão saneadora. Nesta oportunidade, deverão dizer se pretendem a realização de audiência de tentativa de conciliação, indicando seus e-mails e/ou telefones móveis para viabilização de audiência virtual, sendo silencio interpretado como recusa tácita. Se prejudicada a conciliação, em prosseguimento, com fundamento nos arts.6º e 10º, do Código de Processo Civil, faculto às partes o prazo comum de 15 (quinze) dias para que apontem, de maneira clara, objetiva e sucinta, as questões de fato e de direito que entendam pertinentes ao julgamento da lide. Quanto às questões de fato, deverão indicar a matéria que consideram incontroversa, bem como aquela que entendem já provada pela prova trazida, enumerando nos autos os documentos que servem de suporte a cada alegação. Com relação ao restante, remanescendo controvertida, deverão especificar as provas que pretendem produzir, justificando, objetiva e fundamentadamente, sua relevância e pertinência. Caso pretendam produzir prova oral em audiência (artigo 455, do Código de Processo Civil), deverão apresentar o rol de testemunhas, com os respectivos endereços, no prazo em evidência, sob pena de preclusão. O silêncio ou o protesto genérico por produção de provas serão interpretados como anuência ao julgamento antecipado, indeferindo-se, ainda, os requerimentos de diligências inúteis ou meramente protelatórias. Quanto às questões de direito, para que não se alegue prejuízo, deverão, desde logo, manifestar-se sobre a matéria cognoscível de ofício pelo juízo, desde que interessem ao processo. Com relação aos argumentos jurídicos trazidos pelas partes, deverão estar de acordo com toda a legislação vigente, que, presume-se, tenha sido estudada até o esgotamento pelos litigantes, e cujo desconhecimento não po"},{"id":677376026,"data":"2026-07-24","tribunal":"TRT15","orgao":"Gabinete da Vice-Presidência Judicial - Análise de Recurso","numero":"0011147-09.2023.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072311385361700000155063285?instancia=2","partes":[{"nome":"CALIXTO JOSE DOS SANTOS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO ÓRGÃO ESPECIAL - ANÁLISE DE RECURSO Relatora: ANTONIA SANT ANA ROT 0011147-09.2023.5.15.0120 RECORRENTE: CALIXTO JOSE DOS SANTOS RECORRIDO: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID b73e14e proferida nos autos. Tramitação Preferencial ROT 0011147-09.2023.5.15.0120 - 8ª Câmara Recorrente:   Advogado(s):   1. CALIXTO JOSE DOS SANTOS ALDAIR CANDIDO DE SOUZA (SP201321) LAIS CRISTINA DE SOUZA (SP319009) TANIA APARECIDA FONZARE DE SOUZA (SP322908) Recorrido:   MUNICIPIO DE PRADOPOLIS RECURSO DE: CALIXTO JOSE DOS SANTOS   PRESSUPOSTOS EXTRÍNSECOS Recurso tempestivo (ciência da decisão em 16/04/2026 - Id 620b543; recurso apresentado em 30/04/2026 - Id 237119c). Regular a representação processual. Dispensado o preparo.   PRESSUPOSTOS INTRÍNSECOS 1.1  DIREITO INDIVIDUAL DO TRABALHO (12936) / VERBAS REMUNERATÓRIAS, INDENIZATÓRIAS E BENEFÍCIOS (13831) / SALÁRIO/DIFERENÇA SALARIAL (13858) / SALÁRIO POR ACÚMULO DE CARGO/FUNÇÃO Consignou o v. acórdão: \"Para o reconhecimento do acúmulo de função, apto a ensejar reparação salarial, faz-se necessário a demonstração do prejuízo, não bastando a prova eficaz do exercício de função diversa à inicialmente contratada, sendo indispensável a confirmação do desnível salarial. Na falta destes elementos presume-se que o empregado está obrigado a todo e qualquer serviço compatível com sua condição pessoal, nos termos do artigo 456, § único da CLT. No caso, improspera a irresignação por não ter o reclamante se desvencilhado a contento de seu ônus probatório quanto ao fato constitutivo de seu direito (art. 818 da CLT e 373, I, do CPC), uma vez que, conforme o relato da única testemunha ouvida, o autor auxilia na carga e descarga do caminhão, esclarecendo o testigo que \"(...) o reclamante já dirigiu o caminhão e a Fiorino; que ambos os veículos transportavam merenda\"(ID. a3cb311 - p. 239), o que significa que o autor não logrou comprovar suas alegações, vez que as atividades exercidas eram conexas ao labor para o qual foi contratado. Atenta-se que na inicial, o reclamante relata que foi admitido na função de serviços ge"},{"id":677619145,"data":"2026-07-24","tribunal":"TRT15","orgao":"2ª Câmara","numero":"0010849-28.2025.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072314060282100000155083066?instancia=2","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"NELISE CRISTINA MARTINS DE OLIVEIRA","polo":"A"},{"nome":"NELISE CRISTINA MARTINS DE OLIVEIRA","polo":"P"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO 2ª CÂMARA Relator: HELIO GRASSELLI ROT 0010849-28.2025.5.15.0029 RECORRENTE: NELISE CRISTINA MARTINS DE OLIVEIRA E OUTROS (1) RECORRIDO: NELISE CRISTINA MARTINS DE OLIVEIRA E OUTROS (1) Ficam as partes intimadas do acórdão proferido no presente processo (Artigo 17 da Resolução CSJT nº 185/2017 c/c Lei nº 13.467/2017). Acesso ao sistema PJe- JT - 2º grau: http://pje.trt15.jus.br/consul
