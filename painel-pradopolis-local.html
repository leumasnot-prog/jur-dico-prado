 OJ 394 do TST e adicional de insalubridade em grau máximo com limitações temporais distintas) [200, 227], bem como visando a celeridade processual, designo perícia contábil do juízo [164]. Nomeio a perita contábil MARIA CAROLINA DA SILVA, que deverá entregar seu laudo pericial contábil no prazo de 20 (vinte) dias úteis, observando estritamente os limites e parâmetros traçados pelo julgado [164, 165]. Apresentado o laudo pericial, intimem-se as partes para, querendo, se manifestarem de forma específica e fundamentada sobre as contas, no prazo preclusivo de 08 (oito) dias, nos termos do ar"},{"id":708379640,"data":"2026-08-26","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010456-84.2017.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082515414683700000305278594?instancia=1","partes":[{"nome":"MARIA APARECIDA ROSSI MARTINS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"MG/186091"},{"nome":"LAIZA SOARES DONATO","oab":"SP/394178"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CAROLINE COLMANETTI SILVA","oab":"SP/348818"},{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA ATOrd 0010456-84.2017.5.15.0029 AUTOR: MARIA APARECIDA ROSSI MARTINS RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 6575f1d proferido nos autos. Órgão Julgador de Origem: 1ª VARA DO TRABALHO DE JABOTICABAL Prioridade(s): Idoso DESPACHO Petição de ID 1f04c20 - ante o requerimento da parte reclamante (obrigação de fazer), prejudicando a apresentação dos cálculos neste momento, revejo a determinação judicial de ID e7b1597, para que no prazo de 20 dias, o ente público municipal apresente eventual manifestação / contestação ao requerimento, e/ou comprove o cumprimento da obrigação de fazer imposta. Havendo cumprimento da obrigação de fazer e respectiva confirmação da parte reclamante, deverão ser reabertos os prazos para apresentação dos cálculos de liquidação, reiniciando os procedimentos da fase de liquidação. Intimem-se. ARARAQUARA/SP, 25 de agosto de 2026 ANDREA MARIA PFRIMER FALCAO Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - MARIA APARECIDA ROSSI MARTINS"},{"id":708443589,"data":"2026-08-26","tribunal":"TRT15","orgao":"EXE4 - Araraquara","numero":"0010012-64.2020.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082516093882200000305287999?instancia=1","partes":[{"nome":"FREDERICO CARLOS DE PINHO PRADO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"TERESA OLINDA DA SILVA DE OLIVEIRA","polo":"A"}],"advogados":[{"nome":"PAULO SERGIO MOREIRA DA SILVA","oab":"SP/165937"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO EXE4 - ARARAQUARA PROCESSO: ATOrd 0010012-64.2020.5.15.0120 AUTOR: TERESA OLINDA DA SILVA DE OLIVEIRA RÉU: MUNICIPIO DE PRADOPOLIS Ficam V. Sa. intimadas para indicar dados bancários completos nos autos, em até 48 horas, obrigatórios para expedição de Precatório. No caso de dados de sociedade de advogados, a mesma deverá fazer parte da procuração outorgada nos autos.    ...\n\nIntimado(s) / Citado(s)\n - TERESA OLINDA DA SILVA DE OLIVEIRA"},{"id":708141608,"data":"2026-08-26","tribunal":"TST","orgao":"Presidência - Admissibilidade","numero":"0011312-22.2024.5.15.0120","classe":"AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA","tipo":"Intimação","documento":"DECISÃO MONOCRÁTICA","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.tst.jus.br/pjekz/validacao/26082513305219900000200291495?instancia=3","partes":[{"nome":"MARCELO WILSON APARECIDO MORETTO","polo":"P"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"}],"advogados":[{"nome":"CASSIA JORGE DE MORAES","oab":"SP/407536"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL SUPERIOR DO TRABALHO PRESIDÊNCIA - ADMISSIBILIDADE Relator: LUIZ PHILIPPE VIEIRA DE MELLO FILHO AIRR 0011312-22.2024.5.15.0120 AGRAVANTE: MUNICIPIO DE PRADOPOLIS AGRAVADO: MARCELO WILSON APARECIDO MORETTO A secretaria do(a) Presidência - Admissibilidade intima as partes do processo para tomarem ciência da decisão de id (4c33075) proferida nos autos do processo 0011312-22.2024.5.15.0120 cujo conteúdo, conforme previsão do inciso I, art. 13, da Resolução nº 455/2018 do CNJ e do § 3º, art. 205, do CPC/2015, está transcrito a seguir: Poder Judiciário Justiça do Trabalho Tribunal Superior do Trabalho PROCESSO Nº TST-AIRR - 0011312-22.2024.5.15.0120 AGRAVANTE: MUNICIPIO DE PRADOPOLIS AGRAVADO: MARCELO WILSON APARECIDO MORETTO ADVOGADA: Dra. CASSIA JORGE DE MORAES CUSTOS LEGIS: MINISTÉRIO PÚBLICO DO TRABALHO GPVMF/back D E C I S Ã O Trata-se de agravo de instrumento interposto com o fito de reformar decisão denegatória de seguimento do recurso de revista. Desnecessária a remessa dos autos ao Ministério Público do Trabalho, nos termos do art. 95 do RITST. É o relatório. Conheço do agravo de instrumento, porque tempestivo, bem como regulares a representação processual e o preparo. Por meio de decisão monocrática do Tribunal Regional de origem, foi denegado seguimento ao recurso de revista sob os seguintes fundamentos: PRESSUPOSTOS EXTRÍNSECOS Recurso tempestivo (ciência da decisão em 05/02/2026 - Id ff01d2a; recurso apresentado em 03/02/2026 - Id f7826e1). Regular a representação processual (nos termos daSúmula 436, item I/TST). Isento de preparo (CLT, art. 790-A e DL 779/69, art. 1º, IV). PRESSUPOSTOS INTRÍNSECOS 1.1 DIREITO INDIVIDUAL DO TRABALHO (12936) / DURAÇÃO DO TRABALHO (13764) / REPOUSO SEMANAL REMUNERADO E FERIADO 1.2 DIREITO INDIVIDUAL DO TRABALHO (12936) / DURAÇÃO DO TRABALHO (13764) / HORAS EXTRAS DESCANSO SEMANAL REMUNERADO CARGA SUPLEMENTAR SEM ADICIONAL - HORAS EXTRAS - DIFERENÇAS No que se refere aos temas em destaque, inviável o recurso, pois não atendida a exigência prevista no art. 896, § 1º-A, I a III, da CLT. Com efeito, a transcrição de trechos do v. acórdão recorrido no início do recurso, dissociados d"},{"id":707866836,"data":"2026-08-26","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1002928-80.2024.8.26.0222","classe":"MANDADO DE SEGURANçA CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"SILVIO MARTINS","polo":"P"}],"advogados":[{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"SAULO EMANUEL ATIQUE","oab":"SP/218159"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Processo 1002928-80.2024.8.26.0222 - Mandado de Segurança Cível - Garantias Constitucionais - Clovis Bronzati - Silvio Martins - - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Manifeste(m)-se a(s) parte(s) requerida(s) acerca dos embargos de declaração opostos pela parte adversa, no prazo de 05 dias. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP), SAULO EMANUEL ATIQUE (OAB 218159/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP)"},{"id":707866847,"data":"2026-08-26","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1000034-63.2026.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PEDRO MOREIRA DE SOUZA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000034-63.2026.8.26.0222 - Procedimento Comum Cível - Apuração de haveres - Pedro Moreira de Souza - PREFEITURA MUNICIPAL DE PRADÓPOLIS - DISPOSITIVO Ante o exposto, julgo IMPROCEDENTES os pedidos formulados por Pedro Moreira de Souza em face da Prefeitura Municipal de Pradópolis, com resolução do mérito, nos termos do art. 487, inciso I, do Código de Processo Civil, no que diz respeito às diferenças de adicional por tempo de serviço, à sexta-parte, à licença-prêmio e aos respectivos reflexos em férias, terço constitucional, 13º salário, FGTS e demais verbas vinculadas, por ausência de amparo jurídico à luz da inexistência de direito adquirido a regime jurídico; e EXTINTO COM RESOLUÇÃO DO MÉRITO, nos termos do art. 487, inciso II, do Código de Processo Civil, o pedido referente ao abono salarial da Lei Federal nº 8.178/1991 e seus reflexos, em razão do reconhecimen-to da prescrição do fundo de direito. Em razão da sucumbência, condeno o autor ao pagamento das despesas processuais e dos honorários advocatícios sucumbenciais, fixados em 10% sobre o valor da causa, nos termos do art. 85, § 2º, do Código de Processo Civil, observando-se, porém, que referida condenação fica suspensa em face da gratuidade da justiça concedida nos autos, nos termos do art. 98, § 3º, do mesmo diploma legal. Transitada em julgado, arquivem-se os autos com as cautelas de praxe. Publique-se. Intimem-se. Guariba, 25 de agosto de 2026. Leonardo Mussin de Freitas Juiz de Direito - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), DANIEL DE SOUZA SILVA (OAB 297740/SP)"},{"id":707964358,"data":"2026-08-26","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1002578-58.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"TEREZINHA APARECIDA GARCIA","polo":"A"}],"advogados":[{"nome":"CASSIA JORGE DE MORAES","oab":"SP/407536"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1002578-58.2025.8.26.0222 - Procedimento Comum Cível - Indenização Trabalhista - Terezinha Aparecida Garcia - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Inicialmente, rejeito a preliminar de impugnação à gratuidade de justiça apresenta-da pela Fazenda Municipal, pois a autora sequer pleiteou a benesse, tendo pagado a taxa judiciária. Já a respeito da prescrição quinquenal, aplicável ao caso em razão dos contornos da lide, conforme Súmula nº 85 do Superior Tribunal de Justiça; considerando que a ação foi ajuizada em 16/12/2025, devem ser reputadas prescritas as parcelas vencidas anteriormente a 16/12/2020. A prescrição é meramente parcelar, contudo, e não atinge o fundo de direito. Melhor compulsando os autos, observo irregularidade na representação processual da parte requerente, pois a rubrica constante no instrumento de procuração (p. 12) é apenas uma as-sinatura digitalizada ou escaneada, e não uma assinatura digital. É inadmissível assinatura digitalizada ou escaneada no instrumento procuratório, por se tratar de mera inserção de imagem em documento. Nesse sentido, segue entendimento do Egrégio STJ: PROCESSUAL CIVIL. AGRAVO INTERNO NOS EMBARGOS DE DIVERGÊNCIA. VÍCIO DA REPRESENTAÇÃO PROCESSUAL. RECORRENTE INTIMADO A REGULARIZAR. NÃO MANIFESTAÇÃO. RECURSO NÃO CONHECIDO. AGRAVO INTERNO QUE NÃO COMBATE AS RAZÕES DA DECISÃO RECORRIDA. DEFICIÊNCIA DA FUNDAMENTAÇÃO. SÚMULAS 283 E 284 DO STF. ASSINATURA DIGITALIZADA. 1. Trata-se de Agravo Interno interposto contra decisão monocrática da Presidência do STJ que indeferiu liminarmente os Embargos de Divergência em razão da existência de irregularidade na representação processual dos Embargos de Divergência. Conforme despacho de fls. 880, e-STJ, a recorrente foi intimada para regularizar a representação processual, pois \"o substabelecimento conferindo poderes, nos autos, ao subscritor do recurso de embargos de divergência, Dra. Natasha Annibal Neves, apresenta assinatura digitalizada/escaneada, sendo, portanto, inválida.\" Foi dado prazo de 5 (cinco) dias para a regularização, os quais passaram in albis, conforme certidão de fls. 883, e-STJ. 2. Nas razões do Agravo Interno, a fundamentação da decisão recorrid"},{"id":708448442,"data":"2026-08-26","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1000068-38.2026.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"G FARIA EMPREENDIMENTOS ADMINISTRACAO E PARTICIPACOES LTDA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"ALEXANDRE MENDES PINTO","oab":"SP/153869"},{"nome":"TONY RAFAEL BICHARA","oab":"SP/239949"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000068-38.2026.8.26.0222 - Procedimento do Juizado Especial da Fazenda Pública - Anulação de Débito Fiscal - G Faria Empreendimentos Administracao e Participacoes Ltda - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos, Diante do pedido da autora de fl. 128, manifeste-se a executada em 10 dias. Intime-se. - ADV: ALEXANDRE MENDES PINTO (OAB 153869/SP), TONY RAFAEL BICHARA (OAB 239949/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":708520058,"data":"2026-08-26","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0001739-84.2024.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"EDSON TEIXEIRA DO NASCIMENTO","polo":"A" ":"2026-08-25","tribunal":"TRT15","orgao":"Assessoria de Precatórios","numero":"0045671-04.2023.5.15.0000","classe":"PRECATÓRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082410494946600000157080969?instancia=2","partes":[{"nome":"E.C.D.O.D.C.","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO TRIBUNAL PLENO Relator: SAMUEL HUGO LIMA Precat 0045671-04.2023.5.15.0000 REQUERENTE: ELIANA CRISTINA DE OLIVEIRA DE CARVALHO REQUERIDO: MUNICIPIO DE PRADOPOLIS Despacho De ordem da Presidência deste Egrégio Tribunal, após constatada a regularidade do CPF do beneficiário mediante consulta ao sistema CRC-Jud/sítio da Receita Federal, e ainda, tendo em vista a existência de numerário para envio ao processo, dê-se ciência às partes dos valores atualizados para fins de adimplemento, conforme planilha juntada aos autos, concedendo-se o prazo de 5 (cinco) dias úteis para eventual manifestação quanto aos valores corrigidos. Isto posto, concedo o mesmo prazo para que o(s) credor(es) apresente(m) os dados bancários (nome e CPF do titular; números da agência, conta e operação — se o caso). Ressalta-se que, caso a conta informada esteja vinculada ao patrono da parte, deverá ser juntada procuração nos autos do presente processo precatório com poderes específicos para receber e dar quitação. Decorrido o prazo sem que haja a indicação de conta bancária válida para transferência, ou se os dados forem apresentados em desconformidade com os requisitos formais, ou ainda, na ausência de procuração válida, os valores serão creditados conforme os dados bancários constantes do Ofício Precatório ou em conta de titularidade do beneficiário identificada no sistema “CCS - Cadastro de Clientes do SFN”. Na hipótese de haver valores a serem pagos a título de FGTS, o beneficiário deverá apresentar, também no prazo acima estipulado, as seguintes informações: data de admissão, número do PIS, número e série da CTPS e data de nascimento, os quais são indispensáveis para o regular recolhimento em conta vinculada. Caso não sejam apresentados os dados necessários ao depósito do FGTS, os valores relativos ao recolhimento serão destinados ao PJE2, onde ficarão provisionados até ulterior apresentação dos dados pelo interessado. Transcorrido o prazo de manifestação, e inexistindo óbices ao pagamento, os valores devidos serão efetivamente disponibilizados ao beneficiário no prazo de até 60 (sessenta) dias, nos termos do art"},{"id":706388966,"data":"2026-08-25","tribunal":"TRT15","orgao":"Assessoria de Precatórios","numero":"0045822-67.2023.5.15.0000","classe":"PRECATÓRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082410533752200000157081775?instancia=2","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"S.D.S.A.","polo":"A"},{"nome":"UNIÃO FEDERAL (PGF)","polo":"A"}],"advogados":[{"nome":"PAULO SERGIO MOREIRA DA SILVA","oab":"SP/165937"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO TRIBUNAL PLENO Relator: SAMUEL HUGO LIMA Precat 0045822-67.2023.5.15.0000 REQUERENTE: SOLANGE DA SILVA ALCANTARA REQUERIDO: MUNICIPIO DE PRADOPOLIS Despacho De ordem da Presidência deste Egrégio Tribunal, após constatada a regularidade do CPF do beneficiário mediante consulta ao sistema CRC-Jud/sítio da Receita Federal, e ainda, tendo em vista a existência de numerário para envio ao processo, dê-se ciência às partes dos valores atualizados para fins de adimplemento, conforme planilha juntada aos autos, concedendo-se o prazo de 5 (cinco) dias úteis para eventual manifestação quanto aos valores corrigidos. Isto posto, concedo o mesmo AB 266809/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":705166637,"data":"2026-08-24","tribunal":"TST","orgao":"8ª Turma","numero":"0010685-23.2021.5.15.0120","classe":"AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.tst.jus.br/pjekz/validacao/26082114185834200000199358753?instancia=3","partes":[{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"SUELI RODRIGUES DE OLIVEIRA","polo":"P"}],"advogados":[{"nome":"PAULO SERGIO MOREIRA DA SILVA","oab":"SP/165937"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL SUPERIOR DO TRABALHO 8ª TURMA Relatora: MARIA HELENA MALLMANN AIRR 0010685-23.2021.5.15.0120 AGRAVANTE: MUNICIPIO DE PRADOPOLIS AGRAVADO: SUELI RODRIGUES DE OLIVEIRA A secretaria do(a) 8ª Turma intima as partes do processo para tomarem ciência do acórdão de id (3309afe) proferido nos autos do processo 0010685-23.2021.5.15.0120 cujo conteúdo, conforme previsão do inciso I, art. 13, da Resolução nº 455/2018 do CNJ e do § 3º, art. 205, do CPC/2015, está transcrito a seguir: Poder Judiciário Justiça do Trabalho Tribunal Superior do Trabalho PROCESSO Nº TST-AIRR - 0010685-23.2021.5.15.0120 A C Ó R D Ã O 8ª Turma GMMHM/lcb/gm AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA. EXECUÇÃO. OFENSA À COMPETÊNCIA LEGISLATIVA PRIVATIVA DA UNIÃO. AUSÊNCIA DE TRANSCRIÇÃO. DESCUMPRIMENTO DO ART. 896, §1º-A, I, DA CLT. TRANSCENDÊNCIA NÃO EXAMINADA. No caso, o recurso de revista mostra-se inviável, pois a executada não procedeu à transcrição dos fundamentos do acórdão regional que consubstanciam o prequestionamento da controvérsia. Nesse sentido, a parte descumpriu a diretriz prevista no art. 896, § 1º-A, I, da CLT. Conforme entendimento desta Corte Superior, a indicação do trecho da decisão regional que consubstancia o prequestionamento da matéria objeto do recurso é encargo da parte recorrente, exigência formal intransponível ao conhecimento do recurso de revista. Nesses termos, diante do óbice delineado, incabível o exame da transcendência. Agravo de instrumento a que se nega provimento. DA ANÁLISE DA VARIAÇÃO DO PERCENTUAL DO ABONO DA LEI Nº 8.178/1991. APLICAÇÃO DO CÁLCULO DE ABONO AOS SERVIDORES ATIVOS. DA APLICAÇÃO DO ABONO AOS SERVIDORES APOSENTADOS. DA INOBSERVÂNCIA DA JURISPRUDÊNCIA VINCULANTE DO STF - TEMA 1143. TRANSCRIÇÃO CONJUNTA NO INÍCIO DAS RAZÕES RECURSAIS. DESCUMPRIMENTO DO ART. 896, §1º-A, I e III, DA CLT. TRANSCENDÊNCIA NÃO EXAMINADA. 1. A transcrição de trechos do acórdão recorrido, no início das razões do recurso, não atende à exigência legal, sendo necessário que a recorrente promova a correlação das teses discutidas em cada um dos temas objeto de insurgência recursal. 2. O art. 896, § 1º - A, I e III, da CLT exige qu"},{"id":705262202,"data":"2026-08-24","tribunal":"TST","orgao":"4ª Turma","numero":"0010994-39.2024.5.15.0120","classe":"AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA","tipo":"Intimação","documento":"DECISÃO MONOCRÁTICA","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.tst.jus.br/pjekz/validacao/26082115203653100000199378266?instancia=3","partes":[{"nome":"ELIENE SOUSA DE LAURENA","polo":"A"},{"nome":"LM SERVICOS INTEGRADOS LTDA","polo":"P"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"FABIO FREJUELLO","oab":"SP/299619"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL SUPERIOR DO TRABALHO 4ª TURMA Relator: IVES GANDRA DA SILVA MARTINS FILHO AIRR 0010994-39.2024.5.15.0120 AGRAVANTE: ELIENE SOUSA DE LAURENA AGRAVADO: MUNICIPIO DE PRADOPOLIS E OUTROS (1) A secretaria do(a) 4ª Turma intima as partes do processo para tomarem ciência da decisão de id (11307c7) proferida nos autos do processo 0010994-39.2024.5.15.0120 cujo conteúdo, conforme previsão do inciso I, art. 13, da Resolução nº 455/2018 do CNJ e do § 3º, art. 205, do CPC/2015, está transcrito a seguir: Poder Judiciário Justiça do Trabalho Tribunal Superior do Trabalho PROCESSO Nº TST-AIRR - 0010994-39.2024.5.15.0120 AGRAVANTE: ELIENE SOUSA DE LAURENA ADVOGADO: Dr. FABIO FREJUELLO AGRAVADO: MUNICIPIO DE PRADOPOLIS AGRAVADO: LM SERVICOS INTEGRADOS LTDA CUSTOS LEGIS: MINISTÉRIO PÚBLICO DO TRABALHO IGM/fb D E C I S Ã O I) RELATÓRIO Contra o despacho da Vice-Presidência do 15º TRT, que denegou seguimento ao seu recurso de revista, com base no art. 896, “a” e “c”, da CLT, por estar o entendimento proferido no acórdão regional em sintonia com o Tema 1.118 do STF, a Reclamante interpõe agravo de instrumento, pretendendo o reexame da questão relativa à responsabilidade subsidiária da Administração Pública. Foram apresentadas contraminuta ao agravo de instrumento e contrarrazões ao recurso de revista, pelo Município Reclamado, tendo o Ministério Público do Trabalho, em manifestação do Dr. Rafael Gazzaneo Júnior, deixado de emitir parecer circunstanciado. II) FUNDAMENTAÇÃO Tratando-se de agravo de instrumento interposto contra despacho denegatório de recurso de revista referente a acórdão regional publicado após a entrada em vigor da Lei 13.467/17, tem-se que o apelo ao TST deve ser analisado à luz do critério da transcendência previsto no art. 896-A da CLT. Para deslinde do caso, convém traçar um rápido escorço histórico da evolução da jurisprudência quanto à matéria. Ao julgar a ADC 16-DF em 2010, o STF reconheceu a constitucionalidade do art. 71, § 1º, da Lei 8.666/93, que não admitia a responsabilidade subsidiária da Administração Pública na hipótese de inadimplemento das obrigações trabalhistas por parte de empresa que lhe presta ser"},{"id":705591783,"data":"2026-08-24","tribunal":"TST","orgao":"Subseção II Especializada em Dissídios Individuais","numero":"0020030-77.2024.5.15.0000","classe":"AGRAVO","tipo":"Intimação","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://sessao-integracao-backend.prd.rede.tst/documentos/PJe--2933/20030-77.2024.5.15.0000/certidao-inclusao-pauta/MjQvMDgvMjAyNiAwMDowMDowMCM2NzUyODYyMjg=","partes":[{"nome":"CRISTINA MADALENA QUAGLIO LEONI MEDEIROS","polo":"A"},{"nome":"CRISTINA MADALENA QUAGLIO LEONI MEDEIROS","polo":"P"},{"nome":"JOSEANE DE SOUZA SOARES LIMA","polo":"A"},{"nome":"JOSEANE DE SOUZA SOARES LIMA","polo":"P"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"}],"texto":"Pauta de Julgamento (processos PJe) da Sessão Ordinária da Subseção II Especializada em Dissídios Individuais, a realizar-se exclusivamente em ambiente eletrônico (sessão virtual).\n\nA sessão virtual terá início no dia 17/09/2026 e encerramento 24/09/2026.\n\n1. Sustentação oral na sessão virtual:\n\n1.1. Sustentações eletrônicas: Nas hipóteses de cabimento de sustentação oral, fica facultado ao advogado encaminhar a sustentação por meio eletrônico, após a publicação da pauta até 48 horas antes do início da sessão virtual (art. 134-A do RITST). Neste caso, o julgamento será realizado em ambiente eletrônico (sessão virtual).\n\n1.2. Formato e responsabilidade: As sustentações devem seguir as especificações técnicas do Tribunal (Ato SEGJUD.GP nº 129/2025), e o advogado firmará termo de declaração de que se encontra devidamente habilitado nos autos e de responsabilidade pelo conteúdo do arquivo enviado (art. 134-A, §§ 3º e 4º, do RITST).\n\n\n\n2. Destaque para julgamento em sessão presencial:\n\n2.1. Prazo: O pedido de destaque pode ser feito desde a publicação da pauta até 48 horas antes do início da sessão virtual (art. 135, II, do RITST).\n\n2.2. Requerimento: O advogado deve formalizar o pedido de destaque por meio de inscrição eletrônica no endereço https://www.tst.jus.br/portal-da-advocacia.\n\n2.3. Condição: O pedido de destaque só poderá ser realizado se o julgamento do processo comportar sustentação oral, e será submetido à consideração do relator. Em caso de deferimento, o processo será remetido para julgamento presencial, com publicação de nova pauta (art. 135 do RITST).\n\n\n\nObservação: Caso opte por encaminhar a sustentação oral por meio eletrônico, o advogado não poderá requerer o destaque do processo para julgamento presencial (art. 134-A, § 5º, do RITST).\n\n\nProcesso Ag-ROT - 20030-77.2024.5.15.0000 incluído no PLENARIO VIRTUAL.\nRelator: MINISTRO LUIZ JOSÉ DEZENA DA SILVA.\n\nADRIANA MEDEIROS\nSecretária da Subseção II Especializada em Dissídios Individuais."},{"id":705591872,"data":"2026-08-24","tribunal":"TST","orgao":"Subseção II Especializada em Dissídios Individuais","numero":"0011932-06.2024.5.15.0000","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://sessao-integracao-backend.prd.rede.tst/documentos/PJe--2933/11932-06.2024.5.15.0000/certidao-inclusao-pauta/MjQvMDgvMjAyNiAwMDowMDowMCM3NjI1NDAyNTM=","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"NEUZA APARECIDA AMBRIQUE DA SILVA","polo":"A"},{"nome":"NEUZA APARECIDA AMBRIQUE DA SILVA","polo":"P"}],"advogados":[{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBER \nSecretária da Subseção II Especializada em Dissídios Individuais."},{"id":705491195,"data":"2026-08-24","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010917-41.2026.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082117120617900000304907491?instancia=1","partes":[{"nome":"MARCOS ANTONIO DIAS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA PROCESSO: ATOrd 0010917-41.2026.5.15.0029 AUTOR: MARCOS ANTONIO DIAS RÉU: MUNICIPIO DE PRADOPOLIS Órgão Julgador de Origem: 1ª VARA DO TRABALHO DE JABOTICABAL   NOTIFICAÇÃO AUDIÊNCIA INICIAL TELEPRESENCIAL DESTINATÁRIO: MARCOS ANTONIO DIAS ENDEREÇO: Expediente enviado por outro meio Pela presente, fica V. Sa. notificado(a) a comparecer à audiência  INICIAL designada para 10/02/2027 15:50 horas. A audiência será realizada telepresencialmente pela plataforma Zoom, por meio do link:  https://zoom.us/j/3072626738 ID da reunião: 3072626738   Senha: 159753 Orientações sobre o uso da plataforma ZOOM podem ser obtidas no site-https://sites.google.com/trt15.jus.br/zoomadv/pagina-inicial . O acesso à audiência poderá ser efetivado pelo uso de smartphone ou computador pessoal com câmera. Nos termos do art. 844 da CLT, a ausência da parte autora implicará arquivamento do feito e o(s) réu(s) deverá(ão) comparecer pessoalmente (ou por preposto que tenha conhecimento dos fatos) e apresentar defesa até o horário da audiência, sob pena de revelia e confissão quanto à matéria de fato, presumindo-se verdadeiros os fatos alegados pela parte autora. Com a defesa, o(s) réu(s) deverá(ão) apresentar, no Processo Judicial Eletrônico (PJe), em formato PDF, documentos pessoais, instrumento constitutivo (contrato social), se pessoa jurídica, e documentos que pretende utilizar como prova. Para conhecimento do pedido, o(s) réu(s) deverão acessar a petição inicial pela página eletrônica (https://pje.trt15.jus.br/pjekz/validacao), digitando a(s) chave(s): 26080520095342800000302952057 As partes não precisam levar testemunhas nesta audiência. A comunicação da designação direta à parte deve ser feita por seu respectivo patrono. .\n\nIntimado(s) / Citado(s)\n - MARCOS ANTONIO DIAS"},{"id":704652034,"data":"2026-08-24","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial - UPJ do Colégio Recursal dos Juizados Especiais do Estado de São Paulo","numero":"1000016-42.2026.8.26.0222","classe":"RECURSO INOMINADO CíVEL","tipo":"Intimação","documento":"Próximos Julgados","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"},{"nome":"ROSIMEIRE TEDELK MONSALVE","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"1000016-42.2026.8.26.0222 - Processo Digital - Recurso Inominado Cível - Guariba - Relator Wander Pereira Rossette Júnior - CR - Recorrente: Município de Pradópolis - Recorrida: Rosimeire Tedelk Monsalve - Advogado: Wesley Luiz Alves de Paula (OAB: 274238/SP) - Advogado: Daniel de Souza Silva (OAB: 297740/SP)PAUTADO EM SESSÃO ELETRÔNICA ORDINÁRIA DA(O) 2ª TURMA RECURSAL DE FAZENDA PÚBLICA A REALIZAR-SE DE FORMA VIRTUAL COM INÍCIO EM 3 DE SETEMBRO DE 2026 (QUINTA-FEIRA) ÀS 00:01 HORAS E TÉRMINO EM 11 DE SETEMBRO DE 2026 (SEXTA-FEIRA) ÀS 23:59 HORAS."},{"id":704759885,"data":"2026-08-24","tribunal":"TJSP","orgao":"Distribuição Originários Direito Público, Câm. Especializadas e Meio Ambiente - Palácio da Justiça - sala 109","numero":"2207679-28.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Distribuídos","meio": parte requerente 5 (cinco) dias de prazo para que junte aos autos comprovante atualizado de situação cadastral \"Regular\" do CPF (ou \"Ativa\" do CNPJ) de todos os beneficiários/sociedades de advogados constantes da requisição, emitido pelo site da Receita Federal. Após, tornem os autos conclusos. Decorrido o prazo sem cumprimento, proceda-se à baixa definitiva dos autos deste incidente, com as cautelas de praxe. Intimem-se. - ADV: LEANDRO HENRIQUE DE OLIVEIRA PATETE (OAB 468388/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":705600576,"data":"2026-08-24","tribunal":"TJSP","orgao":"Foro de Ribeirão Preto - 2ª Vara da Fazenda Pública","numero":"0020967-66.2024.8.26.0506","classe":"PRECATÓRIO","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANGELICA MARTINS","polo":"A"},{"nome":"MUNICÍPIO DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"ANGELICA MARTINS","oab":"SP/351490"}],"texto":"Processo 0020967-66.2024.8.26.0506/04 - Precatório - Indenização por Dano Moral - Angelica Martins - MUNICÍPIO DE PRADÓPOLIS - Vistos. Nos termos do art. 6º, §3º, da Resolução nº 303/2019 do CNJ, com redação dada pela Resolução CNJ nº 482/2022, os ofícios requisitórios de pagamento somente deverão ser expedidos após a prévia verificação e comprovação da situação cadastral regular do CPF ou ativa do CNPJ do beneficiário perante a Receita Federal. A ausência do referido comprovante atualizado inviabiliza a validação dos dados pelo setor de precatórios e pode ensejar a devolução do ofício requisitório, gerando atrasos processuais. Assim, concedo à parte requerente 5 (cinco) dias de prazo para que junte aos autos comprovante atualizado de situação cadastral \"Regular\" do CPF (ou \"Ativa\" do CNPJ) de todos os beneficiários/sociedades de advogados constantes da requisição, emitido pelo site da Receita Federal. Após, tornem os autos  Spoladore Dominguez - Advs: Clovis Bronzati (OAB: 279195/SP) - Viviane Cristina Bronzati (OAB: 444669/SP) - Wesley Luiz Alves de Paula (OAB: 274238/SP) - 1° andar"},{"id":706074134,"data":"2026-08-24","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1002356-95.2022.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"NADYR RAPOSO BRONZATI","polo":"A"},{"nome":"OSWALDO BRONZATTI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 1002356-95.2022.8.26.0222 - Procedimento Comum Cível - Anulação de Débito Fiscal - Nadyr Raposo Bronzati - - Oswaldo Bronzatti - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Fls. 882/889: conheço dos embargos, pois tempestivos. No mérito, contudo, nego-lhes provimento. A irresignação busca veicular, diretamente, a rediscussão do mérito, pretensão que não pode ser alcançada por meio do recurso manejado pela parte. Segundo a jurisprudência do Superior Tribunal de Justiça, \"[a] atribuição de efeitos infringentes aos embargos de declaração é possível, em hipóteses excepcionais, para corrigir premissa equivocada no julgamento, bem como nos casos em que, sanada a omissão, a contradição ou a obscuridade, a alteração da decisão surja como consequência necessária\" (EDcl no AgInt no AREsp. 2.459.215/MT, Ministro Ricardo Villas Bôas Cueva, Terceira Turma, julgado em 16/9/2024, DJe de 18/9/2024). A parte pretende indevida rediscussão de mérito quanto à prova que subjaz a conclusão final do Juízo, de modo que, se assim desejar, pode acionar as vias recursais próprias para a revisão de mérito do julgamento. Intime-se. Guariba, 23 de agosto de 2026. - ADV: GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), CLOVIS BRONZATI (OAB 279195/SP), CLOVIS BRONZATI (OAB 279195/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP)"},{"id":703640449,"data":"2026-08-21","tribunal":"TRT15","orgao":"DAM - Araraquara","numero":"0010272-02.2015.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082012032669300000304681416?instancia=1","partes":[{"nome":"EDNILSON JOSE ARENDIT","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"TEREZA MATOS BUCHIONI","polo":"A"},{"nome":"UNIÃO FEDERAL (PGF)","polo":"A"}],"advogados":[{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"LAIZA SOARES DONATO","oab":"SP/394178"},{"nome":"RODRIGO DOMINGOS","oab":"SP/236954"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO DAM - ARARAQUARA ATOrd 0010272-02.2015.5.15.0029 AUTOR: TEREZA MATOS BUCHIONI E OUTROS (1) RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID eedeff1 proferida nos autos. Órgão Julgador de Origem: 1ª VARA DO TRABALHO DE JABOTICABAL Prioridade(s): Idoso DECISÃO Pressupostos extrínsecos: Tempestivo, regular a representação processual. Pressupostos intrínsecos: Cabível o recurso haja vista que a decisão atacada é de natureza definitiva. Preenchido o requisito do § 1º do artigo 897 da CLT. Recurso processado. Apresente a parte contrária contraminuta e, após, subam os autos ao E. TRT. Intimem-se ainda os patronos das partes para que efetuem, se for o caso, seu cadastramento junto ao sistema PJe na 2ª instância. ARARAQUARA/SP, 20 de agosto de 2026. ANDREA MARIA PFRIMER FALCAO Juíza do Trabalho Titular CNS\n\nIntimado(s) / Citado(s)\n - TEREZA MATOS BUCHIONI"},{"id":703853797,"data":"2026-08-21","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010498-55.2025.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082014133365500000304702665?instancia=1","partes":[{"nome":"CRISTIANE GONCALVES BRITO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ODAIR JOSE BARCELOS DA SILVA","oab":"SP/314524"},{"nome":"MELINA CORREA HERNANDES","oab":"SP/289374"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA ATOrd 0010498-55.2025.5.15.0029 AUTOR: CRISTIANE GONCALVES BRITO RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID aa41057 proferida nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL DECISÃO Ante a expressa concordância  da reclamada, HOMOLOGO os cálculos de Id d634d8a apresentados pela RECLAMANTE, os quais se encontram atualizados na planilha de Id cab91fc, por considerá-los em conformidade com a r. sentença e para que produzam jurídicos efeitos. Considerando a natureza indenizatória das verbas, inexistem contribuições previdenciárias ou fiscais. Custas processuais isentas, nos termos do artigo 790-A, I, da CLT. Por economia e celeridade processuais, deverá a autora, no prazo de cinco dias, informar seus dados bancários e cadastrar a conta bancária no endereço eletrônicohttps://siscondj-adv.trt15.jus.br/adv-dados-bancarios-cadastro/. Atente o patrono que, caso os dados bancários informados sejam de titularidade e sociedade de advogados para fins de liberação dos créditos, faz-se necessária a observância do art. 15, §3º, da Lei 8.906/94 (Estatuto da OAB), bem como do art. 105, §3º, do CPC, os quais estabelecem que a procuração deve conter o nome da sociedade de advogados, seu número de registro na OAB e o endereço completo. Será de responsabilidade da exequente informar se já houve o recebimento deste crédito por Ação Civil Coletiva, devendo informar este juízo. Considerando que os cálculos ora homologados foram elaborados pela autora, intime-se o reclamado, na pessoa de seu procurador, nos termos do art. 535 do CPC para que tome ciência desta decisão, e, querendo, apresente impugnação à execução em 30 dias nos termos do referido artigo e seus parágrafos. Decorrido in albis o prazo supra, execute-se, devendo ser expedido Ofício Requisitório  de Pequeno Valor (RPV) e/ou  Precatório, sendo que, em prestígio à celeridade e economia processual, com fulcro no art. 269, §3º e art. 270, ambos do CPC, e art. 6º da Instrução Normativa 32/2007 do C. TST o reclamado será intimado via sistema para ciência do Ofíc"},{"id":704022524,"data":"2026-08-21","tribunal":"TRT15","orgao":"4ª Câmara","numero":"0010368-83.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082015522635400000156939375?instancia=2","partes":[{"nome":"MARCOS ANDRE DE SOUZA","polo":"A"},{"nome":"MARCOS ANDRE DE SOUZA","polo":"P"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ODAIR JOSE BARCELOS DA SILVA","oab":"SP/314524"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO 4ª CÂMARA Relatora: MARI ANGELA PELEGRINI ROT 0010368-83.2025.5.15.0120 RECORRENTE: MARCOS ANDRE DE SOUZA E OUTROS (1) RECORRIDO: MARCOS ANDRE DE SOUZA E OUTROS (1) Ficam as partes intimadas do acórdão proferido no presente processo (Artigo 17 da Resolução CSJT nº 185/2017 c/c Lei nº 13.467/2017). Acesso ao sistema PJe- JT - 2º grau: http://pje.trt15.jus.br/consultaprocessual.  CAMPINAS/SP, 20 de agosto de 2026. ANTONIO AFONSO DE MELLO ABREU Diretor de Secretaria\n\nIntimado(s) / Citado(s)\n - MARCOS ANDRE DE SOUZA"},{"id":704303335,"data":"2026-08-21","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010255-42.2019.5.15.0120","cl  Justiça Eletrônico Nacional","link":"https://pje.tst.jus.br/pjekz/validacao/26081917144000700000198803738?instancia=3","partes":[{"nome":"HILDA XAVIER VERONE","polo":"P"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"}],"advogados":[{"nome":"PAULO SERGIO MOREIRA DA SILVA","oab":"SP/165937"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL SUPERIOR DO TRABALHO SUBSEÇÃO II ESPECIALIZADA EM DISSÍDIOS INDIVIDUAIS Relatora: LIANA CHAIB Ag ROT 0008351-80.2024.5.15.0000 AGRAVANTE: MUNICIPIO DE PRADOPOLIS AGRAVADO: HILDA XAVIER VERONE Poder Judiciário Justiça do Trabalho Tribunal Superior do Trabalho PROCESSO Nº TST-Ag-ROT - 0008351-80.2024.5.15.0000 A C Ó R D Ã O (SDI-2) GMLC/mvc AGRAVO INTERNO. RECURSO ORDINÁRIO EM AÇÃO RESCISÓRIA. MUNICÍPIO DE PRADÓPOLIS. ABONO ASSIDUIDADE. LEI COMPLEMENTAR N° 166/2008 E DECRETO Nº 457/2021, AMBOS DA ESFERA DO ENTE PÚBLICO MUNICIPAL. DECLARAÇÃO DE INCONSTITUCIONALIDADE DECLARADA PELO TJSP. AUSÊNCIA DE PRONUNCIAMENTO EXPLÍCITO. ÓBICE DA SÚMULA 298 DESTA CORTE. Trata-se de ação rescisória ajuizada pelo Município de Pradópolis pretendendo desconstituir acórdão do TRT2, que o condenou ao pagamento de abono assiduidade com base na Lei Complementar n° 166/2008 e no Decreto nº 457/2021. O pedido de corte rescisório fundamentou-se, em suma, no fato de que as referidas normas foram declaradas inconstitucionais pelo Tribunal de Justiça do Estado de São Paulo, em ação direta de inconstitucionalidade. Nos termos dos itens I e II da Súmula 298 do TST, \"a conclusão acerca da ocorrência de violação literal a disposição de lei pressupõe pronunciamento explícito, na sentença rescindenda, sobre a matéria veiculada\", e \"O pronunciamento explícito exigido em ação rescisória diz respeito à matéria e ao enfoque específico da tese debatida na ação, e não, necessariamente, ao dispositivo legal tido por violado. Basta que o conteúdo da norma reputada violada haja sido abordado na decisão rescindenda para que se considere preenchido o pressuposto\". Contudo, no caso dos autos, constata-se que o acórdão rescindendo apenas registrou que a parcela denominada \"abono assiduidade” seria devida independentemente de regulamentação, pois a própria lei que a instituiu já define critérios claros para sua concessão. Ressaltou-se ainda que, ao contratar sob regime celetista, o ente público equipara-se ao empregador privado e deve respeitar direitos trabalhistas mínimos previstos em legislação federal. Não abordou, nem mesmo tangencialmente, a questão da inconsti"},{"id":702571083,"data":"2026-08-20","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010099-20.2020.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081914392785800000304549409?instancia=1","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"RENEI FERREIRA DA SILVA","polo":"A"},{"nome":"SANDRA PEREIRA PIMENTA GARCIA","polo":"A"}],"advogados":[{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA ATOrd 0010099-20.2020.5.15.0120 AUTOR: RENEI FERREIRA DA SILVA RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Sentença ID 2570569 proferida nos autos, cujo dispositivo consta a seguir: Não conheço dos embargos de declaração opostos pelo autor, por intempestivos, uma vez que o autor teve ciência da sentença em 20/07/2026, sendo que o prazo para apresentação de embargos declaratório decorreu em 27/07/2026. FABIO NATALI COSTA Juiz do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - RENEI FERREIRA DA SILVA"},{"id":702575388,"data":"2026-08-20","tribunal": CIALIZADA EM DISSÍDIOS INDIVIDUAIS Relatora: LIANA CHAIB Ag ROT 0013063-79.2025.5.15.0000 AGRAVANTE: MUNICIPIO DE PRADOPOLIS AGRAVADO: ALEX ALEXANDRE DOS SANTOS Poder Judiciário Justiça do Trabalho Tribunal Superior do Trabalho PROCESSO Nº TST-Ag-ROT - 0013063-79.2025.5.15.0000 A C Ó R D Ã O (SDI-2) GMLC/mvc AGRAVO INTERNO. RECURSO ORDINÁRIO EM AÇÃO RESCISÓRIA. MUNICÍPIO DE PRADÓPOLIS. ABONO ASSIDUIDADE. LEI COMPLEMENTAR N° 166/2008 E DECRETO Nº 457/2021, AMBOS DA ESFERA DO ENTE PÚBLICO MUNICIPAL. DECLARAÇÃO DE INCONSTITUCIONALIDADE DECLARADA PELO TJSP. AUSÊNCIA DE PRONUNCIAMENTO EXPLÍCITO. ÓBICE DA SÚMULA 298 DESTA CORTE. Trata-se de ação rescisória ajuizada pelo Município de Pradópolis pretendendo desconstituir acórdão do TRT2, que o condenou ao pagamento de abono assiduidade com base na Lei Complementar n° 166/2008 e no Decreto nº 457/2021. O pedido de corte rescisório fundamentou-se, em suma, no fato de que as referidas normas foram declaradas inconstitucionais pelo Tribunal de Justiça do Estado de São Paulo, em ação direta de inconstitucionalidade. Nos termos dos itens I e II da Súmula 298 do TST, \"a conclusão acerca da ocorrência de violação literal a disposição de lei pressupõe pronunciamento explícito, na sentença rescindenda, sobre a matéria veiculada\", e \"O pronunciamento explícito exigido em ação rescisória diz respeito à matéria e ao enfoque específico da tese debatida na ação, e não, necessariamente, ao dispositivo legal tido por violado. Basta que o conteúdo da norma reputada violada haja sido abordado na decisão rescindenda para que se considere preenchido o pressuposto\". Contudo, no caso dos autos, constata-se que o acórdão rescindendo apenas registrou que a parcela denominada \"abono assiduidade” seria devida independentemente de regulamentação, pois a própria lei que a instituiu já define critérios claros para sua concessão. Ressaltou-se ainda que, ao contratar sob regime celetista, o ente público equipara-se ao empregador privado e deve respeitar direitos trabalhistas mínimos previstos em legislação federal. Não abordou, nem mesmo tangencialmente, a questão da in"},{"id":702628882,"data":"2026-08-20","tribunal":"TRT15","orgao":"CON2 - Araraquara","numero":"0011144-83.2025.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081915075624000000304557824?instancia=1","partes":[{"nome":"MARCIO DONIZETE DA SILVA","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON2 - ARARAQUARA ATOrd 0011144-83.2025.5.15.0120 AUTOR: MARCIO DONIZETE DA SILVA RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID 72d4613 proferida nos autos. DECISÃO Pressupostos extrínsecos: O recurso interposto pelo reclamante é tempestivo. Regular a representação. Pressupostos intrínsecos: Todas as matérias debatidas preenchem o requisito de admissibilidade. Apresentem os recorridos contrarrazões no prazo legal e, após, remetam-se os autos ao segundo grau. Intimem-se os patronos das partes, ainda, para que efetuem, se for o caso, seu cadastramento junto ao sistema PJe na 2ª instância. ARARAQUARA/SP, 19 de agosto de 2026. FABIO NATALI COSTA Juiz do Trabalho Titular MJAL\n\nIntimado(s) / Citado(s)\n - MARCIO DONIZETE DA SILVA"},{"id":702743518,"data":"2026-08-20","tribunal":"TRT15","orgao":"9ª Câmara","numero":"0010275-62.2021.5.15.0120","classe":"AGRAVO DE PETIçãO","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081916144885000000156850164?instancia=2","partes":[{"nome":"JOAO JESUS SANTIAGO","polo LOGIAS PSIQUIÁTRICAS (TRANSTORNO AFETIVO BIPOLAR, TRANSTORNO MISTO ANSIOSO E DEPRESSIVO E USO NOCIVO DE ÁLCOOL). PACIENTE COM PREJUÍZO DO JUÍZO CRÍTICO E RECUSA A TRATAMENTOS VOLUNTÁRIOS ANTERIORES. LAUDO MÉDICO CIRCUNSTANCIADO QUE ATESTA EXPRESSAMENTE A NECESSIDADE DA MEDIDA EXTRAORDINÁRIA, DIANTE DO RISCO IMINENTE À INTEGRIDADE FÍSICA PRÓPRIA E DE TERCEIROS. DIREITO À SAÚDE. DEVER DE ASSISTÊNCIA INTEGRAL E INDIVIDUALIZADA. NECESSIDADE MANIFESTA. PRECEDENTES. DECISÃO MANTIDA. RECURSO DESPROVIDO. ART. 1007 CPC - EVENTUAL RECURSO - SE AO STJ: CUSTAS R$ 270,12 - (GUIA GRU NO SITE http://www.stj.jus.br) - RESOLUÇÃO STJ/GP N. 7 DE 28 DE JANEIRO DE 2025, ATUALIZADA PELA INSTRUÇÃO NORMATIVA STJ/GP N. 13 DE 27 DE JANEIRO DE 2026; SE AO STF: CUSTAS R$ 1.325,45 - GUIA GRU COBRANÇA - FICHA DE COMPENSAÇÃO - (EMITIDA ATRAVÉS DO SITE www.stf.jus.br ) E PORTE DE REMESSA E RETORNO R$ 118,90 - GUIA FEDTJ - CÓD 140-6 - BANCO DO BRASIL OU INTERNET - RESOLUÇÃO N. 914, DE 1º DE JULHO DE 2026 DO STF. Os valores referentes ao PORTE DE REMESSA E RETORNO, não se aplicam aos PROCESSOS ELETRÔNICOS, de acordo com o art. 3º, inciso, II, da RESOLUÇÃO N. 833, DE 13 DE MAIO DE 2024 DO STF. - Advs: Wesley Luiz Alves de Paula (OAB: 274238/SP) - Cassia Jorge de Moraes (OAB: 407536/SP) - 1º andar"},{"id":701203477,"data":"2026-08-19","tribunal":"TST","orgao":"2ª Turma","numero":"0010358-31.2019.5.15.0029","classe":"RECURSO DE REVISTA COM AGRAVO","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://consultaprocessual.tst.jus.br/consultaProcessual/resumoForm.do?consulta=1&numeroInt=58466&anoInt=2022","partes":[{"nome":"LUCILIA MESQUITA RAMOS CARDOSO","polo":"P"},{"nome":"MUNICÍPIO DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"DR. GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"DR. ADHEMAR RONQUIM FILHO","oab":"SP/223251"}],"texto":"Agravante(s) e Recorrente(s): MUNICÍPIO DE PRADÓPOLIS\nADVOGADO: ADHEMAR RONQUIM FILHO\nAgravado(s) e Recorrido(s): LUCILIA MESQUITA RAMOS CARDOSO\nADVOGADO: GILBERTO FAGUNDES DE OLIVEIRA\nGDCNR/rd\n\nD E C I S Ã O\n\nO egrégio Tribunal Regional do Trabalho da 15ª Região manteve a condenação do Município reclamado ao pagamento de diferenças salariais, de abono assiduidade e de férias, bem como o entendimento de que a pretensão obreira ao pagamento do ?abono salarial?, do ?adicional por tempo de serviço?, do ?adicional da sexta parte? e da ?licença prêmio? sujeita-se à prescrição parcial.\nInconformado, interpôs o reclamado o presente Recurso de Revista, o qual foi admitido de forma parcial, apenas quanto ao tema prescrição.\nA essa decisão interpôs o Município Agravo de Instrumento, pugnando pelo processamento integral de seu Recurso de Revista.\nNão foi apresentada contraminuta nem contrarrazões.\nManifestou-se a douta Procuradoria-Geral do Trabalho pelo conhecimento e não provimento do Agravo de Instrumento e pelo conhecimento e provimento do Recurso de Revista.\nÉ o relatório.\n\nAGRAVO DE INSTRUMENTO\nConquanto tempestivo o Agravo de Instrumento e regular a representação processual do recorrente, o apelo não é admissível, porque desfundamentado.\nEis os fundamentos sufragados pelo egrégio Tribunal Regional do Trabalho, por ocasião do exame da admissibilidade do Recurso de Revista:\n\nPRESSUPOSTOS INTRÍNSECOS\nREMUNERAÇÃO, VERBAS INDENIZATÓRIAS E BENEFÍCIOS / ABONO.\nREMUNERAÇÃO, VERBAS INDENIZATÓRIAS E BENEFÍCIOS / SALÁRIO / DIFERENÇA SALARIAL.\nLEIS Nºs 8.178/91 E 8.238/91\nNo que se refere ao acolhimento de diferenças salariais, o v. acórdão se fundamentou no conjunto fático-probatório e não violou, de forma direta e literal, os dispositivos constitucionais e legais apontados.\nDesse modo, inadmissível o recurso, pelo teor da Súmula 126 do C. TST e pela ausência dos requisitos exigidos pela alínea \"c\" do art. 896 da CLT.\nAdemais, o recorrente não logrou demonstrar o pretendido dissenso interpretativo, pois se limitou a transcrever os arestos paradigmas, deixando de realizar o indispensável cotejo analítico entre eles e a v. decisão recorrida, descumprindo os requisitos previstos "},{"id":701070907,"data":"2026-08-19","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010146-81.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081813564075900000304355291?instancia=1","partes":[{"nome":"MARIA DO CARMO ROSA DA SILVA PINTO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"RAFAEL BOGAS","polo":"A"}],"advogados":[{"nome":"JENNIFER CAROLINA PINTO","oab":"SP/481553"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010146-81.2026.5.15.0120 AUTOR: MARIA DO CARMO ROSA DA SILVA PINTO RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 3ccd55f proferido nos autos. DESPACHO Vistos etc. Designo audiência de instrução para  o  dia 30/09/2026 16:00, observadas as seguintes disposições: A audiência será realizada em ambiente virtual, por meio da plataforma ZOOM, mediante acesso ao link https://trt15-jus-br.zoom.us/j/82522846174?pwd=eWs0dTViVEdSTXhvN0FReThSTHhwUT09 ID da reunião: 825 2284 6174 Senha de acesso: 784658 por computador, tablet ou smartphone com acesso à internet. Caso seja acessado via computador, o link instruirá a respeito da necessidade ou não da instalação do programa. Caso seja utilizado smartphone, é necessária a prévia instalação do aplicativo ZOOM nas lojas virtuais para Sistemas Android e iOS. Sendo assim, recomenda-se aos participantes que nunca utilizaram a plataforma, acesso prévio para evitar-se atrasos indesejados. Os participantes deverão acessar a sala de espera virtual da audiência pelo menos 5 minutos antes do horário designado e deverão ali permanecer, aguardando ser admitida sua entrada pelo anfitrião. Ao ingressar no ambiente virtual da audiência, deverão ser habilitados o áudio e a câmera. Durante a audiência, o microfone deve ser mantido desligado para evitar ruídos e ligado apenas e durante os momentos em que o participante efetuar alguma intervenção. Eventual impossibilidade técnica ou material de participação na audiência em ambiente virtual deverá ser noticiada pelo advogado da parte diretamente nos autos até o momento da realização da sessão e somente nela será analisada pelo Juízo. Em caso de não participação das partes será aplicada a pena de confissão ficta ao ausente, conforme entendimento sedimentado na Súmula 74 do TST. As partes também deverão viabilizar a participação de suas testemunhas, independentemente de intimação, servindo o presente instrumento, extraído deste processo eletrônico, como intimação para comparecimento, sob pena de condução coercitiva e multa de um salário-mínimo vigent"},{"id":701070982,"data":"2026-08-19","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010338-14.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081813564077200000304355294?instancia=1","partes":[{"nome":"FERNANDA RANGEL","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"ROBERTO APARECIDO DE OLIVEIRA","polo":"A"},{"nome":"T.E.M. EMERGENCIAS MEDICAS LTDA - EM RECUPERACAO JUDICIAL","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"ISANA PRATES SALGADO","oab":"RS/52101"},{"nome":"AMANDA FERRAZ","oab":"SP/455944"},{"nome":"ANA RITA NANZER","oab":"SP/522592"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010338-14.2026.5.15.0120 AUTOR: ROBERTO APARECIDO DE OLIVEIRA RÉU: MUNICIPIO DE PRADOPOLIS E OUTROS (1) INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 08c40ba proferido nos autos. Órgão Ju ade(s): Idoso DESPACHO Em prosseguimento, ciência às partes quanto aos esclarecimentos periciais, no prazo de 5 dias, ocasião em que deverão dizer acerca da necessidade de produção de prova oral no feito, devendo especificar e fundamentar os fatos controvertidos que pretendam instruir. No silêncio ou não havendo necessidade, estará encerrada a instrução processual, podendo as partes, no prazo comum subsequente de 10 (dez) dias e independentemente de nova notificação, apresentar razões finais. Após, torne o processo concluso para julgamento, ficando cientes as partes que serão notificadas oportunamente. ARARAQUARA/SP, 18 de agosto de 2026 FABIO NATALI COSTA Juiz do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - ROBERTO APARECIDO DE OLIVEIRA"},{"id":701424014,"data":"2026-08-19","tribunal":"TRT15","orgao":"Gabinete da Vice-Presidência Judicial - Análise de Recurso","numero":"0010181-57.2025.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081816350220600000156775897?instancia=2","partes":[{"nome":"ALEXANDRE RUY","polo":"A"},{"nome":"CRISTIANI CARDOSO","polo":"A"},{"nome":"CRISTIANI CARDOSO","polo":"P"},{"nome":"ETHAN SERVICOS INTEGRADOS LTDA","polo":"A"},{"nome":"ETHAN SERVICOS INTEGRADOS LTDA","polo":"P"},{"nome":"LM SERVICOS INTEGRADOS LTDA","polo":"A"},{"nome":"LM SERVICOS INTEGRADOS LTDA","polo":"P"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"LUCAS APARECIDO ROGERIO","oab":"SP/490833"},{"nome":"FERNANDO SCUARCINA","oab":"SP/183555"},{"nome":"NEURELANE GONCALVES DA SILVA","oab":"SP/500375"},{"nome":"GABRIEL FUNICHELLO","oab":"SP/443995"},{"nome":"JOSE ANTONIO FUNNICHELI","oab":"SP/79077"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO ÓRGÃO ESPECIAL - ANÁLISE DE RECURSO Relator: FABIO BUENO DE AGUIAR ROT 0010181-57.2025.5.15.0029 RECORRENTE: CRISTIANI CARDOSO E OUTROS (3) RECORRIDO: CRISTIANI CARDOSO E OUTROS (3) INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID 529b86e proferida nos autos. ROT 0010181-57.2025.5.15.0029 - 1ª Câmara Recorrente:   Advogado(s):   1. CRISTIANI CARDOSO FERNANDO SCUARCINA (SP183555) GABRIEL FUNICHELLO (SP443995) JOSE ANTONIO FUNNICHELI (SP79077) Recorrido:   Advogado(s):   ETHAN SERVICOS INTEGRADOS LTDA NEURELANE GONCALVES DA SILVA (SP500375) Recorrido:   Advogado(s):   LM SERVICOS INTEGRADOS LTDA LUCAS APARECIDO ROGERIO (SP490833) Recorrido:   MUNICIPIO DE PRADOPOLIS Interessado:   ALEXANDRE RUY RECURSO DE: CRISTIANI CARDOSO   PRESSUPOSTOS EXTRÍNSECOS Recurso tempestivo (ciência da decisão em 27/05/2026 - Id f8bcae1; recurso apresentado em 26/05/2026 - Id 84d9ae4). Regular a representação processual. Desnecessário o preparo.   PRESSUPOSTOS INTRÍNSECOS 1.1  DIREITO INDIVIDUAL DO TRABALHO (12936) / RESPONSABILIDADE SOLIDÁRIA/SUBSIDIÁRIA (14034) / TERCEIRIZAÇÃO/TOMADOR DE SERVIÇOS (14040) / ENTE PÚBLICO TEMA 1118 DA REPERCUSSÃO GERAL DO EG. STF DA DEMONSTRAÇÃO DA FISCALIZAÇÃO DO CUMPRIMENTO DAS OBRIGAÇÕES TRABALHISTAS O v. acórdão não atribuiu ao ente público, tomador de serviços, a responsabilidade subsidiária pelo inadimplemento das obrigações trabalhistas devidas pela empresa prestadora de serviços, por não restar comprovado nos autos, pela parte autora (a quem cabe o ônus da prova), a efetiva existência de comportamento negligente ou nexo de causalidade entre o dano por ela invocado e a conduta comissiva ou omissiva do poder público.  O Egrégio Supremo Tribunal Federal, ao examinar a ADC-16/DF e o RE-760931/DF (leading case do Tema nº 246 do Ementário de Repercussão Geral), firmou tese no sentido de que a inadimplência da empresa contratada não transfere ao ente público tomador de serviços, de forma automática, a responsabilidade pelo pagamento dos encargos trabalhistas e fiscais, sendo necessário verificar, caso a caso, a e .608/03 evidencia que, sendo o ente público isento da taxa judiciária, não se justifica exigir recolhimento antecipado pela parte exequente não beneficiária da justiça gratuita, pois isso acarretaria ressarcimento posterior incompatível com a lógica da sucumbência e com a própria isenção legal. Assim, é descabida a exigência de recolhimento na fase de execução. 2. Considerando a natureza ilíquida do título judicial transitado em julgado, o arbitramento dos honorários advocatícios se dará em momento oportuno, após a consolidação do débito principal. 3. Preenchidos os requisitos do art. 534 do CPC, recebo o pedido de cumprimento de sentença. Intime-se, via portal eletrônico, a Fazenda Pública para que apresente, nos próprios autos, impugnação sobre o valor principal, no prazo de 30 dias. Intime-se. - ADV: GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), CLOVIS BRONZATI (OAB 279195/SP)"},{"id":701474686,"data":"2026-08-19","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1502961-81.2022.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MARCOS ALBERTO DOS SANTOS","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1502961-81.2022.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Marcos Alberto dos Santos - Vistos. Defiro o prazo solicitado pela parte exequente. Decorrido o prazo, manifeste-se a parte exequente, independentemente de nova intimação, sob pena de extinção. Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG), LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":701474711,"data":"2026-08-19","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1001384-72.2015.8.26.0222","clas es. Após regular processamento, remetam-se ao C. Tribunal Superior do Trabalho.   Campinas, 14 de agosto de 2026.   WILTON BORBA CANICOBA Desembargador Vice-Presidente Judicial\n\nIntimado(s) / Citado(s)\n - RICHELMY ODAIR ROSSI"},{"id":698992315,"data":"2026-08-17","tribunal":"TRT15","orgao":"CON2 - Araraquara","numero":"0011110-11.2025.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081510314560400000304043177?instancia=1","partes":[{"nome":"CLEBERSON RODRIGO GOMES","polo":"A"},{"nome":"MARCO AURELIO GONCALVES VIEIRA","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON2 - ARARAQUARA ATOrd 0011110-11.2025.5.15.0120 AUTOR: CLEBERSON RODRIGO GOMES RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Sentença ID af42b15 proferida nos autos, cujo dispositivo consta a seguir: SENTENÇA   1. RELATÓRIO   Trata-se de reclamação trabalhista ajuizada por Cleberson Rodrigo Gomes em face do Município de Pradópolis (ID 8d1aff0).   O autor alega que foi admitido pelo reclamado em 27/06/2022 para exercer a função de motorista, mediante aprovação em concurso público sob o regime da CLT, com vínculo ativo e última remuneração básica de R$ 2.178,50 (ID 8d1aff0). Sustenta a prestação de serviços em sobrejornada habitual, com violação aos intervalos intrajornada e interjornadas, atuação em regime de sobreaviso, trabalho em domingos e feriados sem a devida contraprestação, supressão de férias anuais remuneradas e desrespeito às normas de segurança do trabalho quanto ao adicional de periculosidade por atuar em combate a incêndios e apoio de brigada, postulando ainda a integração salarial do auxílio-alimentação recebido em pecúnia e indenização suplementar (ID 8d1aff0). Ao final, formulou pedidos de gratuidade de justiça, não limitação da condenação aos valores indicados, horas extras e reflexos, intervalos intrajornada e interjornadas, horas de sobreaviso, domingos e feriados em dobro, nulidade do banco de horas e compensação, férias em dobro, integração salarial do vale-alimentação, adicional de periculosidade e reflexos, fornecimento de PPP, honorários advocatícios e juros e correção monetária (ID 8d1aff0). Atribuiu à causa o valor de R$ 338.988,21 (ID 8d1aff0). Juntou procuração, declaração de hipossuficiência, CTPS e demonstrativos de pagamento (ID 952d17a a e27dd19).   A ré apresentou defesa mais documentos.   O reclamante apresentou manifestação sobre a defesa e documentos em réplica (ID 9f0c452).   Foi realizada perícia.   O reclamante requereu a utilização de prova emprestada consistente na ata de audiência e sentença proferidas nos autos da RTOrd 0011040-73.2025.5.15.0029 (ID e1e2129 e 6d51e15).   Na audiência de instrução telepr"},{"id":697796283,"data":"2026-08-17","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1000068-38.2026.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"G FARIA EMPREENDIMENTOS ADMINISTRACAO E PARTICIPACOES LTDA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"ALEXANDRE MENDES PINTO","oab":"SP/153869"},{"nome":"TONY RAFAEL BICHARA","oab":"SP/239949"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000068-38.2026.8.26.0222 - Procedimento do Juizado Especial da Fazenda Pública - Anulação de Débito Fiscal - G Faria Empreendimentos Administracao e Participacoes Ltda - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Diante do trânsito em julgado da sentença, manifeste-se a autora. No silêncio, arquivem-se os autos. Int. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), TONY RAFAEL BICHARA (OAB 239949/SP), ALEXANDRE MENDES PINTO (OAB 153869/SP)"},{"id":698403357,"data":"2026-08-17","tribunal":"TJSP","orgao":"Processamento 7º Grupo - 15ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"2222265-07.2025.8.26.0000","classe":"EMBARGOS DE DECLARAçãO CíVEL","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANA DE OLIVEIRA LAVEZZO","polo":"A"},{"nome":"ANGELO LAVEZZO","polo":"A"},{"nome":"ESPOLIO DE GERALDO LAVEZZO","polo":"A"},{"nome":"GISELE OLIVEIRA LAVEZZO","polo":"A"},{"nome":"MARCELO RODRIGO LAVEZZO","polo":"A"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"}],"advogados":[{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"}],"texto":"DESPACHO\r\n\r\nNº 2222265-07.2025.8.26.0000/50001 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Embargos de Declaração Cível - Guariba - Embargte: Gisele Oliveira Lavezzo - Embargte: Ana de Oliveira Lavezzo - Embargte: Marcelo Rodrigo Lavezzo - Embargte: Angelo Lavezzo - Embargdo: Município de Pradópolis - Interessado: Espolio de Geraldo Lavezzo (Espólio) - Embargos de Declaração Cível Processo nº 2222265-07.2025.8.26.0000/50001 Relator(a): EURÍPEDES FAIM Órgão Julgador: 15ª Câmara de Direito Público SESSÃO DE JULGAMENTO NA MODALIDADE VIRTUAL - RESOLUÇÃO CNJ 591/24 Data da pauta: 27/08/2026 às 00:01 Número da pauta: 434 Íntegra da pauta de julgamento: https://esaj.tjsp.jus.br/pauta-julgamento-virtual Torno público, nos termos da Resolução n.º 984/2025, que regulamenta o julgamento eletrônico no âmbito do Tribunal de Justiça do Estado de São Paulo, por meio do sistema SAJ e, em conformidade com a Resolução CNJ n.º 591/2024, que os presentes autos serão julgados eletronicamente em sessão virtual. Eventuais pedidos de DESTAQUE (oposição ao julgamento virtual), deverão ser feitos, por meio eletrônico, no portal do ESAJ (https://esaj.tjsp.jus.br/pauta-julgamento-virtual) (Selecione o Órgão julgador e em seguida a data da sessão virtual e clique em \"consultar\"> localize o processo na pauta e clique em \"acompanhar julgamento\"> na parte inferior estará habilitado o pedido de \"destaque\" e \"esclarecimento\"), até 48 (quarenta e oito) horas antes do início da sessão e deferido pelo(a) Relator(a). NOTA: DESTAQUES DEFERIDOS NÃO DISPENSAM AS PARTES DE REALIZAR INSCRIÇÃO PARA PREFERÊNCIA SIMPLES OU SUSTENTAÇÃO ORAL, PERMANECENDO OBRIGATÓRIA A REALIZAÇÃO DE INSCRIÇÃO PELAS PARTES NA SESSÃO QUE VIER A SER DESIGNADA. Nas hipóteses de cabimento de SUSTENTAÇÃO ORAL, é facultado o seu envio por meio eletrônico, no próprio processo, não sendo aceito outro meio, após a publicação da pauta e até 48 (quarenta e oito) horas antes de iniciado o julgamento em ambiente virtual, conforme manual de peticionamento no site: https://www.tjsp.jus.br/Download/PeticionamentoEletronico/Manual_PETIC_ELETRONI"},{"id":698668793,"data":"2026-08-17","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0001375-78.2025.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"DANIEL CARVALHO CORREIA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"CASSIA JORGE DE MORAES","oab":"SP/407536"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0001375-78.2025.8.26.0222 (processo principal 1000647-20.2025.8.26.0222) - Cumprimento de sentença - Indenização Trabalhista - Daniel Carvalho Correia - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Relatório dispensado nos termos do artigo 38 da Lei nº 9.099/95. FUNDAMENTO. Insurge-se a impugnante FAZENDA PÚBLICA DO MUNICÍPIO DE PRADÓPOLIS, unicamente, no excesso de execução no valor de R$84.927,82 (oitenta e quatro mil, novecentos e vinte e sete reais e oitenta e dois centavos). Havendo discordância, foi determinada a nomeação de perito judicial (fls. 105 e 150). Apresentado Laudo Pericial (fls. 166/174) e, intimadas as partes a se manifestar, houve a concordância da Fazenda Pública do Município de Pradópolis, com os cálculos apresentados pelo Perito (fls. 198), havendo decorrido o prazo, sem a manifestação do autor (fls. 203), no valor bruto de R$228.733,02 (duzentos e vinte e oito mil, setecentos e trinta e três reais e dois centavos), reputando-o correto e requerendo a suahomologação. Assim, não havendo controvérsia quantoaovalor é caso de homologar ocálculoapresentado pelo Perito Judicial nomeado. DECIDO. Ante o exposto, JULGO PARCIALMENTE PROCEDENTE a presenteimpugnação aocumprimento de sentença e HOMOLOGO os cálculos de fls. 166/174, na forma apresentada pelo Perito Judicial. Após o decurso do prazo para eventual recurso, providencie o(a) exequente o peticionamento do competente incidente processual de requisição de pequeno valor. Publique-se e intimem-se. Oportunamente, arquivem-se. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CASSIA JORGE DE MORAES (OAB 407536/SP)"},{"id":698777512,"data":"2026-08-17","tribunal":"TJSP","orgao":"Processamento 7º Grupo - 18ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"2200145-33.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"DOMINGOS CORTES","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"DESPACHO\r\n\r\nNº 2200145-33.2026.8.26.0000 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Agravo de Instrumento - Guariba - Agravante: Município de Pradópolis - Agravado: Domingos Cortes - Vistos. Trata-se de agravo de instrumento interposto contra decisão que, nos autos da execução fiscal, indeferiu a inclusão do nome do devedor no SERASA. Sustenta o agravante que a medida postulada é necessária e independe do esgotamento prévio de outras diligências, conforme jurisprudência do TJSP. Presentes os requisitos do art. 995, parágrafo único do CPC, quais sejam: probabilidade do direito alegado e perigo de dano irreparável. De acordo com o 782,§ 3º, doCódigo de Processo Civil, é possível a inclusão do nome da empresa executada em cadastros de inadimplentes a requerimento da parte, sem necessidade de esgotamento prévio de outras medidas executivas: \"Art. 782.Não dispondo a lei de modo diverso, o juiz determinará os atos executivos, e o oficial de justiça os cumprirá. § 1ºO oficial de justiça poderá cumprir os atos executivos determinados pelo juiz também nas comarcas contíguas, de fácil comunicação, e nas que se situem na mesma região metropolitana. § 2ºSempre que, para efetivar a execução, for necessário o emprego de força policial, o juiz a requisitará. § 3ºA requerimento da parte, o juiz pode determinar a inclusão do nome do executado em cadastros de inadimplentes.\" O Superior Tribunal de Justiça, Tema 1026, já confirmou a aplicabilidade do art.782,§ 3ºdoCPCàs execuções fiscais, permitindo a negativação da empresa/executada independentemente do esgotamento de outras medidas: Tese de julgamento: O art.782,§ 3ºdoCPCé aplicável às execuções fiscais, permitindo a inclusão do nome da parte executada em cadastros de inadimplentes, via SerasaJud, sem necessidade de esgotamento prévio de outras medidas executivas. Legislação Citada:CPC, art.782,§ 3º.Jurisprudência Citada: STJ,REsp nº 1.807.180/PR, Rel. Min.Og Fernandes, 2a Turma, j. 24.02.2021. O entendimento desta Câmara é no mesmo sentido: TJSP,Agravo de Instrumento 2210801-88.2022.8.26.0000, Rel.Henrique Harris Júnior, 18a Câm"},{"id":696496772,"data":"2026-08-14","tribunal":"TRT15","orgao":"Gabinete da Desembargadora Gisela Rodrigues Magalhães de Araújo e Moraes - 1ª SDI","numero":"0007913-83.2026.5.15.0000","classe":"MANDADO DE SEGURANçA CíVEL","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081309003136600000156209242?instancia=2","partes":[{"nome":"JUÍZO DA 1ª VARA DO TRABALHO DE ARARAQUARA","polo":"P"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"SANDRA HELENA BATISTA DE ALMEIDA","polo":"A"}],"advogados":[{"nome":"DANILO HENRIQUE NUNES","oab":"SP/359381"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO 1ª SEÇÃO DE DISSÍDIOS INDIVIDUAIS Relatora: GISELA RODRIGUES MAGALHAES DE ARAUJO E MORAES MSCiv 0007913-83.2026.5.15.0000 IMPETRANTE: SANDRA HELENA BATISTA DE ALMEIDA AUTORIDADE COATORA: JUÍZO DA 1ª VARA DO TRABALHO DE ARARAQUARA E OUTROS (1) INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID 1e9bf81 proferida nos autos. 1ª Seção de Dissídios Individuais Gabinete da Desembargadora Gisela Rodrigues Magalhães de Araújo e Moraes - 1ª SDI Processo: 0007913-83.2026.5.15.0000 MSCiv IMPETRANTE: SANDRA HELENA BATISTA DE ALMEIDA AUTORIDADE COATORA: JUÍZO DA 1ª VARA DO TRABALHO DE ARARAQUARA, MUNICIPIO DE PRADOPOLIS   Vistos  DO TRABALHO DA 15ª REGIÃO CON2 - ARARAQUARA ATOrd 0010248-74.2024.5.15.0120 AUTOR: ADRIANA BRANDAO VIANA FERREIRA RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 79f1c4c proferido nos autos. DESPACHO Visto. Ciência às partes do retorno do processo do E. Regional. Cumpra-se o v. Acórdão transitado em julgado. Declarada a improcedência da ação, a parte autora foi condenada ao pagamento de honorários advocatícios, cuja exigibilidade ficará suspensa, podendo o credor, no prazo de 2 anos, demonstrar que deixou de existir a situação de insuficiência de recursos que justificou a concessão de gratuidade.  Neste caso, nova ação deverá ser ajuizada pelo sistema eletrônico - PJE (classe processual Cumprimento de Sentença - CumSen), a qual deverá ser instruída com cópia da r. sentença, da presente decisão, bem como de prova inequívoca da existência de lastro patrimonial exequível, pormenorizando bens úteis do devedor, aptos a garantir a dívida, sob pena de indeferimento.  Decorrido o biênio, a contar do trânsito em julgado da sentença condenatória, sem que o credor tenha demonstrado a capacidade do reclamante/executado de suportar a execução, as obrigações do beneficiário estarão automaticamente extintas, sem outras providências. Encaminhem-se os autos digitais ao arquivo. Intimem-se as partes. ARARAQUARA/SP, 13 de agosto de 2026 FABIO NATALI COSTA Juiz do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - ADRIANA BRANDAO VIANA FERREIRA"},{"id":697079349,"data":"2026-08-14","tribunal":"TRT15","orgao":"CON2 - Araraquara","numero":"0011032-17.2025.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081315062294000000303809577?instancia=1","partes":[{"nome":"MARCELLO TEIXEIRA CASTIGLIA","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"SUELI RODRIGUES DE OLIVEIRA","polo":"A"}]
