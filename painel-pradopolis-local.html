cie-se a intimação da parte agravada para contrariedade (art. 1.019, II, CPC) e, após, tornem conclusos. Int. - Magistrado(a) Spoladore Dominguez - Advs: Clovis Bronzati (OAB: 279195/SP) - Viviane Cristina Bronzati (OAB: 444669/SP) - Wesley Luiz Alves de Paula (OAB: 274238/SP) - 1° andar"},{"id":694308199,"data":"2026-08-13","tribunal":"TRT15","orgao":"Gabinete da Vice-Presidência Judicial - Análise de Recurso","numero":"0021967-88.2025.5.15.0000","classe":"AçãO RESCISóRIA","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081112224961000000156099492?instancia=2","partes":[{"nome":"ANTONIO ALEXANDRE MAGNUSSON","polo":"P"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"}],"advogados":[{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO ÓRGÃO ESPECIAL - ANÁLISE DE RECURSO Relator: FABIO GRASSELLI AR 0021967-88.2025.5.15.0000 AUTOR: MUNICIPIO DE PRADOPOLIS RÉU: ANTONIO ALEXANDRE MAGNUSSON INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID c5a63a0 proferida nos autos. Órgão Especial - Análise de Recurso Gabinete da Vice-Presidência Judicial - Análise de Recurso   Processo: 0021967-88.2025.5.15.0000 AR AUTOR: MUNICIPIO DE PRADOPOLIS RÉU: ANTONIO ALEXANDRE MAGNUSSON   Id 80895a6 Trata-se de recurso ordinário interposto por MUNICÍPIO DE PRADÓPOLIS, em face do v. acórdão (Id 75cbf2d), publicado aos 12/05/2026. O apelo é tempestivo. A representação processual está regular. Custas isentas. O recorrente requer a concessão de efeito suspensivo ao recurso, sustentando que, na presente ação rescisória, já foi deferida tutela provisória suspendendo a execução quanto ao pagamento do abono assiduidade, em razão da plausibilidade do direito, reconhecida diante da declaração de inconstitucionalidade da LCM nº 166/2008 e do Decreto nº 457/2021 pelo TJSP, bem como do risco de dano decorrente do prosseguimento da execução. Invoca a aplicação subsidiária do CPC, a Súmula 414 do TST e doutrina para sustentar a possibilidade de concessão de efeito suspensivo pelo relator, requerendo, ao final, que seja atribuído efeito suspensivo ao recurso, a fim de impedir o prosseguimento da execução no processo de origem até o julgamento da demanda. É o breve relatório. D E C I D O Nos termos do art. 899 da CLT, os recursos trabalhistas são recebidos apenas no efeito devolutivo, de modo que a concessão de efeito suspensivo a recurso ordinário apenas em situações extraordinárias e, pois, com parcimônia e/ou razoabilidade, deve ser deferida. Prediz, ademais, o art. 995, parágrafo único, do CPC/2015, o seguinte: \"Art. 995. Os recursos não impedem a eficácia da decisão, salvo disposição legal ou decisão judicial em sentido diverso. Parágrafo único. A eficácia da decisão recorrida poderá ser suspensa por decisão do relator, se da imediata produção de seus efeitos houver risco de dano grave, de difícil ou impossível reparação, e ficar demonstr"},{"id":694309337,"data":"2026-08-13","tribunal":"TRT15","orgao":"Gabinete da Vice-Presidência Judicial - Análise de Recurso","numero":"0010256-33.2024.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081112225162100000156099515?instancia=2","partes":[{"nome":"BENEDITA DOS SANTOS SOUZA","polo":"P"},{"nome":"FORCA DE ELITE  CONSERVACAO E SERVICOS LTDA","polo":"P"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"}],"advogados":[{"nome":"JOSE ANTONIO FUNNICHELI","oab":"SP/79077"},{"nome":"GABRIEL FUNICHELLO","oab":"SP/443995"},{"nome":"FERNANDO SCUARCINA","oab":"SP/183555"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO ÓRGÃO ESPECIAL - ANÁLISE DE RECURSO Relator: ANDRE AUGUSTO ULPIANO RIZZARDO ROT 0010256-33.2024.5.15.0029 RECORRENTE: MUNICIPIO DE PRADOPOLIS RECORRIDO: BENEDITA DOS SANTOS SOUZA E OUTROS (1) INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID 8309aae proferida nos autos. Órgão Especial - Análise de Recurso Gabinete da Vice-Presidência Judicial - Análise de Recurso   Processo: 0010256-33.2024.5.15.0029 ROT RECORRENTE: MUNICIPIO DE PRADOPOLIS RECORRIDO: BENEDITA DOS SANTOS SOUZA, FORCA DE ELITE CONSERVACAO E SERVICOS LTDA   Id 6fb1853 RESOLUÇÃO TST 226/2026 – Agravo Interno – Agravo de instrumento. O E. TST editou a Resolução n. 226/2026, publicada no dia 22/04/2026, acrescentou os artigos 1º-B e 1º-C à IN 40/TST, com o seguinte teor (“in verbis”): “Art. 1º-B O agravo de instrumento é o recurso cabível contra a negativa de seguimento ao recurso de revista nos capítulos cuja conclusão denegatória do Tribunal Regional do Trabalho tenha por fundamento a conformidade do acórdão recorrido com decisão vinculante firmada pelo Supremo Tribunal Federal em matéria constitucional. § 1º Interposto o agravo de instrumento, caberá ao Tribunal de origem reconsiderar o juízo negativo de admissibilidade, se assim o entender, ou remeter os autos ao Tribunal Superior do Trabalho. § 2º É incabível o juízo de retratação de que trata o art. 1.030, II, do CPC nas hipóteses deste artigo. Art. 1º-C Pelo prazo de 60 (sessenta) dias, contados da vigência do artigo anterior, os agravos internos interpostos contra decisão de negativa de seguimento ao recurso de revista nas hipóteses nele previstas, e aqueles já interpostos pendentes de julgamento, serão automaticamente convertidos em agravo de instrumento. Parágrafo único. Realizada a conversão, o Tribunal Regional do Trabalho remeterá o processo ao Tribunal Superior do Trabalho e caberá ao Ministro Relator adotar as providências necessárias para o saneamento do recurso. (g.n.).” Desse modo, considerando que o agravo interno envolve a discussão relativa ao Tema n. 1118 de Repercussão Geral do STF, converto o apelo em agravo de instrumento. Encaminhe-"},{"id":694339803,"data":"2026-08-13","tribunal":"TRT15","orgao":"Gabinete da Vice-Presidência Judicial - Análise de Recurso","numero":"0010161-84.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081112310793800000156100736?instancia=2","partes":[{"nome":"MARLON MENDES JARDIM","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"LUCAS HENRIQUE DE OLIVEIRA","oab":"SP/282643"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO ÓRGÃO ESPECIAL - ANÁLISE DE RECURSO Relator: CARLOS EDUARDO OLIVEIRA DIAS ROT 0010161-84.2025.5.15.0120 RECORRENTE: MARLON MENDES JARDIM RECORRIDO: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 33abf92 proferido nos autos. Mantenho o despacho agravado. Intime(m)-se o(s) agravado(s) para apresentar(em) contraminuta e contrarrazões. Após regular processamento, remetam-se ao C. Tribunal Superior do Trabalho.   Campinas, 07 de agosto de 2026.   WILTON BORBA CANICOBA Desembargador Vice-Presidente Judicial\n\nIntimado(s) / Citado(s)\n - MARLON MENDES JARDIM"},{"id":695079409,"data":"2026-08-13","tribunal":"TRT15","orgao":"CON2 - Araraquara","numero":"0010201-32.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081207224648600000303578716?instancia=1","partes":[{"nome":"LUCAS HENRIQUE REIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ODAIR JOSE BARCELOS DA SILVA","oab":"SP/314524"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON2 - ARARAQUARA ATOrd 0010201-32.2026.5.15.0120 AUTOR: LUCAS HENRIQUE REIS RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Sentença ID 8ca2748 proferida nos autos, cujo dispositivo consta a seguir: SENTENÇA   1. RELATÓRIO   Trata-se de Reclamação Trabalhista ajuizada por LUCAS HENRIQUE REIS em face do MUNICÍPIO DE PRADÓPOLIS (ID 843ec63, fls. 2 a 12).   O Reclamante alegou, em síntese, que foi admitido em 16 de maio de 2017, após aprovação em concurso público, para exercer a função de Agente Comunitário de Saúde sob o regime da Consolidação das Leis do Trabalho, permanecendo com contrato de trabalho ativo e salário base de R$ 3.234,91. Sustentou que reside no Município de Ribeirão Preto e necessita utilizar transporte público coletivo municipal e intermunicipal para deslocamento diário até o local de trabalho em Pradópolis, totalizando quatro conduções por dia. Declarou que a municipalidade recusou o fornecimento do vale-transporte, obrigando-o a arcar integralmente com os custos de deslocamento. Pleiteou a concessão do benefício da justiça gratuita, o recebimento das parcelas vencidas e vincendas do vale-transporte até a efetiva implantação em folha de pagamento, com estimativa atribuída à causa de R$ 52.430,40, além de honorários advocatícios sucumbenciais. Juntou procuração, declaração de hipossuficiência e documentos (IDs e2eb756, 8556a14 e e1249ee, fls. 13, 14 e 23 a 24).   Iniciada a relação processual, o Município de Jaboticabal manifestou-se informando não integrar a lide, pois o Reclamante é servidor do Município de Pradópolis (ID 168d6da, fl. 32). O Reclamante apresentou emenda à petição inicial para sanar o erro material na distribuição e requerer a retificação do polo passivo para constar exclusivamente o Município de Pradópolis (ID 3ba4d85, fl. 33). A emenda foi recebida pelo Juízo, com a exclusão do Município de Jaboticabal e inclusão formal do Município de Pradópolis no polo passivo (ID fdc5303, fls. 34 a 35).   Devidamente citado, o MUNICÍPIO DE PRADÓPOLIS apresentou contestação escrita com documentos (IDs 34786a5, 3edd1f3, 5fe1541"},{"id":696032906,"data":"2026-08-13","tribunal":"STJ","orgao":"AJC ASSESSORIA DE JULGAMENTO COLEGIADO DA CORTE ESPECIAL","numero":"0002111-82.2014.8.26.0222","classe":"EMBARGOS DE DIVERGêNCIA EM AGRAVO EM RECURSO ESPECIAL","tipo":"Intimação","documento":"PAUTA DE JULGAMENTOS","meio":"Diário de Justiça Eletrônico Nacional","link":"https://justica.web.stj.jus.br/api/pcp/documentos/pdf/dinamico/MzkyMjgzOTE0MjAyMjAzODYwMjY5MTc4NjU3MDI2Mjg2Mw==","partes":[{"nome":"1. ALDAIR CANDIDO DE SOUZA (AGRAVANTE)","polo":"A"},{"nome":"2. MINISTÉRIO PÚBLICO DO ESTADO DE SÃO PAULO (AGRAVADO)","polo":"P"},{"nome":"3. EDITORA DANGUS LTDA (INTERESSADO)","polo":"A"},{"nome":"4. NETBIL EDUCACIONAL E INFORMATICA LTDA (OUTRO NOME)","polo":"A"},{"nome":"5. MARCELO TIEPOLO (INTERESSADO)","polo":"A"},{"nome":"6. MUNICIPIO DE PRADOPOLIS (INTERESSADO)","polo":"A"}],"advogados":[{"nome":"LUIS HENRIQUE GARCIA","oab":"SP/322822"},{"nome":"LEONARDO FURQUIM DE FARIA","oab":"SP/307731"},{"nome":"NESTOR LEONEL DE SOUZA NETO","oab":"SP/358378"},{"nome":"MARCO ANTONIO CAIS","oab":"SP/97584"},{"nome":"WASHINGTON ROCHA DE CARVALHO","oab":"SP/136272"}],"texto":"AgInt no RE no AgInt nos EAREsp 2263017/SP (2022/0386026-9) RELATOR : MINISTRO VICE-PRESIDENTE DO STJ AGRAVANTE : ALDAIR CANDIDO DE SOUZA ADVOGADOS : WASHINGTON ROCHA DE CARVALHO - SP136272 NESTOR LEONEL DE SOUZA NETO - SP358378 AGRAVADO : MINISTÉRIO PÚBLICO DO ESTADO DE SÃO PAULO INTERESSADO : EDITORA DANGUS LTDA OUTRO NOME : NETBIL EDUCACIONAL E INFORMATICA LTDA ADVOGADOS : MARCO ANTONIO CAIS - SP097584 LUIS HENRIQUE GARCIA - SP322822 LEONARDO FURQUIM DE FARIA - SP307731 INTERESSADO : MARCELO TIEPOLO INTERESSADO : MUNICIPIO DE PRADOPOLIS Processo incluído na Pauta de Julgamentos da CORTE ESPECIAL, Sessão Virtual do dia 02/09/2026 00:00:00, com encerramento no dia 08/09/2026 23:59:59 (RISTJ, Art. 184-E)."},{"id":695597340,"data":"2026-08-13","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010438-87.2022.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081214024117300000303633093?instancia=1","partes":[{"nome":"ADRIANA PERLATTO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"PAULO SERGIO MOREIRA DA SILVA","oab":"SP/165937"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA ATOrd 0010438-87.2022.5.15.0029 AUTOR: ADRIANA PERLATTO RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 9038618 proferido nos autos. Órgão Julgador de Origem: 1ª VARA DO TRABALHO DE JABOTICABAL DESPACHO Reitere-se a notificação ao autor para cumprimento da ordem de id. a00a229, em novo prazo de 10 dias, ciente de que na inércia os autos serão remetidos ao sobrestamento, sem prejuízo do prazo de prescrição intercorrente do artigo 11-A da CLT, até seu efetivo cumprimento.  ARARAQUARA/SP, 12 de agosto de 2026 ANDREA MARIA PFRIMER FALCAO Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - ADRIANA PERLATTO"},{"id":695122860,"data":"2026-08-13","tribunal":"TJSP","orgao":"Entrada Originários Direito Público, Câm. Especializadas e Meio Ambiente - Palácio da Justiça - sala 109","numero":"2200145-33.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Entrados","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"DOMINGOS CORTES","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"PROCESSO ENTRADO EM 10/08/2026\r\n\r\n2200145-33.2026.8.26.0000; Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011; Agravo de Instrumento; Comarca: Guariba; Vara: 2ª Vara Judicial; Ação: Execução Fiscal; Nº origem: 1502041-49.2018.8.26.0222; Assunto: Municipais; Agravante: Município de Pradópolis; Advogada: Laiza Soares Donato (OAB: 130719/MG); Agravado: Domingos Cortes"},{"id":695163232,"data":"2026-08-13","tribunal":"TJSP","orgao":"Distribuição Originários Direito Público, Câm. Especializadas e Meio Ambiente - Palácio da Justiça - sala 109","numero":"2200145-33.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Distribuídos","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"DOMINGOS CORTES","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"PROCESSOS DISTRIBUÍDOS EM 11/08/2026\r\n\r\n2200145-33.2026.8.26.0000; Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011; Agravo de Instrumento; 18ª Câmara de Direito Público; SIMONE GOMES RODRIGUES CASORETTI; Foro de Guariba; 2ª Vara Judicial; Execução Fiscal; 1502041-49.2018.8.26.0222; Municipais; Agravante: Município de Pradópolis; Advogada: Laiza Soares Donato (OAB: 130719/MG); Agravado: Domingos Cortes;"},{"id":695209587,"data":"2026-08-13","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000784-82.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MICHELE GARCIA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Processo 0000784-82.2026.8.26.0222 (processo principal 0001745-91.2024.8.26.0222) - Cumprimento de sentença - Horas Extras - Michele Garcia - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. 1. A interpretação sistemática da Lei Estadual nº 11.608/03 evidencia que, sendo o ente público isento da taxa judiciária, não se justifica exigir recolhimento antecipado pela parte exequente não beneficiária da justiça gratuita, pois isso acarretaria ressarcimento posterior incompatível com a lógica da sucumbência e com a própria isenção legal. Assim, é descabida a exigência de recolhimento na fase de execução. 2. Considerando a natureza ilíquida do título judicial transitado em julgado, o arbitramento dos honorários advocatícios se dará em momento oportuno, após a consolidação do débito principal. 3. Preenchidos os requisitos do art. 534 do CPC, recebo o pedido de cumprimento de sentença. Intime-se, via portal eletrônico, a Fazenda Pública para que apresente, nos próprios autos, impugnação sobre o valor principal, no prazo de 30 dias. Intime-se. - ADV: CLOVIS BRONZATI (OAB 279195/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP)"},{"id":695570689,"data":"2026-08-13","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1001695-14.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"IGOR SOUZA PINA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"FABIO EDUARDO DE LAURENTIZ","oab":"SP/170930"},{"nome":"VICTÓRIA VITTI DE LAURENTIZ","oab":"SP/393965"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1001695-14.2025.8.26.0222 - Procedimento Comum Cível - Responsabilidade do Fornecedor - Igor Souza Pina - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - Intimação das partes da data de audiência designada as fls. 235-238. Ficam os patronos cientificados de que cabe a eles o envio do link da audiência virtual às suas respectivas testemunhas arroladas, estando esta serventia dispensada do envio de mensagens ou convites eletrônicos aos depoentes. Dia 09/09/2026 às 16h. - ADV: FABIO EDUARDO DE LAURENTIZ (OAB 170930/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), VICTÓRIA VITTI DE LAURENTIZ (OAB 393965/SP)"},{"id":695811134,"data":"2026-08-13","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1500814-77.2025.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1500814-77.2025.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. 1. Noticiado o parcelamento administrativo pela parte exequente, homologo para que produza os jurídicos e legais efeitos, ficando suspensa a execução até o pagamento integral do débito, nos termos do artigo 922 do Código de Processo Civil. 2. Encaminhem-se os autos para fila \"Processo Suspenso\", lançando-se a movimentação (código 60975), considerando a data final do parcelamento do débito. O cumprimento do acordo deverá ser oportunamente noticiado pelo credor. 3. Caso haja novo pedido de sobrestamento do feito em razão da prorrogação do parcelamento administrativo da dívida, homologo desde já, sendo desnecessária a remessa dos autos para conclusão. 4. Ultrapassados cinco dias do vencimento da última parcela, intime-se, pelo portal eletrônico, a parte exequente a informar em 05 dias o cumprimento do avençado. Decorrido este prazo sem manifestação, presumir-se-á o pagamento integral da dívida, oportunidade em que os autos voltarão conclusos para extinção da execução, nos moldes do art. 924, inciso II, do Código de Processo Civil. 5. Comunicado o descumprimento da avença, o processo retomará seu curso (art. 922, parágrafo único, do Código de Processo Civil). Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":695811138,"data":"2026-08-13","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1002585-50.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"INSTITUTO IDEAS: ASSISTENCIA SOCIAL, ARTES E CULTURA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"SILVIO MARTINS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"SAULO EMANUEL ATIQUE","oab":"SP/218159"},{"nome":"CARLOS RENATO LIRA BUOSI","oab":"SP/262589"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Processo 1002585-50.2025.8.26.0222 - Procedimento Comum Cível - Contratos Administrativos - Clovis Bronzati - Silvio Martins - - Instituto Ideas: Assistencia Social, Artes e Cultura - - PREFEITURA MUNICIPAL DE PRADÓPOLIS - 1. Da gratuidade da justiça. O autor foi anteriormente intimado a comprovar a alegada insuficiência de recursos, mediante a apresentação da documentação apta a revelar sua capacidade contributiva global, e deixou de atender à determinação. Some-se a isso que se trata de advogado com atuação consolidada nesta comarca, circunstância que, aliada ao porte da demanda, infirma a presunção relativa que decorre da simples declaração de hipossuficiência. Presentes, pois, elementos que evidenciam a falta dos pressupostos legais do benefício, INDEFIRO a gratuidade postulada, nos termos do art. 99, § 2º, do Código de Processo Civil. Ressalvo que o indeferimento não afasta o regime próprio da ação popular, em que as custas e o preparo são pagos a final (art. 10 da Lei nº 4.717/65), tampouco a isenção prevista no art. 5º, LXXIII, da Constituição Federal e no art. 13 da Lei nº 4.717/65, salvo comprovada má-fé. 2. Das preliminares. Rejeito a preliminar de inépcia da inicial. A petição descreve com clareza os fatos, os fundamentos jurídicos e o pedido, deles decorrendo logicamente a conclusão, não incidindo qualquer das hipóteses do art. 330, § 1º, do Código de Processo Civil. As alegações do Instituto Ideas quanto à existência de autorização legislativa e à regularidade do chamamento público confundem-se com o mérito e com ele serão apreciadas. Igualmente rejeito a preliminar de inadequação da via eleita. À luz da teoria da asserção, a causa de pedir posta na inicial, ilegalidade na escolha da modalidade de contratação, inobservância do dever de licitar e lesividade ao patrimônio público, amolda-se ao objeto próprio da ação popular, que se presta à anulação de atos lesivos ao patrimônio público e à moralidade administrativa. A efetiva demonstração da ilegalidade e da lesividade é matéria de mérito. Adoto, no ponto, os fundamentos do parecer ministerial, que passa a integrar esta decisão. 3. Do saneamento. Não há outras questões processuais pendentes, nulidade"},{"id":695811147,"data":"2026-08-13","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1500549-75.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"AURELINA NUNES DE SOUZA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"ANTONIO CARLOS VENTURIN","oab":"SP/126420"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1500549-75.2025.8.26.0222 - Procedimento Comum Cível - Liminar - PREFEITURA MUNICIPAL DE PRADÓPOLIS - - AURELINA NUNES DE SOUZA - Vistos. Cumpra a z. serventia o disposto nos artigos 102, incisos II, IV e VI, 1.093, § 6º, 1.275, §§ 1º, 3º e 4º, das Normas de Serviço da Corregedoria Geral da Justiça, certificando-se nos autos. Após, remetam-se os autos ao Egrégio Tribunal de Justiça do Estado de São Paulo. Intimem-se. - ADV: ANTONIO CARLOS VENTURIN (OAB 126420/SP), ANTONIO CARLOS VENTURIN (OAB 126420/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":695811164,"data":"2026-08-13","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1500812-10.2025.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1500812-10.2025.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Verifica-se que a parte exequente não atendeu à determinação anterior, uma vez que o formulário de MLE juntado às fls. 46 permanece indicando valor diverso daquele efetivamente bloqueado. Intime-se para nova regularização, no prazo de 15 dias. Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":695811165,"data":"2026-08-13","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1500038-43.2026.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1500038-43.2026.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Verifica-se dos autos que a consulta aos sistema SISBAJUD já foi devidamente realizada, em 12/05/2026, conforme se depreende dos documentos acostados às fls. 14/16. A repetição de atos processuais já praticados configura manifesta desnecessidade procedimental, contrariando os princípios da economia processual e da duração razoável do processo. Assim, INDEFIRO o pedido formulado pelo exequente para nova pesquisa aos sistemas SISBAJUD. Manifeste-se a parte exequente em termos de prosseguimento do feito, no prazo de 15 dias. Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":695811166,"data":"2026-08-13","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1501936-33.2022.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1501936-33.2022.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Indefiro a citação por edital, pois não foram esgotadas as tentativas de localização da parte executada (consulta aos sistemas SISBAJUD, INFOJUD, RENAJUD e SIEL [pessoas físicas]). Defiro a pesquisa de endereço da parte executada Tatiana da Silva nos sistemas acima. Com o resultado, dê-se vista à parte exequente. Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":695816063,"data":"2026-08-13","tribunal":"TJSP","orgao":"Processamento 1º Grupo - 2ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"0001285-07.2024.8.26.0222","classe":"APELAçãO CíVEL","tipo":"Intimação","documento":"Intimação de acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANA PAULA APARECIDA SILVA DE PAULA","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"PAULO CESAR MARCOLINO","oab":"SP/128165"}],"texto":"INTIMAÇÃO DE ACÓRDÃO\r\n\r\nNº 0001285-07.2024.8.26.0222 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Apelação Cível - Guariba - Apte/Apdo: Município de Pradópolis - Apdo/Apte: Ana Paula Aparecida Silva de Paula - Magistrado(a) Claudio Augusto Pedrassi - Não conheceram dos recursos e suscitaram conflito negativo de competência, perante o Colendo STJ. V.U. - CONTRATO TEMPORÁRIO ESTATUÍDO PELA CLT. COMPETÊNCIA ABSOLUTA DA JUSTIÇA DO TRABALHO. SENDO O REGIME JURÍDICO E VERBA PLEITEADA REGIDA PELA CLT, A COMPETÊNCIA É DA JUSTIÇA DO TRABALHO, A TEOR DO ART. 114 DA CF. ADEMAIS, NO MUNICÍPIO DE PRADÓPOLIS, A PREVISÃO DO REGIME CELETISTA CONSTA EXPRESSAMENTE NA LEI ORGÂNICA MUNICIPAL, ART. 105. PRECEDENTES, INCLUSIVE DO STF EM JULGAMENTO DE REPERCUSSÃO GERAL. SUSCITADO O CONFLITO NEGATIVO DE COMPETÊNCIA, PERANTE O COLENDO STJ. RECURSOS NÃO CONHECIDOS. ART. 1007 CPC - EVENTUAL RECURSO - SE AO STJ: CUSTAS R$ 270,12 - (GUIA GRU NO SITE http://www.stj.jus.br) - RESOLUÇÃO STJ/GP N. 7 DE 28 DE JANEIRO DE 2025, ATUALIZADA PELA INSTRUÇÃO NORMATIVA STJ/GP N. 13 DE 27 DE JANEIRO DE 2026; SE AO STF: CUSTAS R$ 1.325,45 - GUIA GRU COBRANÇA - FICHA DE COMPENSAÇÃO - (EMITIDA ATRAVÉS DO SITE www.stf.jus.br ) E PORTE DE REMESSA E RETORNO R$ 178,10 - GUIA FEDTJ - CÓD 140-6 - BANCO DO BRASIL OU INTERNET - RESOLUÇÃO N. 914, DE 1º DE JULHO DE 2026 DO STF. Os valores referentes ao PORTE DE REMESSA E RETORNO, não se aplicam aos PROCESSOS ELETRÔNICOS, de acordo com o art. 3º, inciso, II, da RESOLUÇÃO N. 833, DE 13 DE MAIO DE 2024 DO STF. - Advs: Wesley Luiz Alves de Paula (OAB: 274238/SP) (Procurador) - Paulo Cesar Marcolino (OAB: 128165/SP) - 1º andar"},{"id":696202928,"data":"2026-08-13","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial - UPJ do Colégio Recursal dos Juizados Especiais do Estado de São Paulo","numero":"1002583-80.2025.8.26.0222","classe":"RECURSO INOMINADO CíVEL","tipo":"Intimação","documento":"VISTA","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CRISTIANE DE SOUZA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"VISTA\r\n\r\nNº 1002583-80.2025.8.26.0222 - Processo Digital - Recurso Inominado Cível - Guariba - Recorrente: Prefeitura Municipal de Pradópolis - Recorrida: Cristiane de Souza - PROCESSOS PAUTADOS PARA A SESSÃO DE JULGAMENTO VIRTUAL (NOS TERMOS DA RESOLUÇÃO CNJ 591/24) A SER REALIZADA DE: 20/08/2026 às 00:02. Nos termos do Comunicado Conjunto nº 562/2025 (CPA 2024/94754, DJe 21/7/2025) a pauta de julgamento está disponibilizada no link: https://esaj.tjsp.jus.br/pauta-julgamento-virtual-cr. 1) Ficam intimados os i. patronos das partes que eventual oposição ao julgamento virtual deverá ser realizada exclusivamente por meio de destaque para sustentação oral, nos termos do art. 8º da da Resolução CNJ nº 591/2024: 1.1) o pedido de destaque será protocolado através do login no Portal e-SAJ na tela “Acompanhamento de Julgamento” do processo pautado, seção “PEDIDO DE DESTAQUE”, clicando no botão “Solicitar destaque”. 1.2) Ficam as partes advertidas que NÃO deverá ser realizado oposição ao julgamento virtual por e-mail e nem por petição nos autos, sob pena de não conhecimento do pedido. 1.3) Para esclarecimentos de dúvidas, acesse: https://www.tjsp.jus.br/Download/PeticionamentoEletronico/Timbrado-PETIC_ELETRONICO-Acompanhamento_de_Julgamento_Virtual_25.09.2025.pdf 2) Fica, ainda, facultado aos advogados e demais habilitados nos autos encaminhar as respectivas sustentações gravadas em mídia (arquivo de áudio e/ou vídeo) por meio eletrônico após a publicação da pauta em até 48 (quarenta e oito) horas antes do início do julgamento em ambiente virtual, nos termos do art. 9º da Resolução CNJ nº 591/2024). 2.1) O protocolo da petição contendo o anexo da mídia será realizado via Portal e-SAJ, opção “Peticionamento Eletrônico” > “Peticionamento Eletrônico de 2º Grau”. 2.2) Para o passo a passos completo, acesse: http O PETRAROLHA ARROBAS MARTINS","polo":"A"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON2 - ARARAQUARA ATOrd 0010971-59.2025.5.15.0120 AUTOR: DANILO APARECIDO MARTINS (ESPÓLIO DE) RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Sentença ID 2906c95 proferida nos autos, cujo dispositivo consta a seguir: FABIO NATALI COSTA Juiz do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - DANILO APARECIDO MARTINS"},{"id":694342760,"data":"2026-08-12","tribunal":"TRT15","orgao":"CON2 - Araraquara","numero":"0010312-16.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081112433446600000303445758?instancia=1","partes":[{"nome":"MATHEUS MOLEIRO DOS SANTOS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON2 - ARARAQUARA ATOrd 0010312-16.2026.5.15.0120 AUTOR: MATHEUS MOLEIRO DOS SANTOS RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Sentença ID b541042 proferida nos autos, cujo dispositivo consta a seguir: 1. RELATÓRIO   MATHEUS MOLEIRO DOS SANTOS, qualificado nos autos, ajuizou reclamação trabalhista sob o rito ordinário em face de MUNICÍPIO DE PRADÓPOLIS, igualmente qualificado (ID 491be60, fls. 1-41).   O reclamante alegou que foi admitido pelo réu em 15/10/2007, após aprovação em concurso público, para exercer a função de jardineiro, estando o contrato de trabalho em vigor regido pela Consolidação das Leis do Trabalho (ID 491be60, fls. 6). Afirmou que cumpria jornada extraordinária de trabalho, incluindo labor em sábados, domingos, feriados, sem fruição regular de intervalos intrajornada e interjornada, além de permanecer continuamente em regime de sobreaviso. Sustentou também o direito ao pagamento de férias em dobro, à integração do auxílio-alimentação ao salário, à indenização suplementar com fulcro no artigo 404 do Código Civil e aos honorários advocatícios.   Formulou os pedidos descritos na exordial e atribuiu à causa o valor de R$ 414.620,97 (ID 491be60, fls. 37-41). Juntou procuração e documentos (ID e5ba76b a 1e9e800, fls. 42-68).   O réu apresentou contestação escrita (ID 96549a7, fls. 80-148). Suscitou preliminares de impugnação à justiça gratuita, inépcia da petição inicial por inespecificidade dos valores, limitação de eventual condenação aos valores dos pedidos, observância do teto remuneratório municipal, incompetência absoluta da Justiça do Trabalho para apreciar a parcela do auxílio-alimentação decorrente de lei municipal, falta de interesse de agir por ausência de pleito administrativo prévio e descabimento da inversão do ônus da prova.   Como prejudicial de mérito, arguiu a prescrição quinquenal. No mérito, pugnou pela total improcedência dos pedidos, aduzindo a presunção de veracidade e legitimidade dos registros de ponto acostados, a regularidade da quitação e compensação de horas extras via banco de horas, a fruição adequa"},{"id":694632796,"data":"2026-08-12","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010784-17.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081116264867600000303505510?instancia=1","partes":[{"nome":"CRISTIANE APARECIDA ALVES MARCARI","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"JOAO RENAN CASSORIELO COUTI","oab":"SP/360274"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010784-17.2026.5.15.0120 AUTOR: CRISTIANE APARECIDA ALVES MARCARI RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 4fedf68 proferido nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL DESPACHO Determino a inclusão do feito na pauta VIRTUAL de AUDIÊNCIA UNA do dia 16/02/2027, às 14h20, quando as partes deverão comparecer para prestar depoimentos pessoais, sob pena de confissão.   Observe a reclamada que deverá apresentar defesa e documentos até o horário da abertura da audiência, nos termos do art. 9º do Provimento GP-VPJ-CR nº 4/2013.   Caso a antecedência não seja observada, a defesa poderá ser apresentada oralmente em audiência, nos termos do artigo 847 da CLT.   Em relação às testemunhas:   Caso as partes desejem a intimação destas, deverão proceder à intimação delas na forma do disposto no artigo 455 do CPC, devendo informar à(s) testemunha(s) o horário e forma de acesso na audiência, a fim de que a(s) mesma(s) compareça(m) na sala de sessão virtual, sob pena de preclusão.    Atente o(a) patrono (a) que, no caso, a intimação deverá observar o disposto no § 1º do art. 455 do CPC. Não desejando a intimação, caberá à parte providenciar o comparecimento da testemunha na audiência telepresencial, sob pena de preclusão.   Eventuais impossibilidades técnicas ou de ordem prática de participação na sessão virtual, nos termos do § 1º do art. 6º da Resolução nº 314 do CNJ, deverão ser apresentadas pelas partes , até a data de audiência e de forma fundamentada e comprovada, sendo que o juízo deliberará acerca da justificativa por ocasião da própria audiência.   - O participante a ser ouvido deverá estar em ambiente fechado, vestido adequadamente para o ato, o que não significa vestes formais, mas apenas o natural respeito com o ato solene.   - Fica vedado o acesso em via pública, como praças ou em veículos, ainda que estacionados;   - O participante deverá ter capacidade de manusear o equipamento que acessa, inclusive estando com login aguardando na sala de espera virtual com no MÍNIMO 5 minutos de an"},{"id":694632960,"data":"2026-08-12","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010785-02.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26081116270052100000303505578?instancia=1","partes":[{"nome":"CRISTIANE APARECIDA ALVES MARCARI","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"JOAO RENAN CASSORIELO COUTI","oab":"SP/360274"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010785-02.2026.5.15.0120 AUTOR: CRISTIANE APARECIDA ALVES MARCARI RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID fd13d4b proferido nos autos. Órgão Julgador de Origem: 1ª VARA DO TRABALHO DE JABOTICABAL DESPACHO Visto. Considerando os princípios de celeridade e economia processuais, bem como princípio constitucional da duração razoável do processo e, havendo matéria de direito nos autos, independentemente da realização de audiência presencial ou por videoconferência, intimem-se as partes para que observem o seguinte CALENDÁRIO PROCESSUAL: Desde já a reclamada fica ciente e citada de que deve apresentar sua CONTESTAÇÃO e documentos, sem atribuição de sigilo, no Processo Judicial Eletrônico (PJe), no prazo até 28/09/2026, sob pena de se considerar verdadeiros os fatos alegados na inicial. No mesmo prazo, deverá dizer se pretende a produção de prova oral, apontando-as e justificando-as, sob pena de indeferimento, observando-se que o silêncio será interpretado como falta de pretensão probatória; Em seguida, a reclamante desde já fica intimada de que poderá apresentar sua RÉPLICA, de 29/09/2026 a 05/10/2026, com apontamento, por amostragem, de eventuais diferenças com base nos documentos juntados, se for o caso, sob pena de preclusão, bem como dizer se pretende produzir outras provas, apontando-as e justificando-as, sob pena de indeferimento, observando-se que o silêncio será interpretado como falta de pretensão probatória; Decorrido, venham conclusos para designação de perícia médica. Intimem-se. ARARAQUARA/SP, 11 de agosto de 2026 POLYANNA SAMPAIO CANDIDO DA SILVA SANTOS Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - CRISTIANE APARECIDA ALVES MARCARI"},{"id":694535422,"data":"2026-08-12","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial - UPJ do Colégio Recursal dos Juizados Especiais do Estado de São Paulo","numero":"1002583-80.2025.8.26.0222","classe":"RECURSO INOMINADO CíVEL","tipo":"Intimação","documento":"Próximos Julgados","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CRISTIANE DE SOUZA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"1002583-80.2025.8.26.0222 - Processo Digital - Recurso Inominado Cível - Guariba - Relator Ana Carla Criscione dos Santos - Colégio Recursal - Recorrente: Prefeitura Municipal de Pradópolis - Recorrida: Cristiane de Souza - Advogado: Wesley Luiz Alves de Paula (OAB: 274238/SP) - Advogado: Daniel de Souza Silva (OAB: 297740/SP)PAUTADO EM SESSÃO ELETRÔNICA ORDINÁRIA DA(O) 5ª TURMA RECURSAL DE FAZENDA PÚBLICA A REALIZAR-SE DE FORMA VIRTUAL COM INÍCIO EM 20 DE AGOSTO DE 2026 (QUINTA-FEIRA) ÀS 00:02 HORAS E TÉRMINO EM 27 DE AGOSTO DE 2026 (QUINTA-FEIRA) ÀS 23:59 HORAS."},{"id":694866606,"data":"2026-08-12","tribunal":"TJSP","orgao":"Processamento 1º Grupo - 1ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"1002315-26.2025.8.26.0222","classe":"APELAçãO CíVEL","tipo":"Intimação","documento":"Intimação de acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"JOãO PAULO MOREIRA DE SOUZA","polo":"A"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"INTIMAÇÃO DE ACÓRDÃO\r\n\r\nNº 1002315-26.2025.8.26.0222 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Apelação Cível - Guariba - Apelante: João Paulo Moreira de Souza - Apelado: Município de Pradópolis - Magistrado(a) Magalhães Coelho - Negaram provimento ao recurso. V. U. - EMENTA: DIREITO ADMINISTRATIVO. APELAÇÃO. REMUNERAÇÃO DE SERVIDOR PÚBLICO. PEDIDO JULGADO IMPROCEDENTE.I. CASO EM EXAME: AÇÃO ORDINÁRIA DE COBRANÇA C/C OBRIGAÇÃO DE FAZER AJUIZADA POR JOÃO PAULO MOREIRA DE SOUZA CONTRA O MUNICÍPIO DE PRADÓPOLIS, VISANDO O PAGAMENTO DE ADICIONAL POR TEMPO DE SERVIÇO, QUINQUÊNIOS, SEXTA-PARTE E LICENÇA PRÊMIO, CONFORME LEI Nº 115/1967, E ABONO SALARIAL DA LEI FEDERAL Nº 8.178/1991.II. QUESTÃO EM DISCUSSÃO:  A QUESTÃO EM DISCUSSÃO CONSISTE EM VERIFICAR (I) A EXISTÊNCIA DE DIREITO ADQUIRIDO À COMPOSIÇÃO REMUNERATÓRIA FIXADA PELA LEI MUNICIPAL Nº 115/1967 E (II) O DIREITO DO AUTOR AO PAGAMENTO DE REMUNERAÇÃO DE ABONO SALARIAL ESTABELECIDO PELA LEI FEDERAL Nº 8.178/1991.III. RAZÕES DE DECIDIR: A APLICAÇÃO DA CLT É AFASTADA, POIS O AUTOR BUSCA PAGAMENTO DE PARCELAS DE NATUREZA ADMINISTRATIVA. NÃO HÁ DIREITO ADQUIRIDO A REGIME JURÍDICO-REMUNERATÓRIO PARA SERVIDORES PÚBLICOS, CONFORME JURISPRUDÊNCIA DO STF.IV. DISPOSITIVO: RECURSO NÃO PROVIDO. ART. 1007 CPC - EVENTUAL RECURSO - SE AO STJ: CUSTAS R$ 270,12 - (GUIA GRU NO SITE http://www.stj.jus.br) - RESOLUÇÃO STJ/GP N. 7 DE 28 DE JANEIRO DE 2025, ATUALIZADA PELA INSTRUÇÃO NORMATIVA STJ/GP N. 13 DE 27 DE JANEIRO DE 2026; SE AO STF: CUSTAS R$ 1.325,45 - GUIA GRU COBRANÇA - FICHA DE COMPENSAÇÃO - (EMITIDA ATRAVÉS DO SITE www.stf.jus.br ) E PORTE DE REMESSA E RETORNO R$ 178,10 - GUIA FEDTJ - CÓD 140-6 - BANCO DO BRASIL OU INTERNET - RESOLUÇÃO N. 914, DE 1º DE JULHO DE 2026 DO STF. Os valores referentes ao PORTE DE REMESSA E RETORNO, não se aplicam aos PROCESSOS ELETRÔNICOS, de acordo com o art. 3º, inciso, II, da RESOLUÇÃO N. 833, DE 13 DE MAIO DE 2024 DO STF. - Advs: Daniel de Souza Silva (OAB: 297740/SP) - Wesley Luiz Alves de Paula (OAB: 274238/SP) (Procurador) - 1º andar"},{"id":693214787,"data":"2026-08-11","tribunal":"TJSP","orgao":"Foro de Ribeirão Preto - 2ª Vara da Fazenda Pública","numero":"0020967-66.2024.8.26.0506","classe":"PRECATÓRIO","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MUNICÍPIO DE PRADÓPOLIS","polo":"P"},{"nome":"SOLANGE APARECIDA DE OLIVEIRA BUENO","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"LEANDRO HENRIQUE DE OLIVEIRA PATETE","oab":"SP/468388"}],"texto":"Processo 0020967-66.2024.8.26.0506/01 - Precatório - Indenização por Dano Moral - Solange Aparecida de Oliveira Bueno - MUNICÍPIO DE PRADÓPOLIS - Fls. 33/36: Vista à parte requerente, pelo prazo de 15 (quinze) dias. - ADV: LEANDRO HENRIQUE DE OLIVEIRA PATETE (OAB 468388/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":693214790,"data":"2026-08-11","tribunal":"TJSP","orgao":"Foro de Ribeirão Preto - 2ª Vara da Fazenda Pública","numero":"0020967-66.2024.8.26.0506","classe":"PRECATÓRIO","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MUNICÍPIO DE PRADÓPOLIS","polo":"P"},{"nome":"WILIAN CLEBERSON BUENO","polo":"A"}],"advogados":[{"nome":"LEANDRO HENRIQUE DE OLIVEIRA PATETE","oab":"SP/468388"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0020967-66.2024.8.26.0506/02 -  poderá ser efetivado pelo uso de smartphone ou computador pessoal com câmera. Nos termos do art. 844 da CLT, a ausência da parte autora implicará arquivamento do feito e o(s) réu(s) deverá(ão) comparecer pessoalmente (ou por preposto que tenha conhecimento dos fatos) e apresentar defesa até o horário da audiência, sob pena de revelia e confissão quanto à matéria de fato, presumindo-se verdadeiros os fatos alegados pela parte autora. Com a defesa, o(s) réu(s) deverá(ão) apresentar, no Processo Judicial Eletrônico (PJe), em formato PDF, documentos pessoais, instrumento constitutivo (contrato social), se pessoa jurídica, e documentos que pretende utilizar como prova. Para conhecimento do pedido, o(s) réu(s) deverão acessar a petição inicial pela página eletrônica (https://pje.trt15.jus.br/pjekz/validacao), digitando a(s) chave(s): 26072718010761200000301804425 As partes não precisam levar testemunhas nesta audiência. A comunicação da designação direta à parte deve ser feita por seu respectivo patrono. .\n\nIntimado(s) / Citado(s)\n - GUILHERME DE SOUZA GIGAR"},{"id":693304310,"data":"2026-08-11","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"0105118-32.2010.8.26.0222","classe":"AçãO POPULAR","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANTONIO CARLOS CAMPOS ROSSI","polo":"P"},{"nome":"AUGUSTO ALEXANDRE CAMPOS ROSSI","polo":"P"},{"nome":"CARLOS CESAR ALMAGRO","polo":"A"},{"nome":"CARLOS EDUARDO NUNES ROSSI","polo":"P"},{"nome":"EXITUM ASSESSORIA E PLANEJAMENTO MUNICIPAL LTDA","polo":"P"},{"nome":"GéSSICA APARECIDA NUNES ROSSI","polo":"P"},{"nome":"ISABEL RODRIGUES NUNES ROSSI","polo":"P"},{"nome":"JOSE CARLOS ROSSI","polo":"P"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"SP/394178"},{"nome":"CARLOS MARCELLO ROCHA MESQUITA","oab":"SP/209471"},{"nome":"EDER JOSÉ GUEDES DA CUNHA","oab":"SP/292734"},{"nome":"RODRIGO CREPALDI PEREZ CAPUCELLI","oab":"SP/334704"},{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"SAULO EMANUEL ATIQUE","oab":"SP/218159"},{"nome":"SUELI APARECIDA MILANI COELHO","oab":"SP/142872"},{"nome":"RICARDO ORNELLAS RAMOS","oab":"SP/240414"}],"texto":"Processo 0105118-32.2010.8.26.0222 - Ação Popular - DIREITO ADMINISTRATIVO E OUTRAS MATÉRIAS DE DIREITO PÚBLICO - Carlos Cesar Almagro e outro - MUNICIPIO DE PRADOPOLIS - - ANTONIO CARLOS CAMPOS ROSSI - - AUGUSTO ALEXANDRE CAMPOS ROSSI - - JOSE CARLOS ROSSI - - EXITUM ASSESSORIA E PLANEJAMENTO MUNICIPAL LTDA - - Isabel Rodrigues Nunes Rossi - - Carlos Eduardo Nunes Rossi - - Géssica Aparecida Nunes Rossi e outro - Transitado em julgado o V. Acórdão proferido nos presentes autos. Estimo os honorários advocatícios dos defensores nomeados à parte requerida nos termos do Convênio OAB/PGE. Expeça-se certidão, intimando-se o(a) patrono(a) a imprimi-la via sistema. No mais, a parte requerente é isenta de custas por se tratar de ação popular. Entretanto, considerando que alguns dos correqueridos não são beneficiários da gratuidade processual ou não possuem isenção legal, sendo vencidos na ação, deverão recolher as custas e despesas processuais nos termos do inciso I do artigo 4º da Lei Estadual nº 11.608/03 e das Normas da Corregedoria Geral de Justiça do E. TJ-SP. Ressalta-se que, em caso de parcial procedência, nos termos do caput do art. 86 do CPC, deve ser observado o disposto na sentença ou no acórdão quanto à distribuição do ônus da sucumbência. Assim, havendo determinação de rateio, as despesas e taxas deverão ser suportadas proporcionalmente, cabendo ao requerido o recolhimento das custas na proporção de 50%, ficando o autor isento em razão da natureza da ação. Por outro lado, caso reconhecida a sucumbência mínima do autor, as despesas e taxas deverão ser integralmente suportadas pelo requerido sucumbente. Portanto, após elaborada a planilha de cálculo de valores devidos a tais títulos, intime-se a parte requerida a recolher as custas inerentes ao processo no prazo de 15 (quinze) dias. As orientações para os devidos recolhimentos devem ser obtidas junto ao link https://www.tjsp.jus.br/IndicesTaxasJudiciarias/DespesasProcessuais . Cumpre ao cartório observar o devido recolhimento nos termos dos §§ 5º (casos de gratuidade processual) e 6º (diferimento do recolhimento da taxa judiciária ao final) do artigo 1.098 das NSCGJSP, fulcrado no Provimento CG nº 29/2021. Ex"},{"id":693356949,"data":"2026-08-11","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1001856-24.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANTONIO FRANCISCO DE MELO","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"VANILZA CRISTINA DA SILVA","oab":"SP/302110"}],"texto":"Processo 1001856-24.2025.8.26.0222 - Procedimento Comum Cível - Indenização por Dano Moral - Antonio Francisco de Melo - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Nomeio perito judicial o Sr. Murilo Coelho Theodoro Neves - murilocoelho.tn@gmail.com, que cumprirá o encargo escrupulosamente, valendo a decisão como termo de compromisso. Intimem-se o profissional para dizer, em 5 (cinco) dias, se aceita o encargo confiado e, em positivo, deverá estimar seus honorários. Aceitando o encargo, e com a estimativa apresentada, intime-se a parte autora a se manifestar, bem como comprovando o pagamento nos autos mediante depósito judicial, no prazo de 15 dias, oportunidade em que os honorários ficarão desde já fixados. Efetivado o depósito, intime o perito, por e-mail (confirmando seu recebimento), para realização dos trabalhos em 30 (trinta) dias. Havendo impugnação da proposta pelos autores, intime-se o perito a se manifestar em 10 dias. Intime-se. - ADV: VANILZA CRISTINA DA SILVA (OAB 302110/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":693565319,"data":"2026-08-11","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial - UPJ do Colégio Recursal dos Juizados Especiais do Estado de São Paulo","numero":"1002580-28.2025.8.26.0222","classe":"RECURSO INOMINADO CíVEL","tipo":"Intimação","documento":"Próximos Julgados","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MARCELA ORNELLAS DE AMEIDA RAMOS","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"1002580-28.2025.8.26.0222 - Processo Digital - Recurso Inominado Cível - Guariba - Relator Isabel Cristina Alonso Bezerra Zara - Colégio Recursal - Recorrente: Prefeitura Municipal de Pradópolis - Recorrida: Marcela Ornellas de Ameida Ramos - Advogado: Wesley Luiz Alves de Paula (OAB: 274238/SP) - Advogado: Daniel de Souza Silva (OAB: 297740/SP)PAUTADO EM SESSÃO ELETRÔNICA ORDINÁRIA DA(O) 3ª TURMA RECURSAL DE FAZENDA PÚBLICA A REALIZAR-SE DE FORMA VIRTUAL COM INÍCIO EM 20 DE AGOSTO DE 2026 (QUINTA-FEIRA) ÀS 00:04 HORAS E TÉRMINO EM 27 DE AGOSTO DE 2026 (QUINTA-FEIRA) ÀS 23:59 HORAS."},{"id":693570137,"data":"2026-08-11","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial - UPJ do Colégio Recursal dos Juizados Especiais do Estado de São Paulo","numero":"1002580-28.2025.8.26.0222","classe":"RECURSO INOMINADO CíVEL","tipo":"Intimação","documento":"Próximos Julgados","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MARCELA ORNELLAS DE AMEIDA RAMOS","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"1002580-28.2025.8.26.0222 - Processo Digital - Recurso Inominado [{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"VANILZA CRISTINA DA SILVA","oab":"SP/302110"}],"texto":"INTIMAÇÃO DE ACÓRDÃO\r\n\r\nNº 2095941-35.2026.8.26.0000 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Agravo de Instrumento - Guariba - Agravante: Município de Pradópolis - Agravado: Antonio Francisco de Mello - Magistrado(a) Jarbas Gomes - Negaram provimento ao recurso. V. U. - DIREITO PROCESSUAL CIVIL. AGRAVO DE INSTRUMENTO. CHAMAMENTO AO PROCESSO. INDEFERIMENTO. RECURSO DESPROVIDO.I. CASO EM EXAME1. AGRAVO DE INSTRUMENTO INTERPOSTO CONTRA DECISÃO QUE INDEFERIU O CHAMAMENTO AO PROCESSO DO INCRA E DO ITESP, EM AÇÃO DE OBRIGAÇÃO DE FAZER CUMULADA COM INDENIZAÇÃO POR DANOS MATERIAIS E MORAIS MOVIDA POR ASSENTADO RURAL EM FACE DO MUNICÍPIO DE PRADÓPOLIS.II. QUESTÃO EM DISCUSSÃO2. A QUESTÃO EM DISCUSSÃO CONSISTE EM VERIFICAR A POSSIBILIDADE DE CHAMAMENTO AO PROCESSO DO INCRA E ITESP, COM BASE NA ALEGAÇÃO DE SOLIDARIEDADE JURÍDICA E LITISCONSÓRCIO PASSIVO NECESSÁRIO.III. RAZÕES DE DECIDIR3. O CHAMAMENTO AO PROCESSO É LIMITADO ÀS HIPÓTESES TAXATIVAS DO ARTIGO 130 DO CPC, NÃO SE APLICANDO A CASOS DE COMPETÊNCIA CONCORRENTE OU CORRESPONSABILIDADE ALEGADA.4. A RESPONSABILIDADE DO MUNICÍPIO É JUSTIFICADA PELO EXERCÍCIO EFETIVO DO SERVIÇO DE ABASTECIMENTO DE ÁGUA, INDEPENDENTEMENTE DA TITULARIDADE DA ÁREA, CONFORME RECONHECIDO NA PRÓPRIA CONTESTAÇÃO.IV. DISPOSITIVO5. RECURSO DESPROVIDO. ART. 1007 CPC - EVENTUAL RECURSO - SE AO STJ: CUSTAS R$ 270,12 - (GUIA GRU NO SITE http://www.stj.jus.br) - RESOLUÇÃO STJ/GP N. 7 DE 28 DE JANEIRO DE 2025, ATUALIZADA PELA INSTRUÇÃO NORMATIVA STJ/GP N. 13 DE 27 DE JANEIRO DE 2026; SE AO STF: CUSTAS R$ 1.325,45 - GUIA GRU COBRANÇA - FICHA DE COMPENSAÇÃO - (EMITIDA ATRAVÉS DO SITE www.stf.jus.br ) E PORTE DE REMESSA E RETORNO R$ 118,90 - GUIA FEDTJ - CÓD 140-6 - BANCO DO BRASIL OU INTERNET - RESOLUÇÃO N. 914, DE 1º DE JULHO DE 2026 DO STF. Os valores referentes ao PORTE DE REMESSA E RETORNO, não se aplicam aos PROCESSOS ELETRÔNICOS, de acordo com o art. 3º, inciso, II, da RESOLUÇÃO N. 833, DE 13 DE MAIO DE 2024 DO STF. - Advs: Wesley Luiz Alves de Paula (OAB: 274238/SP) - Vanilza Cristina da Silva (OAB: 302110/SP) - 1° andar"},{"id":692059640,"data":"2026-08-10","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000585-94.2025.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"AVAM TRANPORTES E SERVIçOS LTDA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"AMARILDO FERREIRA DOS SANTOS","oab":"SP/157074"}],"texto":"Processo 0000585-94.2025.8.26.0222 (processo principal 1001500-05.2020.8.26.0222) - Cumprimento de sentença - Esbulho / Turbação / Ameaça - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Avam Tranportes e Serviços Ltda - Vistos. Decorrido o prazo sem manifestação em termos de prosseguimento e considerando as diligências já realizadas sem êxito na localização de bens penhoráveis, reconheço, neste momento, a execução frustrada. Determino a remessa dos autos ao arquivo provisório, com o lançamento da movimentação pertinente (código 61613) no sistema SAJ/PG5, nos termos do Comunicado CG 259-2023. Consigne-se que a suspensão prevista no art. 921 do Código de Processo Civil opera-se na forma da lei, podendo o feito ser desarquivado a qualquer tempo mediante provocação do exequente com indicação de medida eficaz à satisfação do crédito. Intime-se o ente público pelo portal eletrônico. Intime-se. - ADV: AMARILDO FERREIRA DOS SANTOS (OAB 157074/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":692726413,"data":"2026-08-10","tribunal":"TJSP","orgao":"Processamento 7º Grupo - 18ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º anda onzati (OAB: 279195/SP); Advogada: Viviane Cristina Bronzati (OAB: 444669/SP); Agravante: Valter Luiz Marcari; Advogado: Clovis Bronzati (OAB: 279195/SP); Advogada: Viviane Cristina Bronzati (OAB: 444669/SP); Agravante: Vítor Emílio Marcari; Advogado: Clovis Bronzati (OAB: 279195/SP); Advogada: Viviane Cristina Bronzati (OAB: 444669/SP); Agravado: Município de Pradópolis; Advogado: Wesley Luiz Alves de Paula (OAB: 274238/SP); Interessado: Ivanete Marcari; Advogado: Clovis Bronzati (OAB: 279195/SP);"},{"id":690786474,"data":"2026-08-07","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000482-53.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"},{"nome":"S. F. EMPREENDIMENTOS IMOBILIARIOS LTDA - EPP","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"JOSE ANTONIO FUNNICHELI","oab":"SP/79077"}],"texto":"Processo 0000482-53.2026.8.26.0222 (processo principal 1000301-11.2021.8.26.0222) - Cumprimento de sentença - Indenização por Dano Moral - PREFEITURA MUNICIPAL DE PRADÓPOLIS - S. F. Empreendimentos Imobiliarios Ltda - EPP - Vistos. O executado requer o parcelamento do débito com fundamento no art. 916 do Código de Processo Civil. O exequente manifestou-se contrariamente ao pedido. Em todo caso, a pretensão não comporta acolhimento, porquanto o parcelamento previsto no art. 916 do CPC não se aplica ao cumprimento de sentença, nos termos do § 7º do referido dispositivo legal. Diante do exposto, indefiro o pedido de parcelamento formulado pelo executado. Manifeste-se a parte exequente em termos de prosseguimento do feito, no prazo de 15 dias. Intime-se. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), JOSE ANTONIO FUNNICHELI (OAB 79077/SP)"},{"id":690786500,"data":"2026-08-07","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000265-10.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 0000265-10.2026.8.26.0222 (processo principal 1000572-78.2025.8.26.0222) - Cumprimento de sentença - Garantias Constitucionais - Clovis Bronzati - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Trata-se de incidente de cumprimento de sentença movido por Clovis Bronzati contra PREFEITURA MUNICIPAL DE PRADÓPOLIS. A parte exequente apresentou planilha de cálculo à(s) fl(s). 05, concordando expressamente a parte executada (fl. 59). Ante o exposto, HOMOLOGO os cálculos apresentados nos autos, às fls. 05, para que produza os legais efeitos de direito. Homologo também a renúncia ao direito de recorrer. Declaro o trânsito em julgado nesta data, valendo a presente como certidão. A partir de 02/07/2015, o processamento das requisições de Precatório e RPV somente será admitido no formato digital, tanto para processos físicos como digitais. Em tais termos, a parte exequente deverá solicitar o ofício requisitório exclusivamente por peticionamento eletrônico, através do portal e-SAJ, independente do formato da tramitação do processo principal (digital ou em papel). O exequente deverá utilizar a opção Petição Intermediária de 1º Grau, selecionar a Categoria Incidente processual, Classes: Precatório ou RPV, conforme o caso, e informar os valores requisitados individualmente para cada credor, anexando as principais peças. Em caso simultâneo de RPV e Precatório, deverão ser formados dois procedimentos. Fixo o prazo de 30 dias para criação dos incidentes pelo patrono(a) do(a) credor(a). Deve-se observar que, mesmo para os autos físicos, o peticionamento incidental deve ser realizado pela via digital. O incidente deverá ser instruído com cópias das peças discriminadas no art. 6º do Provimento CSM nº 2.753/2024, disponibilizado no DJE em 12/09/2024, págs. 25/30: \"Art. 6º A requisição deverá ser instruída com as seguintes peças processuais: I - sentença e/ou acórdão referentes à condenação pelo juízo de origem ou cópia autenticada do título executivo extrajudicial, se o caso; II - certidão de trânsito em julgado da fase de conhecimento; III - decisão definitiva que homologou os cálculos objeto da requisição ou decisão que determinou a expedição dos valores incontroversos; IV -"},{"id":691141676,"data":"2026-08-07","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0000201-97.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA CONTRA A FAZENDA PúBLICA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"ZILDA ORNELLAS DE ALMEIDA RAMOS","polo":"A"}],"advogados":[{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 0000201-97.2026.8.26.0222 (processo principal 0000976-49.2025.8.26.0222) - Cumprimento de Sentença contra a Fazenda Pública - Jornada de Trabalho - Zilda Ornellas de Almeida Ramos - PREFEITURA MUNICIPAL DE PRADÓPOLIS - A petição de fls. 110/113 deve ser protocolizada no incidente do RPV nº 0000201.97.2026.8.26.0222/02 local onde ocorreu a requisição e o depósito. - ADV: CLOVIS BRONZATI (OAB 279195/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":689048740,"data":"2026-08-06","tribunal":"TRT15","orgao":"Gabinete da Desembargadora Tereza Aparecida Asta Gemignani - 1 Câmara","numero":"0010929-36.2018.5.15.0029","classe":"AGRAVO DE PETIçãO","tipo":"Lista de distribuição","documento":"Distribuição","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/visualizacao/26080500300188100000155824233?instancia=2","partes":[{"nome":"CARLOS ALBERTO VICTORELLI BITELA","polo":"A"},{"nome":"FREDERICO CARLOS DE PINHO PRADO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"UNIÃO FEDERAL (PGF)","polo":"A"}],"advogados":[{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Processo 0010929-36.2018.5.15.0029 distribuído para 1ª Câmara - Gabinete da Desembargadora Tereza Aparecida Asta Gemignani - 1 Câmara na data 04/08/2026 \n Para maiores informações, clique no link a seguir: https://pje.trt15.jus.br/pjekz/visualizacao/26080500300188100000155824233?instancia=2"},{"id":689835799,"data":"2026-08-06","tribunal":"TST","orgao":"Subseção II Especializada em Dissídios Individuais","numero":"0048931-89.2023.5.15.0000","classe":"AGRAVO","tipo":"Intimação","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://sessao-integracao-backend.prd.rede.tst/documentos/PJe--2901/48931-89.2023.5.15.0000/certidao-inclusao-pauta/MDYvMDgvMjAyNiAwMDowMDowMCMtODQyODc0ODc4","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"VALDEMAR JOSE DA SILVA","polo":"P"}],"advogados":[{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Pauta de Julgamento (processos PJe) da Sessão Ordinária da Subseção II Especializada em Dissídios Individuais, a realizar-se exclusivamente em ambiente eletrônico (sessão virtual).\n\nA sessão virtual terá início no dia 02/09/2026 e encerramento 10/09/2026.\n\n1. Sustentação oral na sessão virtual:\n\n1.1. Sustentações eletrônicas: Nas hipóteses de cabimento de sustentação oral, fica facultado ao advogado encaminhar a sustentação por meio eletrônico, após a publicação da pauta até 48 horas antes do início da sessão virtual (art. 134-A do RITST). Neste caso, o julgamento será realizado em ambiente eletrônico (sessão virtual).\n\n1.2. Formato e responsabilidade: As sustentações devem seguir as especificações técnicas do Tribunal (Ato SEGJUD.GP nº 129/2025), e o advogado firmará termo de declaração de que se encontra devidamente habilitado nos autos e de responsabilidade pelo conteúdo do arquivo enviado (art. 134-A, §§ 3º e 4º, do RITST).\n\n\n\n2. Destaque para julgamento em sessão presencial:\n\n2.1. Prazo: O pedido de destaque pode ser feito desde a publicação da pauta até 48 horas antes do início da sessão virtual (art. 135, II, do RITST).\n\n2.2. Requerimento: O advogado deve formalizar o pedido de destaque por meio de inscrição eletrônica no endereço https://www.tst.jus.br/portal-da-advocacia.\n\n2.3. Condição: O pedido de destaque só poderá ser realizado se o julgamento do processo comportar sustentação oral, e será submetido à consideração do relator. Em caso de deferimento, o processo será remetido para julgamento presencial, com publicação de nova pauta (art. 135 do RITST).\n\n\n\nObservação: Caso opte por encaminhar a sustentação oral por meio eletrônico, o advogado não poderá requerer o destaque do processo para julgamento presencial (art. 134-A, § 5º, do RITST).\n\n\nProcesso Ag-ROT - 48931-89.2023.5.15.0000 incluído no PLENARIO VIRTUAL.\nRelator: MINISTRO DOUGLAS ALENCAR RODRIGUES.\n\nADRIANA MEDEIROS\nSecretária da Subseção II Especializada em Dissídios Individuais."},{"id":689835838,"data":"2026-08-06","tribunal":"TST","orgao":"Subseção II Especializada em Dissídios Individuais","numero":"0050360-91.2023.5.15.0000","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://sessao-integracao-backend.prd.rede.tst/documentos/PJe--2901 sídios Individuais, a realizar-se exclusivamente em ambiente eletrônico (sessão virtual).\n\nA sessão virtual terá início no dia 02/09/2026 e encerramento 10/09/2026.\n\n1. Sustentação oral na sessão virtual:\n\n1.1. Sustentações eletrônicas: Nas hipóteses de cabimento de sustentação oral, fica facultado ao advogado encaminhar a sustentação por meio eletrônico, após a publicação da pauta até 48 horas antes do início da sessão virtual (art. 134-A do RITST). Neste caso, o julgamento será realizado em ambiente eletrônico (sessão virtual).\n\n1.2. Formato e responsabilidade: As sustentações devem seguir as especificações técnicas do Tribunal (Ato SEGJUD.GP nº 129/2025), e o advogado firmará termo de declaração de que se encontra devidamente habilitado nos autos e de responsabilidade pelo conteúdo do arquivo enviado (art. 134-A, §§ 3º e 4º, do RITST).\n\n\n\n2. Destaque para julgamento em sessão presencial:\n\n2.1. Prazo: O pedido de destaque pode ser feito desde a publicação da pauta até 48 horas antes do início da sessão virtual (art. 135, II, do RITST).\n\n2.2. Requerimento: O advogado deve formalizar o pedido de destaque por meio de inscrição eletrônica no endereço https://www.tst.jus.br/portal-da-advocacia.\n\n2.3. Condição: O pedido de destaque só poderá ser realizado se o julgamento do processo comportar sustentação oral, e será submetido à consideração do relator. Em caso de deferimento, o processo será remetido para julgamento presencial, com publicação de nova pauta (art. 135 do RITST).\n\n\n\nObservação: Caso opte por encaminhar a sustentação oral por meio eletrônico, o advogado não poderá requerer o destaque do processo para julgamento presencial (art. 134-A, § 5º, do RITST).\n\n\nProcesso ROT - 51176-73.2023.5.15.0000 incluído no PLENARIO VIRTUAL.\nRelator: MINISTRA MARIA HELENA MALLMANN.\n\nADRIANA MEDEIROS\nSecretária da Subseção II Especializada em Dissídios Individuais."},{"id":689739714,"data":"2026-08-06","tribunal":"TRT15","orgao":"CON2 - Araraquara",
