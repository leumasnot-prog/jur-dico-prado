iário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"JOãO PAULO MOREIRA DE SOUZA","polo":"A"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"DESPACHO\r\n\r\nNº 1002315-26.2025.8.26.0222 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Apelação Cível - Guariba - Apelante: João Paulo Moreira de Souza - Apelado: Município de Pradópolis - Apelação Cível Processo nº 1002315-26.2025.8.26.0222 Relator(a): MAGALHÃES COELHO Órgão Julgador: 1ª Câmara de Direito Público SESSÃO DE JULGAMENTO NA MODALIDADE VIRTUAL - RESOLUÇÃO CNJ 591/24 Data da pauta: 05/08/2026 às 09:30 Número da pauta: 169 Íntegra da pauta de julgamento: https://esaj.tjsp.jus.br/pauta-julgamento-virtual Torno público, nos termos da Resolução n.º 984/2025, que regulamenta o julgamento eletrônico no âmbito do Tribunal de Justiça do Estado de São Paulo, por meio do sistema SAJ e, em conformidade com a Resolução CNJ n.º 591/2024, que os presentes autos serão julgados eletronicamente em sessão virtual. Eventuais pedidos de DESTAQUE (oposição ao julgamento virtual), deverão ser feitos, por meio eletrônico, no portal do ESAJ (https://esaj.tjsp.jus.br/pauta-julgamento-virtual) (Selecione o Órgão julgador e em seguida a data da sessão virtual e clique em \"consultar\"> localize o processo na pauta e clique em \"acompanhar julgamento\"> na parte inferior estará habilitado o pedido de \"destaque\" e \"esclarecimento\"), até 48 (quarenta e oito) horas antes do início da sessão e deferido pelo(a) Relator(a). NOTA: DESTAQUES DEFERIDOS NÃO DISPENSAM AS PARTES DE REALIZAR INSCRIÇÃO PARA PREFERÊNCIA SIMPLES OU SUSTENTAÇÃO ORAL, PERMANECENDO OBRIGATÓRIA A REALIZAÇÃO DE INSCRIÇÃO PELAS PARTES NA SESSÃO QUE VIER A SER DESIGNADA. Nas hipóteses de cabimento de SUSTENTAÇÃO ORAL, é facultado o seu envio por meio eletrônico, no próprio processo, não sendo aceito outro meio, após a publicação da pauta e até 48 (quarenta e oito) horas antes de iniciado o julgamento em ambiente virtual, conforme manual de peticionamento no site: https://www.tjsp.jus.br/Download/PeticionamentoEletronico/Manual_PETIC_ELETRONICO_SAJSG_Julg_Virtual.Pdf MEMORIAIS deverão ser encaminhados, exclusivamente, para os e-mails institucionais dos gabinetes disponíveis em: https://www.tjsp.jus.br/CanaisComunicacao/Emails"},{"id":678195036,"data":"2026-07-24","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1000185-68.2022.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"REDE CONTMAX – CONTABILIDADE E CONSULTORIA","polo":"A"}],"advogados":[{"nome":"MATHEUS VALERIO DE MELO DIAS","oab":"SP/266809"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000185-68.2022.8.26.0222 - Procedimento Comum Cível - Apuração de haveres - Rede Contmax – Contabilidade e Consultoria - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Diante da inércia do perito, determino que se realize tentativa de contato por telefone, certificando-se nos autos. Intime-se. - ADV: MATHEUS VALERIO DE MELO DIAS (OAB 266809/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":678195043,"data":"2026-07-24","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1000185-05.2021.8.26.0222","classe":"EMBARGOS à EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ALDAIR CANDIDO DE SOUZA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1000185-05.2021.8.26.0222 - Embargos à Execução Fiscal - DIREITO PROCESSUAL CIVIL E DO TRABALHO - Liquidação / Cumprimento / Execução - Efeito Suspensivo / Impugnação / Embargos à Execução - Aldair Candido de Souza - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Cumpra-se o v. Acórdão. Traslade-se cópia do v. Acórdão e da certidão de trânsito em julgado aos autos da execução fiscal nº 1502209-80.2020.8.26.0222. Requeiram as partes o que de direito, no prazo de 15 dias. Intime-se o ente público pelo portal eletrônico. Cumpra a z. serventia o artigo 1.098 das NSCGJ, certificando-se e arquivem-se os autos, lançando-se a movimentação pertinente no sistema SAJ. Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG), LAIZA SOARES DONATO (OAB 130719/MG), ALDAIR CANDIDO DE SOUZA (OAB 201321/SP)"},{"id":675865591,"data":"2026-07-23","tribunal":"TRT15","orgao":"1ª Vara do Trabalho de Jaboticabal","numero":"0010854-16.2026.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Lista de distribuição","documento":"Distribuição","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/visualizacao/26072200300714300000301246820?instancia=1","partes":[{"nome":"CARLOS ALBERTO VICTORELLI BITELA","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"}],"texto":"Processo 0010854-16.2026.5.15.0029 distribuído para 1ª Vara do Trabalho de Jaboticabal na data 21/07/2026 \n Para maiores informações, clique no link a seguir: https://pje.trt15.jus.br/pjekz/visualizacao/26072200300714300000301246820?instancia=1"},{"id":675930610,"data":"2026-07-23","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1000109-05.2026.8.26.0222","classe":"PETIçãO CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"TALITA FRANKLIN SAMPAIO DE SOUZA","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"}],"texto":"Processo 1000109-05.2026.8.26.0222 - Petição Cível - Apuração de haveres - Talita Franklin Sampaio de Souza - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Ante o exposto, na forma do art. 487, inciso I, do Código de Processo Civil, julgo PROCEDENTE a pretensão formulada por TALITA FRANKLIN SAMPAIO DE SOUZA em face do MUNICÍPIO DE PRADÓPOLIS, para o fim de: a) DECLARAR o direito da autora ao recebimento da carga suplementar de trabalho docente na forma do art. 33 da Lei Complementar Municipal nº 83/2001 e DETERMINAR o seu apostilamento; b) CONDENAR o réu ao pagamento das diferenças vencidas até o apostilamento da obrigação de fazer, com reflexos em 13º sa-lário, férias + 1/3, FGTS e demais verbas salariais, observada a prescrição quinquenal. A correção monetária tem como termo inicial a competência em que a verba deveria ter sido paga. Já os juros, que pressupõem a existência de mora, fluem a partir da citação. Na hipótese dos autos, considerando que a citação é posterior à EC 113/2021 (art. 3º), até a citação deverá ser aplicado como índice de correção monetária o IPCA-E; após a citação, aplica-se exclusivamente a taxa SELIC. Com o advento da EC 136/2025, que alterou a EC 113/2021 (art. 3º), a partir de10.09.2025 voltam a ser aplicáveis os Temas 810/STF e 905/STJ. Assim, a taxa SELIC incide desde a citação até 09.09.2025; a partir de 10.09.2025, aplicam-se o IPCA-E e juros de mora que remuneram as cadernetas de poupança. Reconheço a natureza alimentar dos valores devidos. Sem custas ou honorários, eis que indevidos. Em caso de interposição de recurso Inominado ao Colégio Recursal, ressalvada a hipótese de concessão de gratuidade da Justiça, o preparo corresponderá: a) à taxa judiciária de ingresso, no importe de 1,5% sobre o valor atualizado da causa, observado o valor mínimo de 5(cinco) UFESPs, a ser recolhida na guia DARE; b) à taxa judiciária referente às custas de preparo, no importe de 4% sobre o valor fixado na sentença, se líquido, ou sobre o valor fixado equitativamente pelo MM. Juiz de Direito, se ilíquido ou ainda 4% sobre o valor atualizado atribuído à causa na ausência de pedido condenatório, a ser recolhida na guia DARE; c) às despesas processuais referente"},{"id":675930617,"data":"2026-07-23","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1000251-09.2026.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"RONILSON RODRIGUES RAMOS","polo":"A"}],"advogados":[{"nome":"CARLOS HENRIQUE VIEIRA","oab":"MG/106377"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000251-09.2026.8.26.0222 - Procedimento do Juizado Especial da Fazenda Pública - Sistema Remuneratório e Benefícios - Ronilson Rodrigues Ramos - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Ante o exposto, JULGO IMPROCEDENTES os pedidos formulados por RONILSON RODRIGUES RAMOS em face do MUNICÍPIO DE PRADÓPOLIS e, declaro extinto o processo, com resolução de mérito, nos termosdoart. 487, I,doCódigo de Processo Civil. Sem custas ou honorários advocatícios (art. 55, primeira parte da Lei nº 9.099/95). Ficam as partes intimadas que o prazo para interpor eventual recurso é de 10 (dez) dias contados da intimação desta decisão, conforme dispõe o artigo 42 da Lei 9099/95. Conforme Comunicado Conjunto n° 373/2023, no sistema dos Juizados Especiais, em caso de interposiçãodoRecurso Inominado, deverá ser elaborada certidão antes da remessa dos autos ao Colégio Recursal. Ressalvada a hipótese de concessão de gratuidade da justiça, o preparo corresponderá: a) à taxa judiciária de ingresso, no importe de 1,5%sobreovaloratualizado da causa, observado ovalormínimo de 5 UFESPs,a ser recolhida na guia DARE;quando não se tratar de execução de título extrajudicial ou 2% (dois por cento)sobreovaloratualizado da causa, por meio de DARE, observado ovalormínimo de 5 UFESP, quando se tratar de execução de título extrajudicial; b) à taxa judiciária referente às custas de preparo, no importe de 4%sobreovalorfixado na sentença, se líquido, ousobreovalorfixado equitativamente pelo pelo magistrado, se ilíquido, ou ainda 4% (quatro por cento)sobreovaloratualizado atribuído à causa na ausência de pedido condenatório, por meio de DARE, observado ovalormínimo de 5 UFESPs; c) às despesas processuais referentes a todos os serviços forenses eventualmente utilizados (despesas postais, diligênciasdoOficial de Justiça, taxas para pesquisas de endereço nos sistemas conveniados, custas para publicação de editais etc.),a serem recolhidas na guia FEDTJ,à exceção das diligências de Oficial de Justiça, que deverão ser colhidas na guiaGRD. P.I. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CARLOS HENRIQUE VIEIRA (OAB 106377/MG)"},{"id":674858391,"data":"2026-07-22","tribunal":"TST","orgao":"Vice-Presidência","numero":"0010035-84.2023.5.15.0029","classe":"AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.tst.jus.br/pjekz/validacao/26072111220715900000191569580?instancia=3","partes":[{"nome":"JOSIANE FERNANDA SATIM","polo":"P"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"}],"advogados":[{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"},{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL SUPERIOR DO TRABALHO VICE-PRESIDÊNCIA Relator: GUILHERME AUGUSTO CAPUTO BASTOS RE AIRR 0010035-84.2023.5.15.0029 RECORRENTE: MUNICIPIO DE PRADOPOLIS RECORRIDO: JOSIANE FERNANDA SATIM INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Despacho ID 86d634f proferido nos autos. Poder Judiciário Justiça do Trabalho Tribunal Superior do Trabalho RECORRENTE : MUNICIPIO DE PRADOPOLIS ADVOGADO : Dr. ADHEMAR RONQUIM FILHO ADVOGADO : Dr. ADEMILSON PEREIRA RIBEIRO RECORRIDO : JOSIANE FERNANDA SATIM ADVOGADO : Dr. DANIEL DE SOUZA SILVA CUSTOS LEGIS: MINISTÉRIO PÚBLICO DO TRABALHO GVPCB/amc/jco D E S P A C H O Trata-se de agravo em recurso extraordinário direcionado ao excelso Supremo Tribunal Federal, interposto com fulcro no artigo 1.042 do CPC, em face de decisão de natureza híbrida proferida por esta Vice-Presidência, em que se denegou seguimento ao recurso extraordinário. No tocante ao capítulo em que se discute “férias anuais de 45 dias”, decidiu-se pela aplicação do Tema 181 da Tabela de Repercussão Geral, e quanto aos capítulos “incompetência da Justiça do Trabalho”, “violação da ordem e de princípio constitucionais” e “competência privativa da União”, reconheceu-se a incidência do entendimento consolidado nas Súmulas nos 282 e 356 da excelsa Corte. Por fim, quanto à indicação de afronta ao princípio da legalidade, foi invocado o Tema 660 da Tabela de Repercussão Geral Considerando que a Parte impugna a fundamentação exarada em sede de juízo de admissibilidade clássico, recebo o presente agravo e determino o seu processamento nos termos do mencionado artigo 1.042 do CPC. Desse modo, fica a parte agravada intimada para apresentar contraminuta, de acordo com o preceito contido no § 3º do artigo 1.042 do CPC, a contar da data da publicação do presente despacho. Após as providências cabíveis, os autos deverão ser remetidos ao excelso Supremo Tribunal Federal, com as homenagens de estilo. Publique-se. Brasília, 20 de julho de 2026. GUILHERME AUGUSTO CAPUTO BASTOS Ministro Vice-Presidente do TST\n\nIntimado(s) / Citado(s)\n - JOSIANE FERNANDA SATIM"},{"id":675036744,"data":"2026-07-22","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010653-42.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072113211987400000301167142?instancia=1","partes":[{"nome":"LUCELMA ROSA DE OLIVEIRA","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"EVERTON LUIZ DOS REIS FRANCISCO","oab":"SP/462676"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010653-42.2026.5.15.0120 AUTOR: LUCELMA ROSA DE OLIVEIRA RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 4cbbbcd proferido nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL DESPACHO Trata-se de processo em que uma das partes é ente público elencado na Recomendação GP-CR 01/2014 (UNIÃO, ESTADOS. MUNICIPIOS, AUTARQUIAS E FUNDAÇÕES). Considerando-se que,  conforme justifica a norma citada, trata-se de processo com remota possibilidade de conciliação à vista da indisponibilidade e irrenunciabilidade do patrimônio público; que ao Juízo cabe zelar pela razoável duração do processo; e ainda que,  a requerimento das partes poderá ser designada audiência posteriormente; DECIDO: Intimem-se as partes para que observem o seguinte CALENDÁRIO PROCESSUAL: Desde já a(s) reclamada(s) fica(m) ciente(s) e citada(s) de que deve(m) apresentar sua CONTESTAÇÃO e documentos, sem atribuição de sigilo, no Processo Judicial Eletrônico (PJe), no prazo até 11/09/2026, sob pena de se considerar verdadeiros os fatos alegados na inicial. No mesmo prazo, deverá dizer se pretende a produção de prova oral, apontando-as e justificando-as, sob pena de indeferimento, observando-se que o silêncio será interpretado como falta de pretensão probatória; Em seguida, o(a) reclamante desde já sai intimado de que poderá apresentar sua RÉPLICA, de 14/09/2026 a 18/09/2026, com apontamento, por amostragem, de eventuais diferenças com base nos documentos juntados, se for o caso, sob pena de preclusão, bem como dizer se pretende produzir outras provas, apontando-as e justificando-as, sob pena de indeferimento, observando-se que o silêncio será interpretado como falta de pretensão probatória; No  silêncio  de  ambas  as  partes  quanto  à  necessidade  de produção de prova oral, estará encerrada a instrução processual, saindo as partes intimadas  de  que,   querendo, poderão no  prazo  comum  de 21/09/2026 a 25/09/2026 apresentar razões finais, tornando-se em seguida os autos conclusos para julgamento, do qual as partes serão intimadas pelo Di"},{"id":675151610,"data":"2026-07-22","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010696-76.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072114080544500000301175855?instancia=1","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"ROSANA MARIA PERLATTO","polo":"A"}],"advogados":[{"nome":"BRUNO LUIZ BORGES PINHEIRO","oab":"SP/543738"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010696-76.2026.5.15.0120 AUTOR: ROSANA MARIA PERLATTO RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID 3d4850c proferido nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL DESPACHO Trata-se de processo em que uma das partes é ente público elencado na Recomendação GP-CR 01/2014 (UNIÃO, ESTADOS. MUNICIPIOS, AUTARQUIAS E FUNDAÇÕES). Considerando-se que,  conforme justifica a norma citada, trata-se de processo com remota possibilidade de conciliação à vista da indisponibilidade e irrenunciabilidade do patrimônio público; que ao Juízo cabe zelar pela razoável duração do processo; e ainda que,  a requerimento das partes poderá ser designada audiência posteriormente; DECIDO: Intimem-se as partes para que observem o seguinte CALENDÁRIO PROCESSUAL: Desde já a(s) reclamada(s) fica(m) ciente(s) e citada(s) de que deve(m) apresentar sua CONTESTAÇÃO e documentos, sem atribuição de sigilo, no Processo Judicial Eletrônico (PJe), no prazo até 11/09/2026, sob pena de se considerar verdadeiros os fatos alegados na inicial. No mesmo prazo, deverá dizer se pretende a produção de prova oral, apontando-as e justificando-as, sob pena de indeferimento, observando-se que o silêncio será interpretado como falta de pretensão probatória; Em seguida, o(a) reclamante desde já sai intimado de que poderá apresentar sua RÉPLICA, de 14/09/2026 a 18/09/2026, com apontamento, por amostragem, de eventuais diferenças com base nos documentos juntados, se for o caso, sob pena de preclusão, bem como dizer se pretende produzir outras provas, apontando-as e justificando-as, sob pena de indeferimento, observando-se que o silêncio será interpretado como falta de pretensão probatória; No  silêncio  de  ambas  as  partes  quanto  à  necessidade  de produção de prova oral, estará encerrada a instrução processual, saindo as partes intimadas  de  que,   querendo, poderão no  prazo  comum  de 21/09/2026 a 25/09/2026 apresentar razões finais, tornando-se em seguida os autos conclusos para julgamento, do qual as partes serão intimadas pelo Diári"},{"id":674741178,"data":"2026-07-22","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1000013-87.2026.8.26.0222","classe":"AçãO POPULAR","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"LA EQUIPAMENTOS INDUSTRIAIS EIRELI","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"SILVIO MARTINS","polo":"P"}],"advogados":[{"nome":"SAULO EMANUEL ATIQUE","oab":"SP/218159"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"MARIA CLAUDIA SACO DUARTE","oab":"SP/479017"}],"texto":"Processo 1000013-87.2026.8.26.0222 - Ação Popular - Contratos Administrativos - Clovis Bronzati - Silvio Martins - - La Equipamentos Industriais Eireli - - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Ante o exposto: 1. REJEITO as preliminares de impugnação à gratuidade, de inépcia da inicial e de ilegitimidade passiva do corréu Sílvio Martins, suscitadas na contestação de fls. 361/378, ressalva-da, quanto à de gratuidade, que não houve propriamente concessão da benesse ao autor, mas que a ação tramita com isenção de custas e despesas, nos termos da lei específica de regência; 2. CONDICIONO o exame do pedido de gratuidade formulado pelo corréu Sílvio Martins à comprovação documental de sua hipossuficiência, intimando-se-o para, no prazo de 15 (quinze) dias, juntar a última declaração de imposto de renda, acompanhada da declaração de bens, sob pena de indeferimento. 3. RECONHEÇO a tempestividade da contestação de fls. 443/488. 4. AFASTO a alegação de prescrição, nos termos da fundamentação; 5. MANTENHO o indeferimento da tutela de urgência, por ausência de fato novo, ressalvado o reexame após a produção da prova pericial (art. 296 do CPC). 6. DEFIRO a habilitação dos advogados Gilberto Fagundes de Oliveira (OAB/SP 325.606) e Viviane Cristina Bronzati (OAB/SP 444.669), inseridos no sistema SAJ nesta data. Não houve prejuízo quanto às intimações anteriores, razão pela qual deixo de reco-nhecer nulidades, nos termos da fundamentação. 7. REQUISITO ao Município de Pradópolis, por sua Procuradoria, no prazo de 15 (quinze) dias, a apresentação integral do Processo Administrativo nº 175/2022, do Pregão Presencial nº 69/2022 e da Ata de Registro de Preços nº 01/2023, com o termo de referência e respectivas justificativas técnicas, o parecer jurídico, as pesquisas e cotações de preços, as notas de empenho e fiscais e os comprovantes de pagamento, as atas de deliberação do Conselho Municipal de Educação pertinentes ao objeto, os documentos de entrega técnica, treinamento e garantia, os catálogos e as certificações do produto, bem como os registros de controle de entrada e saída do almoxarifado relativos às setenta telas (itens c.1 a c.10 de fls. 40/41). Fica intimada por meio da pr"},{"id":674741189,"data":"2026-07-22","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000470-39.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ALDAIR CANDIDO DE SOUZA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"}],"texto":"Processo 0000470-39.2026.8.26.0222 (processo principal 1000475-20.2021.8.26.0222) - Cumprimento de sentença - Defeito, nulidade ou anulação - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Aldair Candido de Souza - Vistos. Na forma do artigo 513, § 2º, do CPC, intime(m)-se a(s) parte(s) executada(s) pelo DJEN para que, no prazo de 15 (quinze) dias, pague(m) o valor indicado no demonstrativo discriminado e atualizado do crédito, bem como recolha(m) as custas, conforme segue (Comunicado Conjunto nº 951/2023): Taxa Judiciária: R$ 192,10 (2% sobre o valor da causa - guia DARE, código 230-6). Fica(m) a(s) parte(s) executada(s) advertida(s) de que, transcorrido o prazo previsto no artigo 523 do CPC sem o pagamento voluntário, inicia-se o prazo de 15 (quinze) dias para que, independentemente de penhora ou nova intimação, apresente(m), nos próprios autos, sua impugnação. Não ocorrendo pagamento voluntário no prazo do artigo 523 do CPC, o débito será acrescido de multa de dez por cento e, também, de honorários de advogado de dez por cento. Ademais, não efetuado o pagamento voluntário no prazo de 15 (quinze) dias, independentemente de nova intimação do credor, poderá a parte exequente efetuar pedido de pesquisas junto aos sistemas informatizados à disposição do juízo, devendo comprovar o prévio recolhimento das taxas previstas no artigo 2º, inciso XI, da Lei Estadual nº 14.838/12, calculadas por cada diligência a ser efetuada. Por fim, certificado o trânsito em julgado da decisão e transcorrido o prazo do artigo 523 do CPC, mediante o recolhimento das respectivas taxas, a parte exequente poderá requerer diretamente à serventia a expedição de certidão, nos termos do artigo 517 do CPC, que servirá também aos fins previstos no artigo 782, § 3º, do Código de Processo Civil. Intime-se o ente público pelo portal eletrônico. Intime-se. - ADV: ALDAIR CANDIDO DE SOUZA (OAB 201321/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":675466867,"data":"2026-07-22","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1000365-45.2026.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"IZABEL CRISTINA DE AGUIAR","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CASSIA JORGE DE MORAES","oab":"SP/407536"}],"texto":"Processo 1000365-45.2026.8.26.0222 - Procedimento Comum Cível - Internação compulsória - Izabel Cristina de Aguiar - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - Vistos. Trata-se de ação de obrigação de fazer ajuizada por I. C. A. em face do Município de Pradópolis e da Fazenda Pública do Estado de São Paulo, objetivando a internação psiquiátrica compulsória de R. J. A. B.. A tutela de urgência foi deferida às fls. 42/44, determinando aos requeridos a disponibilização de vaga para internação involuntária do paciente, em entidade pública ou, na sua ausência, particular custeada pelo Poder Público. Sobreveio aos autos ofício encaminhado pelo Município de Pradópolis, acompanhado de documento subscrito pelo paciente e por sua genitora, informando opção pelo tratamento extra-hospitalar e pela não continuidade da internação compulsória (fls. 72/75). Em razão de tais informações, foi determinada a manifestação da autora acerca do interesse no prosseguimento da demanda, diante da possível perda superveniente do objeto (fl. 94). Às fls. 96/97, a autora sustentou a nulidade do referido documento, alegando vício de consentimento, afirmando que não compreendeu seu conteúdo e que jamais pretendeu desistir da medida judicial anteriormente deferida. Alegou, ainda, que R. não possui capacidade de autodeterminação para manifestar concordância válida a respeito da necessidade de internação que constitui justamente o objeto da presente demanda. O Ministério Público manifestou-se às fls. 109/110 pelo prosseguimento do feito e pela efetivação da decisão de fls. 42/44, ressaltando que o relatório médico juntado aos autos aponta a imprescindibilidade da internação e que não restou demonstrada desistência válida da medida pleiteada. Posteriormente, foram apresentadas contestações pelos requeridos e réplica pela autora, ocasião em que esta reiterou o pedido inicial, refutou os argumentos defensivos e informou a ocorrência de novos episódios de descompensação psiquiátrica e agressividade do paciente, juntando novos elementos destinados a corroborar a necessidade da medida postulada. Decido. Não verifico, ao menos por ora, fundamento idôneo para afastar ou tornar sem efeito a tutela provi"},{"id":675713804,"data":"2026-07-22","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000717-20.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"GINA ELISA SANTIN FUNICHELI EMPREENDIMENTOS IMOBILIáRIOS","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"JOSE ANTONIO FUNNICHELI","oab":"SP/79077"},{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 0000717-20.2026.8.26.0222 (processo principal 1002231-64.2021.8.26.0222) - Cumprimento de sentença - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Gina Elisa Santin Funicheli Empreendimentos Imobiliários - Vistos. Na forma do artigo 513, § 2º, do CPC, intime(m)-se a(s) parte(s) executada(s) pelo DJEN para que, no prazo de 15 (quinze) dias, pague(m) o valor indicado no demonstrativo discriminado e atualizado do crédito, bem como recolha(m) as custas, conforme segue (Comunicado Conjunto nº 951/2023): Taxa Judiciária: R$ 192,10 (2% sobre o valor da causa - guia DARE, código 230-6), que deverá ser devidamente atualizada até a data do efetivo recolhimento. Fica(m) a(s) parte(s) executada(s) advertida(s) de que, transcorrido o prazo previsto no artigo 523 do CPC sem o pagamento voluntário, inicia-se o prazo de 15 (quinze) dias para que, independentemente de penhora ou nova intimação, apresente(m), nos próprios autos, sua impugnação. Não ocorrendo pagamento voluntário no prazo do artigo 523 do CPC, o débito será acrescido de multa de dez por cento e, também, de honorários de advogado de dez por cento. Ademais, não efetuado o pagamento voluntário no prazo de 15 (quinze) dias, independentemente de nova intimação do credor, poderá a parte exequente efetuar pedido de pesquisas junto aos sistemas informatizados à disposição do juízo, devendo comprovar o prévio recolhimento das taxas previstas no artigo 2º, inciso XI, da Lei Estadual nº 14.838/12, calculadas por cada diligência a ser efetuada. Por fim, certificado o trânsito em julgado da decisão e transcorrido o prazo do artigo 523 do CPC, mediante o recolhimento das respectivas taxas, a parte exequente poderá requerer diretamente à serventia a expedição de certidão, nos termos do artigo 517 do CPC, que servirá também aos fins previstos no artigo 782, § 3º, do Código de Processo Civil. Intime-se a Fazenda Pública pelo portal eletrônico. Intime-se. - ADV: JOSE ANTONIO FUNNICHELI (OAB 79077/SP), LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":673634013,"data":"2026-07-21","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010817-86.2026.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072012401093400000301006298?instancia=1","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"VERAIRES AZEVEDO DE SOUZA","polo":"A"}],"advogados":[{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA PROCESSO: ATOrd 0010817-86.2026.5.15.0029 AUTOR: VERAIRES AZEVEDO DE SOUZA RÉU: MUNICIPIO DE PRADOPOLIS Órgão Julgador de Origem: 1ª VARA DO TRABALHO DE JABOTICABAL Prioridade(s): Idoso   NOTIFICAÇÃO AUDIÊNCIA INICIAL TELEPRESENCIAL DESTINATÁRIO: VERAIRES AZEVEDO DE SOUZA ENDEREÇO: Expediente enviado por outro meio Pela presente, fica V. Sa. notificado(a) a comparecer à audiência  INICIAL designada para 25/11/2026 14:40 horas. A audiência será realizada telepresencialmente pela plataforma Zoom, por meio do link:  https://zoom.us/j/3072626738 ID da reunião: 3072626738   Senha: 159753 Orientações sobre o uso da plataforma ZOOM podem ser obtidas no site-https://sites.google.com/trt15.jus.br/zoomadv/pagina-inicial . O acesso à audiência poderá ser efetivado pelo uso de smartphone ou computador pessoal com câmera. Nos termos do art. 844 da CLT, a ausência da parte autora implicará arquivamento do feito e o(s) réu(s) deverá(ão) comparecer pessoalmente (ou por preposto que tenha conhecimento dos fatos) e apresentar defesa até o horário da audiência, sob pena de revelia e confissão quanto à matéria de fato, presumindo-se verdadeiros os fatos alegados pela parte autora. Com a defesa, o(s) réu(s) deverá(ão) apresentar, no Processo Judicial Eletrônico (PJe), em formato PDF, documentos pessoais, instrumento constitutivo (contrato social), se pessoa jurídica, e documentos que pretende utilizar como prova. Para conhecimento do pedido, o(s) réu(s) deverão acessar a petição inicial pela página eletrônica (https://pje.trt15.jus.br/pjekz/validacao), digitando a(s) chave(s): 26071319103685100000300324088 As partes não precisam levar testemunhas nesta audiência. A comunicação da designação direta à parte deve ser feita por seu respectivo patrono. .\n\nIntimado(s) / Citado(s)\n - VERAIRES AZEVEDO DE SOUZA"},{"id":674102553,"data":"2026-07-21","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010208-40.2025.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072016563790500000301060120?instancia=1","partes":[{"nome":"MARIA REGINA FONARI MOURA","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"VIVIANI APARECIDA ARAUJO CARVALHO","polo":"A"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA ATOrd 0010208-40.2025.5.15.0029 AUTOR: VIVIANI APARECIDA ARAUJO CARVALHO RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID 4bf0a1a proferida nos autos. Órgão Julgador de Origem: 1ª VARA DO TRABALHO DE JABOTICABAL DECISÃO Ante a expressa concordância das partes, HOMOLOGO o laudo pericial de Id 685e7c9, o qual se encontra atualizado na planilha de Id 43cfac7,  por considerá-lo em conformidade com a sentença e para que produzam jurídicos efeitos. Os honorários periciais contábeis, que neste ato arbitro no importe de R$ 1.300,00, em favor da perita MARIA REGINA FONARI MOURA, CPF: 048.175.818-67, a cargo da reclamada, cujo valor deverá ser acrescido ao montante da condenação. As contribuições previdenciárias já se encontram deduzidas do crédito da autora. O FGTS deverá ser depositado na conta vinculada da autora, nos termos do artigo 26, parágrafo único, da Lei n. 8.036/1990 e do Precedente Vinculante firmado pelo Eg. TST no IRR 68, na sessão realizada no dia 24/2/2025, no julgamento do RRAg n. 000003-65.2023.5.05.020, com comprovação no processo em até 30 dias. As contribuições previdenciárias deverão ser recolhidas em guia própria (DARF, código 6092), com comprovação no processo, no prazo de 30 dias (Recomendação COMUNICADO CR Nº 08/2023 e art. 889-A da CLT). Atente a reclamada que deverá preencher o documento por meio da DCTFWeb, após serem indicados os dados da reclamação trabalhista no eSocial. Para mais informações, deverá ser consultado o Manual de Orientação da Receita Federal.  Custas processuais isentas, nos termos do artigo 790-A, I, da CLT. Não há imposto de renda a ser retido do crédito da autora, uma vez que as verbas tributáveis, no importe de R$ 2.022,07- nº de meses: 28, ficam abaixo do limite de isenção, conforme previsto na Instrução Normativa RFB 1.500/2014. Desnecessária a intimação da União-PGF-PSF, ante os termos da Portaria Normativa PGF/AGU Nº 47, DE 7 DE JULHO DE 2023. A reclamante indicou conta bancária para liberação de seu crédito na petição de Id 4883c6b. Será de responsabilidade da exequente infor"},{"id":674313021,"data":"2026-07-21","tribunal":"TRT15","orgao":"4ª Câmara","numero":"0011173-36.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072018333988700000154891491?in 13.467/2017). Acesso ao sistema PJe- JT - 2º grau: http://pje.trt15.jus.br/consultaprocessual.  CAMPINAS/SP, 20 de julho de 2026. VANIA DE CASSIA PEDROSO BRUNETTI Diretor de Secretaria\n\nIntimado(s) / Citado(s)\n - JORGE ALVES DE VASCONCELOS"},{"id":673814576,"data":"2026-07-21","tribunal":"TJSP","orgao":"Distribuição de Direito Público, Câm. Espec. e Meio Amb. - Rua dos Sorocabanos, 608 - Sala 02 - Ipiranga","numero":"0001285-07.2024.8.26.0222","classe":"APELAçãO CíVEL","tipo":"Intimação","documento":"Distribuídos","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANA PAULA APARECIDA SILVA DE PAULA","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"PAULO CESAR MARCOLINO","oab":"SP/128165"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"PROCESSOS DISTRIBUÍDOS EM 20/07/2026\r\n\r\n0001285-07.2024.8.26.0222; Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011; Apelação Cível; 2ª Câmara de Direito Público; CLAUDIO AUGUSTO PEDRASSI; Foro de Guariba; 1ª Vara Judicial; Procedimento Comum Cível; 0001285-07.2024.8.26.0222; Admissão / Permanência / Despedida; Apte/Apdo: Município de Pradópolis; Advogado: Wesley Luiz Alves de Paula (OAB: 274238/SP) (Procurador); Apdo/Apte: Ana Paula Aparecida Silva de Paula; Advogado: Paulo Cesar Marcolino (OAB: 128165/SP);"},{"id":674408151,"data":"2026-07-21","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1000259-20.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE GUARIBA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"VALéRIA COSTA SIVA","polo":"A"},{"nome":"VITOR HUGO SILVA GIMENEZ","polo":"A"}],"advogados":[{"nome":"JULIANA NEVES ESPOSTO PARO","oab":"SP/158882"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CAROLINA RANGEL SEGNINI KOMEATHY","oab":"SP/280200"}],"texto":"Processo 1000259-20.2025.8.26.0222 - Procedimento Comum Cível - Indenização por Dano Moral - Valéria Costa Siva - - Vitor Hugo Silva Gimenez - PREFEITURA MUNICIPAL DE PRADÓPOLIS - - PREFEITURA MUNICIPAL DE GUARIBA - Vistos. Fls. 336-337: não há como ser acolhido o requerimento da perita, haja vista que, a teor da decisão de fls. 303-312 (especificamente fl. 311), tratando-se de perícia deferida a pedido e no interesse de parte beneficiária da gratuidade de justiça, devem ser observados os limites estabele-cidos na Resolução 910, de 2023, do Colendo Órgão Especial do Tribunal de Justiça de São Paulo. O valor de 34 UFESP's, portanto, foi estabelecido no máximo admitido. Intime-se a perita para que aceite definitivamente o encargo. Nesse caso, deverá ser cumprido, no que couber, o que restar da decisão anterior. Se for o caso de destituição, tornem conclusos para anotações necessárias e nomea-ção de novo profissional. Intime-se. Guariba, 20 de julho de 2026. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CAROLINA RANGEL SEGNINI KOMEATHY (OAB 280200/SP), JULIANA NEVES ESPOSTO PARO (OAB 158882/SP), JULIANA NEVES ESPOSTO PARO (OAB 158882/SP)"},{"id":671956014,"data":"2026-07-20","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010988-58.2017.5.15.0029","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26071712154852100000300759652?instancia=1","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"PEDRO SERGIO CARNIEL GIOVANNETTI","polo":"A"},{"nome":"UNIÃO FEDERAL (PGF)","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"SP/394178"},{"nome":"CAROLINE COLMANETTI SILVA","oab":"SP/348818"},{"nome":"PAULO SERGIO MOREIRA DA SILVA","oab":"SP/165937"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA ATOrd 0010988-58.2017.5.15.0029 AUTOR: PEDRO SERGIO CARNIEL GIOVANNETTI RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Sentença ID cac8fdf proferida nos autos, cujo dispositivo consta a seguir: Tempestivos. Conheço. D E C I D E - S E Considerando que não houve contradição, omissão ou obscuridade na decisão atacada, inviável, portanto, o inconformismo da embargante. Na verdade, o embargante pretende reexaminar a matéria, o que é vedado, neste momento processual. Este remédio jurídico utilizado tem finalidade estrita, nos termos do artigo 1022, do CPC, e não serve para solucionar pretensão que insinue erro de julgamento ou para reformar a sentença. Os embargos de declaração se configuram como instrumento de aperfeiçoamento da prestação jurisdicional, e não de reforma da sentença, principalmente quando o Embargante não demonstra claramente que o seu recurso preenche os pressupostos para a sua apreciação. O remédio adequado é outro. Assim, mantêm-se os termos da sentença, neste particular. Consideram-se os fatos alegados nos embargos de declaração como pré-questionados.  ISTO POSTO, decido CONHECER dos EMBARGOS DE DECLARAÇÃO interpostos pela parte RECLAMADA e, NO MÉRITO, julgá-los IMPROCEDENTES, nos termos da fundamentação retro expendida.   Intimem-se. Nada mais. ANDREA MARIA PFRIMER FALCAO Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - PEDRO SERGIO CARNIEL GIOVANNETTI"},{"id":672665805,"data":"2026-07-20","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010785-02.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26071718375044600000300825952?instancia=1","partes":[{"nome":"CRISTIANE APARECIDA ALVES MARCARI","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"JOAO RENAN CASSORIELO COUTI","oab":"SP/360274"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010785-02.2026.5.15.0120 AUTOR: CRISTIANE APARECIDA ALVES MARCARI RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID 06ecbc2 proferida nos autos. DECISÃO Vistos. A reclamante postula a concessão de tutela de urgência visando seja o reclamado compelido a promover o afastamento de atividades com repetitividade intensa, pinça/preensão contínua, força manual, elevação sustentada de membros superiores, apoio/transporte manual de crianças e tarefas incompatíveis com o laudo médico. Decido. A autora não trouxe elemento para a formação de juízo de urgência. Porquanto a probabilidade do direito invocado é alinhavada com a desnecessidade de dilação probatória. No caso em questão, vê-se que a causa de pedir lastreia-se em limitação funcional decorrente de doença ocupacional, cuja consequente eventual alteração de atividades laborais não prescinde de prova técnica (perícia médica neste Juízo), sob o crivo do contraditório. Sendo assim, indefere-se, por ora, o pedido de tutela de urgência. Designe-se audiência. ARARAQUARA/SP, 17 de julho de 2026. CARLOS ALBERTO FRIGIERI Juiz do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - CRISTIANE APARECIDA ALVES MARCARI"},{"id":671751560,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1000178-71.2025.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLAUDIO ALVES","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000178-71.2025.8.26.0222 - Procedimento do Juizado Especial da Fazenda Pública - Anulação de Débito Fiscal - Claudio Alves - PREFEITURA MUNICIPAL DE PRADÓPOLIS - O cumprimento de sentença foi instaurado. Arquive-se o processo de conhecimento, cadastrando o código 61615 conforme determina o Comunicado 1789/17 CG. Int. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), DANIEL DE SOUZA SILVA (OAB 297740/SP)"},{"id":671751588,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0001472-78.2025.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"LUZIA DE SOUZA BARROS SILVA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0001472-78.2025.8.26.0222 (processo principal 1003487-37.2024.8.26.0222) - Cumprimento de sentença - Pensão - Luzia de Souza Barros Silva - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Aguarde-se o pagamento do valor requisitado. Intime-se - ADV: GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP)"},{"id":671831141,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0000671-31.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLAUDIO ALVES","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0000671-31.2026.8.26.0222 (processo principal 1000178-71.2025.8.26.0222) - Cumprimento de sentença - Anulação de Débito Fiscal - Claudio Alves - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Apresentado o cálculo e intimada a se manifestar, a Fazenda Municipal concordou. Diante disso, homologo, para que produza seus legais e jurídicos efeitos, o cálculo de fl.4. Referido valor será o requisitado e sem qualquer acréscimo, sob pena de cancelamento do RPV. Ressalto que os descontos obrigatórios deverão ser informados nos incidentes, se o caso. Conforme Comunicado 394/2015, o processamento das requisições de Precatório e RPV somente serão admitidas no formato digital, tanto para processos físicos como digitais. Não há interesse recursal, de modo que a decisão transitou em julgado nesta data. Deve o Procurador providenciar o peticionamento eletrônico para requisição do RPV , através do portal E-Saj,\"petição intermediária\", \"requisição de pequeno valor\", categoria \"incidente processual\", ou se for o caso \"PRECATÓRIO\" com o devido preenchimento dos dados, anexando cópia do cálculo, nos moldes da Portaria 9622/2018 do TJSP., e Provimento CSM 2.753/2024: a requisição deverá ser instruida com as seguintes peças processuais-sentença ou acórdão, ou cópia do título executivo se o caso; certidão do trânsito em julgado da fase de conhecimento; decisão que homologou os cálculos; certidão do trânsito em julgado dos embargos a execução ou impugnação ou decurso do prazo para sua interposição;demonstrativo do cálculo, procuração ou substabelecimento, contrato de honorários, cópia do documento de identificação. Intimem-se. - ADV: DANIEL DE SOUZA SILVA (OAB 297740/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":672388869,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1000255-46.2026.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ADRIANA MARCIA BOTEGA DA ROCHA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CARLOS HENRIQUE VIEIRA","oab":"MG/106377"}],"texto":"Processo 1000255-46.2026.8.26.0222 - Procedimento do Juizado Especial da Fazenda Pública - Gratificações Municipais Específicas - Adriana Marcia Botega da Rocha - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Ante o exposto, JULGO IMPROCEDENTES os pedidos formulados por ADRIANA MÁRCIA BOTEGA em face do MUNICÍPIO DE PRADÓPOLIS, nos termosdoart. 487, I,doCódigo de Processo Civil. Sem custas ou honorários advocatícios, nos termos do art. 55, primeira parte da Lei nº 9.099/95. Ficam as partes intimadas que o prazo para interpor eventual recurso é de 10 (dez) dias contados da intimação desta decisão, conforme dispõe o artigo 42 da Lei 9099/95. Conforme Comunicado Conjunto n° 373/2023, no sistema dos Juizados Especiais, em caso de interposiçãodoRecurso Inominado, deverá ser elaborada certidão antes da remessa dos autos ao Colégio Recursal. Ressalvada a hipótese de concessão de gratuidade da justiça, o preparo corresponderá: a) à taxa judiciária de ingresso, no importe de 1,5%sobreovaloratualizado da causa, observado ovalormínimo de 5 UFESPs,a ser recolhida na guia DARE;quando não se tratar de execução de título extrajudicial ou 2% (dois por cento)sobreovaloratualizado da causa, por meio de DARE, observado ovalormínimo de 5 UFESP, quando se tratar de execução de título extrajudicial; b) à taxa judiciária referente às custas de preparo, no importe de 4%sobreovalorfixado na sentença, se líquido, ousobreovalorfixado equitativamente pelo pelo magistrado, se ilíquido, ou ainda 4% (quatro por cento)sobreovaloratualizado atribuído à causa na ausência de pedido condenatório, por meio de DARE, observado ovalormínimo de 5 UFESPs; c) às despesas processuais referentes a todos os serviços forenses eventualmente utilizados (despesas postais, diligênciasdoOficial de Justiça, taxas para pesquisas de endereço nos sistemas conveniados, custas para publicação de editais etc.),a serem recolhidas na guia FEDTJ,à exceção das diligências de Oficial de Justiça, que deverão ser colhidas na guiaGRD. O preparo será recolhido de acordo com os critérios acima estabelecidos independente de cálculo elaboradopelaserventia que apenas será responsávelpelaconferência dos valores e elaboração da certidão para ju"},{"id":672389707,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000708-58.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANTôNIO ALEXANDRE MAGNUSSON","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Processo 0000708-58.2026.8.26.0222 (processo principal 0000787-08.2024.8.26.0222) - Cumprimento de sentença - Jornada de Trabalho - Antônio Alexandre Magnusson - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. 1. A interpretação sistemática da Lei Estadual nº 11.608/03 evidencia que, sendo o ente público isento da taxa judiciária, não se justifica exigir recolhimento antecipado pela parte exequente não beneficiária da justiça gratuita, pois isso acarretaria ressarcimento posterior incompatível com a lógica da sucumbência e com a própria isenção legal. Assim, é descabida a exigência de recolhimento na fase de execução. Contudo, indefiro o pedido de manutenção da gratuidade de justiça do exequente, uma vez que indeferido também na fase de conhecimento (fls. 1086/1087 daqueles autos) e não foram apresentados documentos comprobatórios de alteração da situação financeira da parte. 2. Considerando a natureza ilíquida do título judicial transitado em julgado e a majoração fixada no v. Acórdão, arbitro os honorários advocatícios no importe de 15% sobre a soma das parcelas devidas até a prolação da sentença, em observância à Súmula 111 do Colendo Superior Tribunal de Justiça, conforme o artigo 85, § 2º, do Código de Processo Civil. 3. Preenchidos os requisitos do art. 534 do CPC, recebo o pedido de cumprimento de sentença. Intime-se, via portal eletrônico, a Fazenda Pública para que apresente, nos próprios autos, impugnação, no prazo de 30 dias. Intime-se. - ADV: GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), CLOVIS BRONZATI (OAB 279195/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":672488814,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0001573-18.2025.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0001573-18.2025.8.26.0222 - Procedimento do Juizado Especial da Fazenda Pública - Fornecimento de insumos - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Ante o exposto, JULGO PROCEDENTE o pedido, nos termos do artigo 487, inciso I, do Código de Processo Civil, para condenar as rés, solidariamente, a fornecerem ao autor a \"Dieta Enteral Isosource\", mediante a apresentação de receituário médico e enquanto perdurar o tratamento, ratificando a decisão inicial. Como de praxe, anoto que o produto deverá ser disponibilizado de acordo com o princípio ativo, sem necessidade de observânciaamarcas comerciais. Sem condenação ao pagamentodecustas e honorários advocatícios, haja vista a previsão do artigo 55, da Lei n. 9.099/95, salvo no casoderecurso, nos termos do referido dispositivo. Havendo a interposiçãodeeventual recurso, deverá ser observado o item 12 do comunica ECG nº 1530/2021, cujo o teor é o seguinte: No sistema dos Juizados Especiais, em casodeinterposição do Recurso Inominado, deverá ser elaborada certidão antes da remessa dos autos ao Colégio Recursal. Ressalvada a hipótesedeconcessãodegratuidade da justiça, o preparo corresponderá: a) à taxa judiciáriadeingresso, no importede1,5% sobre o valor atualizado da causa, observado o valor mínimode5 (cinco) UFESPs, a ser recolhida na guia DARE; b) à taxa judiciária referente às custasdepreparo, no importede4% sobre o valor fixado na sentença, se líquido, ou sobre o valor fixado equitativamente pelo MM. JuizdeDireito, se ilíquido ou ainda 4% sobre o valor atualizado atribuído à causa na ausênciadepedido condenatório, observado o valor mínimode5 (cinco) UFESPs, a ser recolhida na guia DARE; c) às despesas processuais referentes a todos os serviços forenses eventualmente utilizados (despesas postais, diligências do OficialdeJustiça, taxas para pesquisasdeendereço nos sistemas conveniados, custas para publicaçãodeeditais etc.), a serem recolhidas na guia FEDTJ, à exceção das diligênciasdeOficialdeJustiça, que deverão ser colhidas na guia GRD. O preparo será recolhidodeacordo com os critérios acima estabelecidos independentedecálculo elaborado pela serventia que apenas será responsável pela conferência dos valores e elab"},{"id":672724236,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1500097-31.2026.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"COMPANHIA ENERGETICA NARDINI","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"},{"nome":"ELAINE CRISTINA PEREIRA TOMAZ","oab":"SP/334529"}],"texto":"Processo 1500097-31.2026.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Companhia Energetica Nardini - Cuida-se de pedido de tutela de urgência formulado por COMPANHIA ENER-GÉTICA NARDINI nos autos da execução fiscal que lhe move a PREFEITURA MUNICIPAL DE PRADÓPOLIS, por meio do qual pretende a executada a exclusão de seu nome dos cadastros mantidos pela SERASA EXPERIAN, no que se refere ao apontamento décor-rente do presente feito executivo. Sustenta a requerente, em síntese, que a execução se encontra integralmente garantida por seguro garantia, tendo, ademais, realizado pagamento parcial do débito e oposto tempestivamente embargos à execução, estes autuados sob o nº 1000337-77.2026.8.26.0222, nos quais discute a exigibilidade da dívida. Aduz que a manutenção do apontamento junto ao órgão de proteção ao crédito lhe acarreta severos prejuízos, notadamente restrições ao acesso a financiamentos e abalo à imagem perante o mercado financeiro e fornecedores. É o breve relatório. Decido. A concessão da tutela de urgência reclama a presença concomitante dos requisitos elencados no artigo 300 do Código de Processo Civil, quais sejam, a probabilidade do direito e o perigo de dano ou o risco ao resultado útil do processo. No caso em apreço, a probabilidade do direito exsurge da circunstância de estar a execução garantida por seguro garantia, bem como da oposição de embargos à execução, nos quais se discute a própria exigibilidade do crédito perseguido. Com efeito, estando o juízo assegurado por garantia idônea e pendente de julgamento a impugnação apresentada pela executada, mostra-se plausível a pretensão de que se suspenda a publicidade do apontamento enquanto controvertida a dívida, sem que disso resulte prejuízo ao ente exequente, cujo crédito remanesce resguardado pela garantia prestada. O perigo de dano, por sua vez, revela-se igualmente presente, porquanto a manutenção da inscrição em cadastro de inadimplentes é apta a produzir efeitos gravosos e de difícil reparação à esfera econômica da executada, comprometendo-lhe o acesso ao crédito e o regular desenvolvimento de suas atividades empresariais, ao passo que a exclusão temporári"},{"id":673205239,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1000465-68.2024.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"APARECIDA DE PINA SILVA GONçALVES","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"LAIZA SOARES DONATO","oab":"SP/394178"},{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000465-68.2024.8.26.0222 - Procedimento Comum Cível - Indenização por Dano Moral - Aparecida de Pina Silva Gonçalves - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Tendo em vista o teor do e-mail de f. 464-465, em complementação à decisão de f. 454-455, oficie-se ao Imesc para que seja designada nova data para agendamento da perícia na unidade descentralizada da 6ª RAJ em Ribeirão Preto, bem como o cancelamento daquela agendada para o dia 26 de agosto de 2026 naquele órgão. Servirá a presente decisão com cópia da de f. 454-455 como ofício digitado. Intimem-se. - ADV: LAIZA SOARES DONATO (OAB 394178/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP), ADHEMAR RONQUIM FILHO (OAB 223251/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP)"},{"id":673205282,"data":"2026-07-20","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1502933-16.2022.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"AZ SOLUçõES, PRODUTOS E SERVIçOS LTDA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1502933-16.2022.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - AZ Soluções, Produtos e Serviços Ltda - Vistos. Requisite-se, por meio do sistema INFOJUD, a última declaração de IR da(s) parte(s) executada(s). A juntada das informações relacionadas à situação econômico-financeira deverá observar o disposto no Comunicado CG nº 240/2023 (disponibilizado no DJE em 13/04/2023, pág. 10) c. c. os artigos 121-B (processos físicos) e 1.263, § 1º, ambos das NSCGJ. Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG), LAIZA SOARES DONATO (OAB 130719/MG)"}];

  "2027-01-01":"Confraternização Universal","2027-03-26":"Sexta-feira Santa",
  "2027-04-21":"Tiradentes","2027-05-01":"Dia do Trabalho",
  "2027-07-09":"Revolução Constitucionalista (SP)","2027-09-07":"Independência do Brasil",
  "2027-10-12":"Nossa Senhora Aparecida","2027-11-02":"Finados",
  "2027-11-15":"Proclamação da República","2027-11-20":"Consciência Negra",
  "2027-12-25":"Natal"
};
// Feriados locais e suspensões de expediente do foro — o campo que o
// workalendar não cobre e que o operador precisa manter.
const FERIADOS_LOCAIS = {
  "2026-05-20":"Aniversário de Pradópolis (feriado municipal)",
  "2026-08-06":"Padroeiro do Município"
};

const iso = d => d.toISOString().slice(0,10);
const parseD = s => { const [y,m,d] = s.slice(0,10).split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addD = (d,n) => new Date(d.getTime()+n*864e5);
const emRecesso = d => { const m=d.getUTCMonth()+1, dia=d.getUTCDate();
  return (m===12&&dia>=20)||(m===1&&dia<=20); };
const nomeFeriado = d => FERIADOS[iso(d)] || (FERIADOS_LOCAIS[iso(d)]?FERIADOS_LOCAIS[iso(d)]+" (local)":null);
const diaUtil = d => { const w=d.getUTCDay();
  if(w===0||w===6) return false;
  if(emRecesso(d)) return false;
  return !FERIADOS[iso(d)] && !FERIADOS_LOCAIS[iso(d)];
};
const proxUtil = d => { let c=addD(d,1); while(!diaUtil(c)) c=addD(c,1); return c; };

/* Tabela de prazos e ritos — espelha _PRAZOS_CPC / _PRAZOS_PROPRIOS */
const PRAZOS = {
  "Contestação":15,"Apelação":15,"Embargos de Declaração":5,"Agravo de Instrumento":15,
  "Contrarrazões":15,"Manifestação":15,"Recurso Especial":15,"Recurso Extraordinário":15,
  "Recurso Ordinário":8,"Embargos à Execução Fiscal":30,"Recurso Inominado":10,
  "Impugnação ao Cumprimento de Sentença":30
};
const PRAZO_PROPRIO = new Set(["Embargos à Execução Fiscal","Recurso Inominado",
  "Impugnação ao Cumprimento de Sentença"]);
// Atos de defesa na Justiça do Trabalho: quádruplo pelo DL 779/69, art. 1º, II.
const DEFESA_TRABALHISTA = new Set(["Contestação","Manifestação"]);

/**
 * Calcula o prazo processual.
 * @param dispIso data de DISPONIBILIZAÇÃO no DJEN
 * @param ato     rótulo do ato (chave de PRAZOS)
 * @param fazenda parte é Fazenda Pública (art. 183)
 * @param rito    "comum" | "jefp" | "trabalhista"
 */
function calcPrazo(dispIso, ato, fazenda, rito){
  const simples = PRAZOS[ato] ?? 15;
  let mult = 1, fundamento, regra = "simples";
  if(!fazenda){ regra = "nao_fazenda"; fundamento = "Prazo simples — parte não é Fazenda Pública."; }
  else if(rito === "trabalhista"){
    // O prazo diferenciado do ente público na Justiça do Trabalho NÃO vem do
    // art. 183 do CPC, e sim do Decreto-Lei 779/69.
    if(DEFESA_TRABALHISTA.has(ato)){
      mult = 4; regra = "quadruplo";
      fundamento = `Prazo em QUÁDRUPLO (art. 1º, II, do Decreto-Lei 779/69): na Justiça do Trabalho o ente público tem prazo quadruplicado para contestar. O art. 183 do CPC não se aplica a este rito. ${simples} dias úteis multiplicados para ${simples*4}.`;
    } else {
      mult = 2; regra = "dobro_clt";
      fundamento = `Prazo em DOBRO (art. 1º, III, do Decreto-Lei 779/69): na Justiça do Trabalho o ente público tem prazo em dobro para recorrer. O art. 183 do CPC não se aplica a este rito. ${simples} dias úteis dobrados para ${simples*2}.`;
    }
  }
  else if(rito === "jefp"){ regra = "jefp"; fundamento = "Prazo SIMPLES: no Juizado Especial da Fazenda Pública não há prazo diferenciado (art. 7º da Lei 12.153/2009), o que afasta o dobro do art. 183 do CPC."; }
  else if(PRAZO_PROPRIO.has(ato)){ regra = "proprio"; fundamento = `Prazo SIMPLES: “${ato}” tem prazo próprio fixado em lei — o dobro não incide (art. 183, §2º, do CPC).`; }
  else { mult = 2; regra = "dobro_cpc"; fundamento = `Prazo EM DOBRO (art. 183, caput, do CPC): o Município goza de prazo em dobro para todas as suas manifestações. ${simples} dias úteis dobrados para ${simples*2}.`; }
  const dias = simples * mult;
  const dobro = mult > 1;

  const disp = parseD(dispIso);
  const publicacao = proxUtil(disp);              // art. 224, §2º
  const termo = proxUtil(publicacao);             // art. 224, caput
  let n = 0, cur = termo, fim = termo;
  const obstaculos = [];
  while(n < dias){
    if(diaUtil(cur)){ n++; fim = cur; }
    cur = addD(cur,1);
  }
  let scan = addD(publicacao,1);
  while(scan <= fim){
    if(scan.getUTCDay()!==0 && scan.getUTCDay()!==6){
      if(emRecesso(scan)) obstaculos.push([iso(scan),"Recesso forense (art. 220 do CPC)"]);
      else { const n2 = nomeFeriado(scan); if(n2) obstaculos.push([iso(scan),n2]); }
    }
    scan = addD(scan,1);
  }
  const hoje = parseD(iso(new Date()));
  const restantes = Math.round((fim - hoje)/864e5);
  return { simples, dias, dobro, mult, regra, fundamento, ato, rito,
    disponibilizacao: iso(disp), publicacao: iso(publicacao),
    termo: iso(termo), fim: iso(fim), obstaculos, restantes,
    recesso: obstaculos.filter(o=>o[1].startsWith("Recesso")).length };
}

/* ═══════════════════════════════════════════════════════════════
   Inferência do ato a praticar a partir do documento publicado
   ═══════════════════════════════════════════════════════════════ */
function inferirAto(p){
  const doc = (p.documento||"").toLowerCase(), cls = (p.classe||"").toLowerCase(),
        txt = (p.texto||"").toLowerCase();
  if(/embargos à execução fiscal|embargos a execução/.test(txt)) return "Embargos à Execução Fiscal";
  if(cls.includes("execução fiscal")) return "Embargos à Execução Fiscal";
  if(cls.includes("recurso inominado")) return "Recurso Inominado";
  if(cls.includes("cumprimento de sentença")) return "Impugnação ao Cumprimento de Sentença";
  if(doc.includes("acórdão")) return "Embargos de Declaração";
  if(doc.includes("sentença")) return "Apelação";
  if(doc.includes("citação")||doc.includes("notificação")) return "Contestação";
  if(cls.includes("recurso ordinário")) return "Contrarrazões";
  if(cls.includes("agravo")) return "Contrarrazões";
  return "Manifestação";
}
function inferirRito(p){
  const cls = (p.classe||"").toLowerCase(), t = p.tribunal||"";
  if(t.startsWith("TRT")||t==="TST") return "trabalhista";
  if(cls.includes("juizado")||cls.includes("inominado")) return "jefp";
  return "comum";
}
/** Extrai um prazo declarado no texto da publicação, quando houver. */
function prazoNoTexto(t){
  if(!t) return null;
  const m = t.match(/prazo\s+(?:legal\s+)?(?:de\s+)?(\d{1,3})\s*\(?[a-zçãéêíóú\s]*\)?\s*dias?(\s+úteis)?/i)
        || t.match(/(?:no|em)\s+(\d{1,3})\s*\(?[a-zçãéêíóú\s]*\)?\s*dias?\s+(?:úteis\s+)?(?:para|a\s+contar)/i);
  return m ? { dias:Number(m[1]), uteis:!!m[2], trecho:m[0].trim() } : null;
}
const ENTE = /MUNICIPIO DE PRADOPOLIS|PREFEITURA MUNICIPAL DE PRAD/i;
const semAcento = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const ehEnte = n => ENTE.test(semAcento(n||"").toUpperCase());
const POLO = {A:"ativo", P:"passivo"};
// Title-case para os rótulos vindos das APIs, que chegam em caixa alta.
// Detectar sigla pelo formato falha ("RECURSO" e "RITO" são caixa alta e não são
// siglas), então a lista é explícita: siglas de tribunal, unidades judiciárias e
// tudo que contenha dígito ou ordinal (1ª Vara, EXE4, CON2).
const SIGLAS = new Set(["TJSP","TRT15","TST","STJ","STF","TRF3","TRT","TRF","CNJ","OAB","MP","MPT",
  "CEJUSC","SEF","JEF","UPJ","SDI","SPF","DAM","RAJ","DEECRIM","PJE","CLT","CPC","LEF","INSS",
  "CON1","CON2","LIQ1","LIQ2","EXE1","EXE2","EXE3","EXE4","ROT","AIRR","II","III","IV"]);
const LIGA = new Set(["de","da","do","das","dos","e","em","a","o","no","na","ao","à","com","para"]);
const temDigito = t => /[0-9]/.test(t);
const titulo = s => (s||"").split(/(\s+)/).map((tk,i) => {
  if(/^\s+$/.test(tk)) return tk;
  const nu = tk.replace(/[^0-9A-Za-zÀ-ÿ]/g,"").toUpperCase();
  if(SIGLAS.has(nu) || temDigito(tk)) return tk.toUpperCase() === tk ? tk : tk;
  const low = tk.toLocaleLowerCase("pt-BR");
  if(i > 0 && LIGA.has(low)) return low;
  return low.replace(/(^|[\-–/(])([a-zà-ÿ])/g,(m,a,b)=>a+b.toLocaleUpperCase("pt-BR"));
}).join("");
const fmtD = s => s ? s.slice(0,10).split("-").reverse().join("/") : "—";

/* ═══════════════════════════════════════════════════════════════
   Estado
   ═══════════════════════════════════════════════════════════════ */
const STORE = "pradopolis.triagem.v1";
let triagem = {};
try { triagem = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch(e){ triagem = {}; }
const salvar = () => { try { localStorage.setItem(STORE, JSON.stringify(triagem)); } catch(e){} };
const st = id => triagem[id] || { status:"novo", resp:"", nota:"" };

/* Enriquece cada publicação uma única vez */
const PUBS = DADOS.map(p => {
  const ato = inferirAto(p), rito = inferirRito(p);
  const prazo = calcPrazo(p.data, ato, true, rito);
  const decl = prazoNoTexto(p.texto);
  const meu = p.partes.find(x => ehEnte(x.nome));
  return { ...p, ato, rito, prazo, declarado: decl,
    poloEnte: POLO[(meu?.polo||"").toUpperCase()] || "não informado",
    contra: p.partes.filter(x => !ehEnte(x.nome)).map(x=>x.nome) };
});
const PROCESSOS = (() => {
  const m = new Map();
  for(const p of PUBS){
    if(!m.has(p.numero)) m.set(p.numero, { numero:p.numero, tribunal:p.tribunal,
      orgao:p.orgao, classe:p.classe, polo:p.poloEnte, pubs:[], advogados:new Set(), contra:new Set() });
    const r = m.get(p.numero);
    r.pubs.push(p);
    p.advogados.forEach(a => r.advogados.add(`${a.nome} — OAB ${a.oab}`));
    p.contra.forEach(c => r.contra.add(c));
  }
  for(const r of m.values()){
    r.pubs.sort((a,b)=>b.data.localeCompare(a.data));
    r.ultima = r.pubs[0].data;
    r.proximo = r.pubs.map(p=>p.prazo).filter(z=>z.restantes>=0).sort((a,b)=>a.fim.localeCompare(b.fim))[0] || null;
    r.advogados = [...r.advogados]; r.contra = [...r.contra];
  }
  return [...m.values()].sort((a,b)=>b.ultima.localeCompare(a.ultima));
})();

const sev = r => r < 0 ? "crit" : r <= 3 ? "crit" : r <= 7 ? "warn" : "ok";
const sevTxt = r => r < 0 ? `vencido há ${-r}d` : r === 0 ? "vence hoje" : `${r} dias`;
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/** Botão de ajuda ancorado a um dado. `k` é a chave em EXPLICACOES. */
const ajuda = k => `<button type="button" class="explica" data-explica="${k}"
  aria-expanded="false" aria-label="Explicação: ${esc(EXPLICACOES[k].t)}">?</button>`;

let popAberto = null;
function fecharPop(){
  if(!popAberto) return;
  popAberto.botao?.setAttribute("aria-expanded","false");
  popAberto.el.remove();
  popAberto = null;
}
function abrirPop(botao){
  const chave = botao.dataset.explica, dados = EXPLICACOES[chave];
  if(!dados) return;
  const jaEra = popAberto?.botao === botao;
  fecharPop();
  if(jaEra) return;                       // clicar de novo fecha

  const el = document.createElement("div");
  el.className = "pop";
  el.setAttribute("role","dialog");
  el.setAttribute("aria-label", dados.t);
  el.innerHTML = `<h4>${esc(dados.t)}</h4><div>${dados.c}</div>`;
  document.body.appendChild(el);

  // Posiciona abaixo do botão; sobe se não couber. Corrige transbordo lateral.
  const b = botao.getBoundingClientRect(), r = el.getBoundingClientRect();
  const margem = 10;
  let topo = b.bottom + 9, lado = "baixo";
  if(topo + r.height > innerHeight - margem){ topo = b.top - r.height - 9; lado = "cima"; }
  let esq = b.left + b.width/2 - r.width/2;
  esq = Math.max(margem, Math.min(esq, innerWidth - r.width - margem));
  el.style.top = `${Math.max(margem, topo)}px`;
  el.style.left = `${esq}px`;
  el.dataset.lado = lado;
  // seta apontando para o botão, presa aos limites do balão
  // A seta acompanha o botão, mas fica presa aos limites do balão para não
  // "vazar" quando o popover é empurrado pela borda da tela.
  const seta = Math.max(12, Math.min(b.left + b.width/2 - esq - 4.5, r.width - 21));
  el.style.setProperty("--seta", `${seta}px`);

  botao.setAttribute("aria-expanded","true");
  popAberto = { el, botao };
}

document.addEventListener("click", e => {
  const botao = e.target.closest?.(".explica");
  if(botao){ e.stopPropagation(); abrirPop(botao); return; }
  if(!e.target.closest?.(".pop")) fecharPop();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && popAberto){ const b = popAberto.botao; fecharPop(); b?.focus(); }
});
addEventListener("scroll", fecharPop, true);
addEventListener("resize", fecharPop);

    <div class="bar-row">

      </div>
      <div class="bar-pct">${Math.round(v/total*100)}%</div>
    </div>`).join("")}</div>`;
}
const conta = (arr, f) => arr.reduce((a,x)=>{ const k=f(x); a[k]=(a[k]||0)+1; return a; },{});

        <div class="chips" id="chips-s"></div>
      </div>
      <div class="feed-scroll" id="flist"></div>
    </div>
    <div class="reader" id="reader"></div>
  </div>`;

  const tribs = [...new Set(PUBS.map(p=>p.tribunal))].sort();
  el("chips-t").innerHTML = [["","Todos"],...tribs.map(t=>[t,t])]
    .map(([v,l])=>`<button class="chip" data-f="trib" data-v="${v}" aria-pressed="${filtro.trib===v}">${l}</button>`).join("");
  el("chips-s").innerHTML = [["","Tudo"],["novo","Sem triagem"],["andamento","Em análise"],
    ["concluido","Providenciado"],["__crit","Prazo ≤ 3 dias"]]
    .map(([v,l])=>{ const on = v==="__crit" ? filtro.prazo==="crit" : filtro.status===v && filtro.prazo!=="crit";
      return `<button class="chip" data-f="${v==="__crit"?"prazo":"status"}" data-v="${v==="__crit"?"crit":v}" aria-pressed="${on}">${l}</button>`; }).join("");

  view.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const f = c.dataset.f, v = c.dataset.v;
    if(f==="prazo"){ filtro.prazo = filtro.prazo==="crit" ? "" : "crit"; filtro.status=""; }
    else { filtro[f] = filtro[f]===v ? "" : v; if(f==="status") filtro.prazo=""; }
    telaPublicacoes();
  });
  el("q").oninput = e => { filtro.q = e.target.value; pintaLista(); };
  el("faixa")?.querySelector(".fechar")?.addEventListener("click", () => {
    grava(FAIXA_VISTA, "1");
    el("faixa").remove();
  });
  pintaLista(); pintaLeitor();
}

function filtrados(){
  const q = semAcento(filtro.q).toLowerCase();
  return PUBS.filter(p => {
    if(filtro.trib && p.tribunal !== filtro.trib) return false;
    if(filtro.status && st(p.id).status !== filtro.status) return false;
    if(filtro.prazo === "crit" && !(p.prazo.restantes >= 0 && p.prazo.restantes <= 3)) return false;
    if(!q) return true;
    return semAcento(`${p.numero} ${p.orgao} ${p.classe} ${p.texto} ${p.partes.map(x=>x.nome).join(" ")}`)
      .toLowerCase().includes(q);
  });
}

function pintaLista(){
  const lst = filtrados();
  el("t-pub").textContent = PUBS.filter(p=>st(p.id).status==="novo").length || "";
  const box = el("flist");
  if(!lst.length){
    // "Nenhum prazo crítico" é boa notícia e precisa soar como tal — não pode
    // usar o mesmo tom de "sua busca não achou nada".
    box.innerHTML = filtro.prazo === "crit"
      ? `<div class="empty bom"><strong>Nenhum prazo crítico</strong>
           Nada vence nos próximos 3 dias úteis. O dia está sob controle.
           <button class="btn sm" data-limpar="1">Ver todas as publicações</button></div>`
      : `<div class="empty"><strong>Nenhuma publicação com esses filtros</strong>
           Tente outro termo de busca ou remova os filtros ativos.
           <button class="btn sm" data-limpar="1">Limpar filtros</button></div>`;
    box.querySelector("[data-limpar]").onclick = () => {
      filtro = { q:"", trib:"", status:"", prazo:"" };
      telaPublicacoes();
    };
    return;
  }
  box.innerHTML = lst.map(p => {
    const s = st(p.id), r = p.prazo.restantes;
    return `<div class="fitem ${sel===String(p.id)?"sel":""}" data-id="${p.id}">
      <div class="fitem-top">
        ${s.status==="novo"?'<span class="unread"></span>':""}
        <span class="fitem-num">${esc(p.numero)}</span>
        <span class="tag">${esc(p.tribunal)}</span>
        <span class="pill ${sev(r)}" style="margin-left:auto">${sevTxt(r)}</span>
      </div>
      <div class="fitem-cls">${esc(titulo(p.classe))} · ${esc(p.documento||p.tipo)}</div>
      <div class="fitem-bot">
        <span class="mono">${fmtD(p.data)}</span>·<span>${esc(p.ato)}</span>
        ${s.resp?`·<span>${esc(s.resp)}</span>`:""}
      </div>
    </div>`;
  }).join("");
  box.querySelectorAll(".fitem").forEach(n => n.onclick = () => { sel = n.dataset.id; telaPublicacoes(); });
}
