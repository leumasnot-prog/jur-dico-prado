"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"}],"texto":"PROCESSO ENTRADO EM 04/08/2026\r\n\r\n2194780-95.2026.8.26.0000; Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011; Agravo de Instrumento; Comarca: Guariba; Vara: 1ª Vara Judicial; Ação: Procedimento Comum Cível; Nº origem: 1000053-69.2026.8.26.0222; Assunto: Desapropriação Indireta; Agravante: Maria Inês Marcari Gaspar e outros; Advogado: Clovis Bronzati (OAB: 279195/SP); Advogada: Viviane Cristina Bronzati (OAB: 444669/SP); Agravado: Município de Pradópolis; Advogado: Wesley Luiz Alves de Paula (OAB: 274238/SP); Interessado: Ivanete Marcari; Advogado: Clovis Bronzati (OAB: 279195/SP)"},{"id":689189323,"data":"2026-08-06","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1000109-05.2026.8.26.0222","classe":"PETIçãO CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"TALITA FRANKLIN SAMPAIO DE SOUZA","polo":"A"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000109-05.2026.8.26.0222 - Petição Cível - Apuração de haveres - Talita Franklin Sampaio de Souza - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Os artigos 12 e 13 da Lei 12153/09 dispõem que tanto a obrigação de fazer quanto o pagamento de quantia certa serão efetuados \"após o trânsito em julgado da decisão\", de modo que se conclui inexistir execução provisória no Juizado Especial da Fazenda Pública. Dessa forma, considerando que referida lei é específica quando comparada à Lei 9099/95 e, ainda, que o cumprimento de sentença somente após o trânsito em julgado é incompatível com o recebimento do recurso no efeito meramente devolutivo, recebo o recurso interposto pela parte ré em ambos os efeitos. Vista a parte contrária para contrarrazões em 10 dias. Após, remetam-se os autos ao Egrégio Colégio Recursal de São Paulo-SP. Intime-se. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), DANIEL DE SOUZA SILVA (OAB 297740/SP)"},{"id":689189326,"data":"2026-08-06","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0000744-03.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLAUDIO ALVES","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"}],"texto":"Processo 0000744-03.2026.8.26.0222 (processo principal 1000178-71.2025.8.26.0222) - Cumprimento de sentença - Anulação de Débito Fiscal - Claudio Alves - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Fls. : Autos com vista ao exequente- providenciar o cadastramento do RPV. - ADV: DANIEL DE SOUZA SILVA (OAB 297740/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":689371757,"data":"2026-08-06","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"0000528-18.2021.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"},{"nome":"PEDRO ANTONIO BRONZATI","polo":"P"},{"nome":"VERA LUCIA MAGNUSSON BRONZATI","polo":"P"}],"advogados":[{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"LAIZA SOARES DONATO","oab":"SP/394178"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"RODRIGO CREPALDI PEREZ CAPUCELLI","oab":"SP/334704"}],"texto":"Processo 0000528-18.2021.8.26.0222 (processo principal 0001206-77.2014.8.26.0222) - Cumprimento de sentença - Locação de Imóvel - Município de Pradópolis e outro - Pedro Antonio Bronzati - Vera Lucia Magnusson Bronzati e outros - F. 1216 e seguintes. Não tendo sido deferido o efeito suspensivo ao agravo de instrumento interposto pela parte executada, deverá o feito prosseguir. F. 1215: indefiro, por ora, citação do executado Marcus Vinicius Bronzati por edital porque prematura, uma vez que não esgotadas todas as diligência na tentativa de sua efetiva localização. Sendo, assim, manifeste-se a exequente, no prazo de quinze dias, a fim de requerer o que de direito. Int. - ADV: CLOVIS BRONZATI (OAB 279195/SP), RODRIGO CREPALDI PEREZ CAPUCELLI (OAB 334704/SP), LAIZA SOARES DONATO (OAB 394178/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP), ADHEMAR RONQUIM FILHO (OAB 223251/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":689371765,"data":"2026-08-06","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1002248-95.2024.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MARLON MENDES JARDIM","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1002248-95.2024.8.26.0222 - Procedimento Comum Cível - Horas Extras - Marlon Mendes Jardim - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Cumpra-se o v. acórdão. Em caso de eventuais valores a serem cobrados pela parte vencedora, o pedido para início do cumprimento da sentença deverá se dar por meio de peticionamento eletrônico como \"petição intermediária - cumprimento de sentença\", formando-se o processo dependente,no prazo de 15 dias. Decorrido o prazo, com ou sem a interposição do cumprimento de sentença, arquivem-se os autos. Sem taxas, diante da isenção a que faz jus a parte requerida. Int. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP)"},{"id":689481787,"data":"2026-08-06","tribunal":"TJSP","orgao":"Processamento 3º Grupo - 7ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"2193429-87.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ELISABETH CHELI BATISTA PIVETA","polo":"A"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"}],"advogados":[{"nome":"CAROLINA ARRUDA BARBOSA","oab":"SP/386085"}],"texto":"DESPACHO\r\n\r\nNº 2193429-87.2026.8.26.0000 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Agravo de Instrumento - Guariba - Agravante: Elisabeth Cheli Batista Piveta - Agravado: Município de Pradópolis - Trata-se de agravo de instrumento tirado da r. decisão (fls. 13/15) que indeferiu a tutela de urgência para a suspensão dos efeitos do ato administrativo que resultou no desligamento da autora do cargo de professora, com pedido de reintegração e restabelecimento de sua remuneração diante do questionamento da Portaria nº 3.623/2026 (fls. 136/137). Em suas razões, a agravante afirma que exerceu a função de professora de educação básica perante a rede municipal de ensino de Pradópolis e que foi instaurado procedimento administrativo disciplinar em seu desfavor. A comissão processante concluiu pela improcedência de duas das acusações formuladas e recomendou a aplicação da penalidade de advertência para a imputação remanescente. O prefeito divergiu do relatório final e aplicou a penalidade de demissão por justa causa, mantida em revisão administrativa. Há ilegalidade do ato administrativo por violação aos princípios da motivação, proporcionalidade, razoabilidade e individualização da sanção, bem como desnecessidade de dilação probatória. Pede a concessão de tutela antecipada recursal para suspender os efeitos da demissão, determinando sua reintegração provisória com o restabelecimento dos vencimentos. É o relatório. De início, cabe assinalar que nesta fase de cognição a análise recursal deve se restringir à verificação dos pressupostos legais para a concessão do efeito pretendido pela agravante (art. 995 do CPC). Ao tratar do fundamento para tanto, explica Araken de Assis que enquanto o efeito devolutivo se funda no princípio dispositivo, o suspensivo baseia-se no princípio da segurança. É um ponto de equilíbrio entre dois interesses legítimos: de um lado, o do vencedor, ansioso por ver realizado, na prática, o direito já reconhecido; de outro, o do vencido em impedir que ato decisório injusto produza efeitos irreversíveis (Manual dos recursos, 10ª ed. São Paulo: Thompson R"},{"id":690116815,"data":"2026-08-06","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1001261-59.2024.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MARIA REGILDA REGO VIEIRA DOS SANTOS","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Processo 1001261-59.2024.8.26.0222 - Procedimento Comum Cível - Limite de Carga Horária - Jornada Semanal - Maria Regilda Rego Vieira dos Santos - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Fls. 359/366: Trata-se de embargos de declaração opostos pela autora contra o despacho de fls. 355, que determinou o cumprimento do v. acórdão e abriu prazo para que as partes requeressem o que de direito. Alega omissões quanto à determinação de que o Município comprove, em prazo certo e sob multa diária, o apostilamento do direito reconhecido, e quanto à fixação das diretrizes de liquidação e do percentual dos honorários sucumbenciais, com afastamento da Súmula 111 do Superior Tribunal de Justiça. Conheço dos embargos, pois tempestivos. No mérito, rejeito-os. Os embargos de declaração servem à integração do julgado nas hipóteses do art. 1.022 do Código de Processo Civil, não se prestando a antecipar providências ainda não requeridas nem a obter pronunciamento sobre questões próprias de fase processual futura. Quanto ao apostilamento, foi ele acrescido ao dispositivo da sentença de fls. 271 / 277 pela decisão de fls. 319/320, que acolheu em parte os embargos anteriores da autora, e assim se manteve por força do v. acórdão de fls. 341/350. A obrigação de fazer é, portanto, título executivo, cuja satisfação se dá por iniciativa da parte credora, nos termos dos arts. 536 e 538 do Código de Processo Civil. Foi para isso que o item 2 do despacho de fls. 355 abriu prazo de 15 dias às par-tes, tendo o item 3 orientado o processamento do cumprimento de sentença. Basta que a exequente formule o requerimento respectivo, oportunidade em que se apreciarão a intimação da Fazenda Pública, o prazo de cumprimento e, se necessário, a medida coercitiva. Quanto aos honorários advocatícios, a sentença de fls. 271/277 deixou de arbitrá-los desde logo, com fundamento no art. 85, § 4.º, inciso II, do Código de Processo Civil, solução preservada pelo v. acórdão de fls. 341/350, que a fls. 349 reafirmou o arbitramento após apuração do valor, considerado o trabalho em grau recursal. Enquanto não apurado o valor da condenação, inexiste base sobre a qual incidam os percentuais escalonados do art. 85, "},{"id":690194275,"data":"2026-08-06","tribunal":"TJSP","orgao":"Processamento 7º Grupo - 14ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"1002324-90.2022.8.26.0222","classe":"APELAçãO CíVEL","tipo":"Intimação","documento":"Intimação de acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"},{"nome":"PEDRO SOARES","polo":"P"}],"advogados":[{"nome":"MARCIA RODRIGUES ALVES","oab":"SP/75398"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"INTIMAÇÃO DE ACÓRDÃO\r\n\r\nNº 1002324-90.2022.8.26.0222 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Apelação Cível - Guariba - Apelante: Município de Pradópolis - Apelado: Pedro Soares - Magistrado(a) Geraldo Xavier - Negaram provimento ao recurso. V. U. Declara voto o 2º Juiz - APELAÇÃO. AÇÃO ANULATÓRIA DE LANÇAMENTOS FISCAIS. IMPOSTO PREDIAL E TERRITORIAL URBANO. TAXAS DE CONSERVAÇÃO DE VIAS E LOGRADOUROS PÚBLICOS, DE EXPEDIENTE E DE LIMPEZA PÚBLICA. EXERCÍCIOS DE 2019 E 2020. ALEGAÇÃO DE ILEGITIMIDADE PASSIVA. PROCEDÊNCIA. LANÇAMENTOS EFETUADOS CONTRA QUEM NUNCA FOI PROPRIETÁRIO DO BEM. INTELIGÊNCIA DO ARTIGO 34 DO CÓDIGO TRIBUTÁRIO NACIONAL.DANO MORAL. CONFIGURAÇÃO. PENHORA DE BENS EM VIRTUDE DE INDEVIDA PROPOSITURA DE EXECUÇÃO FISCAL. CONSTRANGIMENTO DESCABIDO. SUFICIÊNCIA DO VALOR ESTIPULADO A TÍTULO DE REPARAÇÃO.HONORÁRIOS ADVOCATÍCIOS. REDUÇÃO. INADMISSIBILIDADE. VERBA FIXADA COM MODERAÇÃO. APLICAÇÃO, POR ANALOGIA, DO DISPOSTO NO ARTIGO 85, § 8º, DO CÓDIGO DE PROCESSO CIVIL. PRECEDENTES DA CORTE. RECURSO DENEGADO. ART. 1007 CPC - EVENTUAL RECURSO - SE AO STJ: CUSTAS R$ 270,12 - (GUIA GRU NO SITE http://www.stj.jus.br) - RESOLUÇÃO STJ/GP N. 7 DE 28 DE JANEIRO DE 2025, ATUALIZADA PELA INSTRUÇÃO NORMATIVA STJ/GP N. 13 DE 27 DE JANEIRO DE 2026; SE AO STF: CUSTAS R$ 1.325,45 - GUIA GRU COBRANÇA - FICHA DE COMPENSAÇÃO - (EMITIDA ATRAVÉS DO SITE www.stf.jus.br ) E PORTE DE REMESSA E RETORNO R$ 140,90 - GUIA FEDTJ - CÓD 140-6 - BANCO DO BRASIL OU INTERNET - RESOLUÇÃO N. 914, DE 1º DE JULHO DE 2026 DO STF. Os valores referentes ao PORTE DE REMESSA E RETORNO, não se aplicam aos PROCESSOS ELETRÔNICOS, de acordo com o art. 3º, inciso, II, da RESOLUÇÃO N. 833, DE 13 DE MAIO DE 2024 DO STF. - Advs: Wesley Luiz Alves de Paula (OAB: 274238/SP) (Procurador) - Marcia Rodrigues Alves (OAB: 75398/SP) - 1° andar"},{"id":687712425,"data":"2026-08-05","tribunal":"TRT15","orgao":"Gabinete do Desembargador Dagoberto Nishina de Azevedo - 4ª Câmara","numero":"0010176-53.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Lista de distribuição","documento":"Distribuição","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/visualizacao/26080400300176200000155739159?instancia=2","partes":[{"nome":"JULIANA ELISABETE DA SILVA","polo":"A"},{"nome":"JULIANA ELISABETE DA SILVA","polo":"P"},{"nome":"LM SERVICOS INTEGRADOS LTDA","polo":"P"},{"nome":"MARCO AURELIO GONCALVES VIEIRA","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"GABRIEL FUNICHELLO","oab":"SP/443995"},{"nome":"FERNANDO SCUARCINA","oab":"SP/183555"},{"nome":"JOSE ANTONIO FUNNICHELI","oab":"SP/79077"}],"texto":"Processo 0010176-53.2025.5.15.0120 distribuído para 4ª Câmara - Gabinete do Desembargador Dagoberto Nishina de Azevedo - 4ª Câmara na data 03/08/2026 \n Para maiores informações, clique no link a seguir: https://pje.trt15.jus.br/pjekz/visualizacao/26080400300176200000155739159?instancia=2"},{"id":687713450,"data":"2026-08-05","tribunal":"TRT15","orgao":"Gabinete do Desembargador Orlando Amâncio Taveira - 11ª Câmara","numero":"0011010-09.2023.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Lista de distribuição","documento":"Distribuição","meio":"Diário de Justiça Eletrôn uendo, e, expeça-se Ofício Requisitório-RPV / Precatório. ANDREA MARIA PFRIMER FALCAO Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - JOAO PONTES CAMARA"},{"id":688285924,"data":"2026-08-05","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010774-70.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26080414054695700000302717172?instancia=1","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"VANIA DE SOUZA GUEDES","polo":"A"}],"advogados":[{"nome":"JOAO RENAN CASSORIELO COUTI","oab":"SP/360274"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA PROCESSO: ATOrd 0010774-70.2026.5.15.0120 AUTOR: VANIA DE SOUZA GUEDES RÉU: MUNICIPIO DE PRADOPOLIS Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL NOTIFICAÇÃO AUDIÊNCIA UNA TELEPRESENCIAL DESTINATÁRIO: VANIA DE SOUZA GUEDES ENDEREÇO: Expediente enviado por outro meio Pela presente, fica V. Sa. notificado(a) a comparecer à audiência UNA designada para 01/12/2026 14:00 horas. A audiência será realizada telepresencialmente pela plataforma Zoom, por meio do link: https://trt15-jus-br.zoom.us/j/7732585362?pwd=VGlVUkk2R0duUlM2VW82UjMyZkNFQT09 ID da reunião: 773 258 5362    Senha: 773574 Orientações sobre o uso da plataforma ZOOM podem ser obtidas no site-https://sites.google.com/trt15.jus.br/zoomadv/pagina-inicial . O acesso à audiência poderá ser efetivado pelo uso de smartphone ou computador pessoal com câmera. Nos termos do art. 844 da CLT, a ausência da parte autora implicará arquivamento do feito e o(s) réu(s) deverá(ão) comparecer pessoalmente (ou por preposto que tenha conhecimento dos fatos) e apresentar defesa até o horário da audiência, sob pena de revelia e confissão quanto à matéria de fato, presumindo-se verdadeiros os fatos alegados pela parte autora. Com a defesa, o(s) réu(s) deverá(ão) apresentar, no Processo Judicial Eletrônico (PJe), em formato PDF, documentos pessoais, instrumento constitutivo (contrato social), se pessoa jurídica, e documentos que pretende utilizar como prova. Havendo necessidade de audiência presencial, a parte deverá apresentar o respectivo requerimento em até cinco dias do recebimento da presente notificação. Para conhecimento do pedido, o(s) réu(s) deverão acessar a petição inicial pela página eletrônica (https://pje.trt15.jus.br/pjekz/validacao), digitando a(s) chave(s): 26070401225780800000299461462 As testemunhas deverão comparecer na audiência telepresencial, independentemente de intimação, sob pena de preclusão, sendo que não será expedida carta precatória. A audiência somente poderá ser redesignada em razão de ausência da testemunha caso seja comprovado o convite até o horário da audiência. A comunicação da des"},{"id":687830658,"data":"2026-08-05","tribunal":"TJSP","orgao":"Entrada Originários Direito Público, Câm. Especializadas e Meio Ambiente - Palácio da Justiça - sala 109","numero":"2193429-87.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Entrados","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ELISABETH CHELI BATISTA PIVETA","polo":"A"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"}],"advogados":[{"nome":"CAROLINA ARRUDA BARBOSA","oab":"SP/386085"}],"texto":"PROCESSO ENTRADO EM 03/08/2026\r\n\r\n2193429-87.2026.8.26.0000; Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011; Agravo de Instrumento; Comarca: Guariba; Vara: 1ª Vara Judicial; Ação: Procedimento Comum Cível; Nº origem: 1000595-87.2026.8.26.0222; Assunto: Reintegração ou Readmissão; Agravante: Elisabeth Cheli Batista Piveta; Advogada: Carolina Arruda Barbosa (OAB: 386085/SP); Agravado: Município de Pradópolis"},{"id":687928446,"data":"2026-08-05","tribun B 130719/MG)"},{"id":688192329,"data":"2026-08-05","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1502224-20.2018.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"GILBERTO CIPRIANO DA SILVA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1502224-20.2018.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Gilberto Cipriano da Silva - Vistos. Visando a identificação e qualificação dos herdeiros do executado falecido, determino, inicialmente, buscas pelo sistema Serpjud, para pesquisa do nome completo dos filhos do de cujus. Com os resultados das buscas pelo Serpjud, providencie a serventia a consulta ao Infojud, para obtenção dos CPFs dos sucessores do falecido, salutar para buscas posteriores de endereço. Após a realização das diligências determinadas nesta decisão, intime-se a exequente para manifestação acerca do resultado. Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG), LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":688534120,"data":"2026-08-05","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000266-92.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 0000266-92.2026.8.26.0222 (processo principal 1000572-78.2025.8.26.0222) - Cumprimento de sentença - Garantias Constitucionais - Clovis Bronzati - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Manifeste(m)-se a(s) parte(s) exequente(s), no prazo de 15 dias, acerca da petição juntada pela parte adversa. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP)"},{"id":688917661,"data":"2026-08-05","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1002928-80.2024.8.26.0222","classe":"MANDADO DE SEGURANçA CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"SILVIO MARTINS","polo":"P"}],"advogados":[{"nome":"SAULO EMANUEL ATIQUE","oab":"SP/218159"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1002928-80.2024.8.26.0222 - Mandado de Segurança Cível - Garantias Constitucionais - Clovis Bronzati - Silvio Martins - - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Trata-se de fase posterior à emissão da sentença de fls. 283/286, confirmada pelo v. acórdão de fls. 357/363 e transitada em julgado em 15/10/2025 (fls. 365), na qual sobrevieram as manifestações do impetrante de fls. 398/411 e do Município de fls. 389/393. O título mandamental concedeu a segurança para assegurar ao impetrante o acesso à documentação indicada na inicial, facultando à Administração o cumprimento por qualquer das três modalidades ali expressamente previstas: indicação clara e específica de URL de sítio eletrô-nico, indicação de data e local para exibição dos documentos ou entrega de cópia reprográfica, me-diante o respectivo ressarcimento. Tal solução foi integralmente mantida pelo E. Tribunal de Justi-ça, ao fundamento de que os artigos 10 e 11 da Lei nº 12.527/11 autorizam a prestação da informa-ção por diferentes meios, sem prejuízo do núcleo essencial do direito tutelado. Nos limites da coisa julgada, o requerimento de intimação da autoridade para concessão de carga dos processos administrativos (fls. 410, \"a\") não merece acolhida. A retirada dos autos por carga não integra o comando sentencial, o qual se satisfaz por qualquer das três vias acima referidas, e o seu deferimento importaria indevida ampliação do título em sede de cumprimento. Acresço que o Município, reconhecendo expressamente que a URL indicada se refere às despesas, disponibilizou ao impetrante as demais formas previstas na sentença, a saber, a vista presencial da integralidade dos processos - com dois agendamentos sucessivos, para 23/04/2026 e 15/06/2026, aos quais o interessado não compareceu - e a extração de cópias reprográficas mediante recolhimento da guia de fl. 377, no valor de R$ 464,33, não adimplida, sendo certo que, após o trânsito em julgado, já não subsiste o óbice ao pagamento outrora invocado. Não há, portanto, descumprimento imputável à Administração, que ofertou de mo-do concreto todas as vias que o título lhe facultava, remanescendo à disposição do impetrante o exercício do acesso pelas"},{"id":686384839,"data":"2026-08-04","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0000249-56.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA CONTRA A FAZENDA PúBLICA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MICHELE GARCIA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 0000249-56.2026.8.26.0222 (processo principal 1001024-25.2024.8.26.0222) - Cumprimento de Sentença contra a Fazenda Pública - Equivalência salarial - Michele Garcia - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Relatório dispensado nos termos do artigo 38 da Lei nº 9.099/95. FUNDAMENTO. Insurge-se a impugnante FAZENDA PÚBLICA DO MUNICÍPIO DE PRADÓPOLIS, unicamente, no excesso de execução no valor de R$10.080,24 (dez mil, oitenta reais e vinte e quatro centavos). Havendo discordância, foi determinada a nomeação de perito judicial (fls. 121/122). Apresentado Laudo Pericial (fls. 162/178) e, intimadas as partes a se manifestar, houve a concordância por parte da exequente com os cálculos apresentados pelo Perito (fls. 188/194), no valor de R$24.736,24 (vinte e quatro mil, setecentos e trinta e seis reais e vinte e quatro centavos), reputando-o correto e requerendo a suahomologação. O Município pugnou pela procedência da impugnação pelo Município Assim, é caso de homologar ocálculoapresentado pelo Perito Judicial nomeado. DECIDO. Ante o exposto, JULGO PARCIALMENTE PROCEDENTE a presenteimpugnação aocumprimento de sentença e HOMOLOGO os cálculos de fls. 162/178, na forma apresentada pelo Perito Judicial. Após o decurso do prazo para eventual recurso, providencie o(a) exequente o peticionamento do competente incidente processual de requisição de pequeno valor. Publique-se e intimem-se. Oportunamente, arquivem-se. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP)"},{"id":686871371,"data":"2026-08-04","tribunal":"TRT15","orgao":"Gabinete da Vice-Presidência Judicial - Análise de Recurso","numero":"0010303-88.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26080313393599200000155702744?instancia=2","partes":[{"nome":"ISABEL CRISTINA SILVA PIRES DOS SANTOS","polo":"P"},{"nome":"JOSE EDUARDO BUSCARDI COSTANTINI","polo":"A"},{"nome":"LM SERVICOS INTEGRADOS LTDA","polo":"P"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"}],"advogados":[{"nome":"FABIO FREJUELLO","oab":"SP/299619"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNA gnação de perícia. Intimem-se. ARARAQUARA/SP, 31 de julho de 2026 ANDREA MARIA PFRIMER FALCAO Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - DOUGLAS RAFAEL DE SOUSA"},{"id":685871651,"data":"2026-08-03","tribunal":"TRT15","orgao":"6ª Câmara","numero":"0010775-71.2025.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26073118512448900000155648864?instancia=2","partes":[{"nome":"GUIONICE CAJAIBA DE OLIVEIRA MERCHAN","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO 6ª CÂMARA Relator: ANDRE AUGUSTO ULPIANO RIZZARDO ROT 0010775-71.2025.5.15.0029 RECORRENTE: GUIONICE CAJAIBA DE OLIVEIRA MERCHAN RECORRIDO: MUNICIPIO DE PRADOPOLIS Ficam as partes intimadas do acórdão proferido no presente processo (Artigo 17 da Resolução CSJT nº 185/2017 c/c Lei nº 13.467/2017). Acesso ao sistema PJe- JT - 2º grau: http://pje.trt15.jus.br/consultaprocessual.  CAMPINAS/SP, 31 de julho de 2026. RENATA ARAGAO MOREIRA DA SILVA Diretor de Secretaria\n\nIntimado(s) / Citado(s)\n - GUIONICE CAJAIBA DE OLIVEIRA MERCHAN"},{"id":686294298,"data":"2026-08-03","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010784-17.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26080217370397100000302463971?instancia=1","partes":[{"nome":"CRISTIANE APARECIDA ALVES MARCARI","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"JOAO RENAN CASSORIELO COUTI","oab":"SP/360274"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010784-17.2026.5.15.0120 AUTOR: CRISTIANE APARECIDA ALVES MARCARI RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID 6eb7df0 proferida nos autos. DECISÃO Vistos. O reclamante requer, em sede de tutela de urgência, seja o réu compelido a \"exibir integralmente o processo administrativo, atas, estudos, relatórios e conclusões da comissão instituída pelo Decreto Municipal nº 923/2026, bem como fichas financeiras, controles de ponto, escalas de trabalho, registros de HTPC, lotação, turmas atendidas, quadro de jornada e normativas internas aplicáveis às ADIs desde janeiro de 2026. Requer-se, ainda, a implantação do piso nacional de 2026 em folha de pagamento e a adequação imediata da jornada ao regime 2/3 e 1/3.\" Pois bem. Estatui o artigo 300 do CPC que \"A tutela de urgência será concedida quando houver elementos que evidenciem a probabilidade do direito e o perigo de dano ou o risco ao resultado útil do processo\". A primeira providência pretendida pela parte reclamante não constitui, propriamente, tutela de urgência de natureza antecipada ou mesmo cautelar, já que a apresentação de documentos pelas reclamadas é ato típico de defesa, cuja omissão, como sabe, tem consequências sob a perspectiva do ônus da prova. Outrossim, no que se refere à implantação do piso nacional e adequação da jornada de trabalho, reputo necessária a formação do contraditório e eventual dilação probatória. Ausentes, por ora, os requisitos à concessão da tutela de urgência, indefiro-a. Intime-se. Designe-se audiência. ARARAQUARA/SP, 31 de julho de 2026. POLYANNA SAMPAIO CANDIDO DA SILVA SANTOS Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - CRISTIANE APARECIDA ALVES MARCARI"},{"id":685176235,"data":"2026-08-03","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0000744-03.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLAUDIO ALVES","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0000744-03.2026.8.26.0222 (processo principal 1000178-71.2025.8.26.0222) - Cumprimento de sentença - Anulação de Débito Fiscal - Claudio Alves - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Apresentado o cálculo e intimada a se manifestar, a Fazenda do Município concordou. Diante disso, homologo, para que produza seus legais e jurídicos efeitos, o cálculo de fl.4. Referido valor será o requisitado e sem qualquer acréscimo, sob pena de cancelamento do RPV. Ressalto que os descontos obrigatórios deverão ser informados nos incidentes, se o caso. Conforme Comunicado 394/2015, o processamento das requisições de Precatório e RPV somente serão admitidas no formato digital, tanto para processos físicos como digitais. Não há interesse recursal, de modo que a decisão transitou em julgado nesta data. Deve o Procurador providenciar o peticionamento eletrônico para requisição do RPV , através do portal E-Saj,\"petição intermediária\", \"requisição de pequeno valor\", categoria \"incidente processual\", ou se for o caso \"PRECATÓRIO\" com o devido preenchimento dos dados, anexando cópia do cálculo, nos moldes da Portaria 9622/2018 do TJSP., e Provimento CSM 2.753/2024: a requisição deverá ser instruida com as seguintes peças processuais-sentença ou acórdão, ou cópia do título executivo se o caso; certidão do trânsito em julgado da fase de conhecimento; decisão que homologou os cálculos; certidão do trânsito em julgado dos embargos a execução ou impugnação ou decurso do prazo para sua interposição;demonstrativo do cálculo, procuração ou substabelecimento, contrato de honorários, cópia do documento de identificação. Intimem-se. - ADV: DANIEL DE SOUZA SILVA (OAB 297740/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":685176264,"data":"2026-08-03","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"0001573-18.2025.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0001573-18.2025.8.26.0222 - Procedimento do Juizado Especial da Fazenda Pública - Fornecimento de insumos - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Recebo o recurso interposto pela Fazenda Municipal, em seus regulares efeitos. Vista ao autor para contrarrazões em 10 dias. Após, encaminhem-se os autos ao Colégio Recursal em São Paulo. Int. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":685176282,"data":"2026-08-03","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1002443-46.2025.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"WILLIAN FRANKLIN SAMPAIO","polo":"A"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1002443-46.2025.8.26.0222 - Procedimento do Juizado Especial da Fazenda Pública - Reajuste de Prestações - Willian Franklin Sampaio - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Aguarde-se, pelo prazo de 30 (trinta) dias, manifestação da parte exequente em termos de prosseguimento. No silêncio, remetam-se os autos ao arquivo. Int. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), DANIEL DE SOUZA SILVA (OAB 297740/SP)"},{"id":685971278,"data":"2026-08-03","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000708-58.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANTôNIO ALEXANDRE MAGNUSSON","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0000708-58.2026.8.26.0222 (processo principal 0000787-08.2024.8.26.0222) - Cumprimento de sentença - Jornada de Trabalho - Antônio Alexandre Magnusson - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Antônio Alexandre Magnusson opôs embargos de declaração (fls. 79/84) contra o item 2 da decisão de fls. 74, que arbitrou os honorários advocatícios em 15% sobre as parcelas devidas até a prolação da sentença, com apoio na Súmula 111 do Superior Tribunal de Justiça. Alega contradição e erro material de enquadramento e pede efeitos infringentes para que o percentual incida sobre o proveito econômico integral. Tempestivos, deles conheço. Não há contradição na acepção do art. 1.022, II, do Código de Processo Civil, pois o vício ali previsto é interno à decisão, aferível entre suas próprias premissas e o dispositivo, e não o eventual desacordo entre o julgado e a norma ou a jurisprudência invocadas, que traduz error in iudicando sindicável por agravo de instrumento (art. 1.015, parágrafo único, do CPC). Também não procede a afirmação de que o verbete teria excluído da base de cálculo a correção monetária e os juros apurados na memória, já que a Súmula 111 do Superior Tribunal de Justiça não alcança a atualização das parcelas, que sempre integra a base, mas apenas as prestações vencidas após a sentença. Assiste razão ao embargante, contudo, quanto ao ponto central. A Súmula 111 do Superior Tribunal de Justiça é própria das ações previdenciárias e acidentárias, contexto em que foi editada e no qual sua eficácia foi reafirmada já sob a vigência do Código de Processo Civil de 2015 (Tema 1.105). A execução tem por objeto verba remuneratória de empregado público municipal, de natureza administrativa e disciplinada em lei local, tanto que a competência da Justiça Comum foi assentada na fase de conhecimento com fundamento no Tema 1.143 do Supremo Tribunal Federal. Não há espaço para a incidência do verbete nem razão para sua aplicação analógica. A correção não autoriza, porém, a fixação imediata da base pretendida, porque o título é ilíquido e a conta apresentada ainda se sujeita a impugnação, de modo que a definição do valor da verba somente ocorrerá quando liquidado o j"},{"id":685971294,"data":"2026-08-03","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1000475-20.2021.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ALDAIR CANDIDO DE SOUZA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1000475-20.2021.8.26.0222 - Procedimento Comum Cível - Defeito, nulidade ou anulação - Aldair Candido de Souza - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Deverá a parte requerida peticionar nos autos de cumprimento de sentença que é incidental aos presentes autos. No mais, retornem-se ao arquivo. Intime-se. - ADV: ALDAIR CANDIDO DE SOUZA (OAB 201321/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":686266583,"data":"2026-08-03","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1001695-14.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"IGOR SOUZA PINA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"VICTÓRIA VITTI DE LAURENTIZ","oab":"SP/393965"},{"nome":"FABIO EDUARDO DE LAURENTIZ","oab":"SP/170930"}],"texto":"Processo 1001695-14.2025.8.26.0222 - Procedimento Comum Cível - Responsabilidade do Fornecedor - Igor Souza Pina - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - Trata-se de ação de indenização por danos materiais e morais proposta por Igor Souza Pina em face do Departamento de Estradas de Rodagem do Estado de São Paulo - DER/SP e do Município de Pradópolis. Alega o autor que, em 13 de março de 2025, trafegava com sua motocicleta pela Rodovia Mário Donegá (SP-291), quando foi atingido por caminhão que perdeu o controle da direção, invadiu a pista contrária e colidiu frontalmente com seu veículo. Sustenta que a perda de controle do caminhão decorreu da existência de óleo derramado sobre a pista de rolamento, circunstância que teria sido previamente comunicada aos órgãos públicos responsáveis, sem que fossem adotadas providências para sinalização, limpeza ou interdição do local. Afirma que, em decorrência do acidente, sofreu amputação transtibial do membro inferior esquerdo, passando a suportar danos materiais, morais, estéticos e existenciais, além de redução permanente de sua capacidade laborativa, postulando, ainda, pensionamento mensal, nos termos do artigo 950 do Código Civil. Em contestação (fls. 131/143), o DER/SP sustentou que sua responsabilidade, na hipótese, é subjetiva, fundada na demonstração de falta do serviço. No mérito, alegou ausência de comprovação da existência de óleo sobre a pista, afirmando que o acidente decorreu exclusivamente da perda de dirigibilidade do caminhão em razão da pista molhada pelas chuvas, circunstância apta a afastar o nexo causal e a responsabilidade da autarquia. Impugnou, ainda, os danos alegados e o pedido de pensionamento. O Município de Pradópolis contestou às fls. 144/167 e suscitou preliminar de ilegitimidade passiva, sustentando que o acidente ocorreu em rodovia estadual submetida à administração exclusiva do DER/SP. No mérito, pugnou pela improcedência dos pedidos, alegando ausência de omissão específica, inexistência de nexo causal e culpa exclusiva de terceiro. Houve réplica (fls. 171/180). As partes especificaram provas. Passo ao saneamento. MANTENHO a gratuidade da justiça anteriormente deferida ao autor. Não fo"},{"id":684211293,"data":"2026-07-31","tribunal":"TST","orgao":"4ª Turma","numero":"0011155-25.2019.5.15.0120","classe":"EMBARGOS DE DECLARAçãO CíVEL","tipo":"Intimação","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://sessao-integracao-backend.prd.rede.tst/documentos/Esij--24-2026-O-84/11155-25.2019.5.15.0120/certidao-inclusao-pauta/MzEvMDcvMjAyNiAwMDowMDowMCMtMTE1MjUwNTA=","partes":[{"nome":"ELIETE ROBERTA DE OLIVEIRA VENDITE","polo":"A"},{"nome":"MUNICÍPIO DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Pauta de Julgamento (processos e-SIJ) da Vigésima Quarta Sessão Ordinária da Quarta Turma, a realizar-se exclusivamente em ambiente eletrônico (sessão virtual).\n\nA sessão virtual terá início no dia 21/08/2026 e encerramento 28/08/2026.\n\n\n1. Sustentação oral na sessão virtual:\n\n1.1. Sustentações eletrônicas: Nas hipóteses de cabimento de sustentação oral, fica facultado ao advogado encaminhar a sustentação por meio eletrônico, após a publicação da pauta até 48 horas antes do início da sessão virtual (art. 134-A do RITST). Neste caso, o julgamento será realizado em ambiente eletrônico (sessão virtual).\n\n1.2. Formato e responsabilidade: As sustentações devem seguir as especificações técnicas do Tribunal (Ato SEGJUD.GP nº 129/2025), e o advogado firmará termo de declaração de que se encontra devidamente habilitado nos autos e de responsabilidade pelo conteúdo do arquivo enviado (art. 134-A, §§ 3º e 4º, do RITST).\n\n1.3. Traje: É dispensável o uso da beca nas sustentações orais virtuais, mas deverá ser utilizado traje adequado, correspondente ao paletó e gravata para os advogados e indumentária compatível com a solenidade do ato para as advogadas (art. 156, parágrafo único, do RITST).\n\n2. Destaque para julgamento em sessão presencial:\n\n2.1. Prazo: O pedido de destaque pode ser feito desde a publicação da pauta até 48 horas antes do início da sessão virtual (art. 135, II, do RITST).\n\n2.2. Requerimento: O advogado deve formalizar o pedido de destaque por meio de inscrição eletrônica no endereço https://www.tst.jus.br/portal-da-advocacia.\n\n2.3. Condição: O pedido de destaque só poderá ser realizado se o julgamento do processo comportar sustentação oral, e será submetido à consideração do relator. Em caso de deferimento, o processo será remetido para julgamento presencial, com publicação de nova pauta (art. 135 do RITST).\n\n\n\nObservação 1: Caso opte por encaminhar a sustentação oral por meio eletrônico, o advogado não poderá requerer o destaque do processo para julgamento presencial (art. 134-A, § 5º, do RITST).\n\nObservação 2: Durante o período de julgamento virtual (6 dias úteis, conforme art. 134, § 1º, RITST), os Ministros não atenderão advogados para despachar processo"},{"id":683906212,"data":"2026-07-31","tribunal":"TRT15","orgao":"LIQ1 - Araraquara","numero":"0010479-72.2022.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26073011345849600000302190282?instancia=1","partes":[{"nome":"FRANCISCO CARLOS MARTINS DE OLIVEIRA CARDOSO","polo":"A"},{"nome":"HELIO PEREIRA DE CASTRO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ1 - ARARAQUARA PROCESSO: ATOrd 0010479-72.2022.5.15.0120 AUTOR: FRANCISCO CARLOS MARTINS DE OLIVEIRA CARDOSO (ESPÓLIO DE) RÉU: MUNICIPIO DE PRADOPOLIS Laudo apresentado. Intimem-se as partes para impugnação fundamentada, no prazo comum de 08 dias (em dobro para Fazenda Pública), sob pena de preclusão. Em havendo pedido de esclarecimentos, intime-se o Sr. Perito para prestá-los, em 10 dias.  .\n\nIntimado(s) / Citado(s)\n - FRANCISCO CARLOS MARTINS DE OLIVEIRA CARDOSO"},{"id":683909857,"data":"2026-07-31","tribunal":"TRT15","orgao":"CON2 - Araraquara","numero":"0011465-21.2025.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26073011450861400000302192318?instancia=1","partes":[{"nome":"LUIZ CARLOS BARBETTI","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON2 - ARARAQUARA ATOrd 0011465-21.2025.5.15.0120 AUTOR: LUIZ CARLOS BARBETTI RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Sentença ID 58b5c32 proferida nos autos, cujo dispositivo consta a seguir: III – DISPOSITIVO Ante o exposto, decido declarar a incompetência material da Justiça do Trabalho quanto aos pedidos de pagamento de diferenças do adicional por tempo de serviço (quinquênios) e de licença-prêmio (itens \"12\" e \"13\" do rol de pedidos da petição inicial). Após o trânsito em julgado, remetam-se os autos ao Juízo competente, qual seja, a Justiça Estadual da Comarca de Guariba, Estado de São Paulo, que detém a competência territorial sobre o Município de Pradópolis, para que a ação lá prossiga exclusivamente em relação aos referidos pedidos. Em prosseguimento, decido rejeitar as demais preliminares arguidas; julgar extintos, com resolução de mérito, os pedidos cuja exigibilidade da obrigação se refere ao período anterior a 30/12/2020, diante do acolhimento da prescrição (CPC, art. 487, II); e julgar PROCEDENTES EM PARTE as pretensões de LUIZ CARLOS BARBETTI em face de MUNICIPIO DE PRADOPOLIS, condenando a parte reclamada a pagar à parte reclamante: a) horas extras e reflexos; b) adicional de insalubridade em grau máximo (40%) no período de 30/12/2020 (marco prescricional) até 31/10/2025 e o adicional de insalubridade em grau médio (20%) a partir de 01/11/2025, e reflexos correspondentes; e c) honorários advocatícios. Tudo nos termos da fundamentação supra que integra este dispositivo, observando a dedução. Benefícios da gratuidade da Justiça concedido ao reclamante. A liquidação se processará por cálculos, mas a forma ora estipulada é meramente indicativa e pode ser alterada a critério do Juízo da execução. Observar-se-á a variação salarial da parte reclamante e os demais parâmetros fixados. Executar-se-ão as contribuições para a seguridade social a cargo do trabalhador e do tomador dos serviços, conforme critérios fixados na fundamentação. Deverá também ser efetuada a retenção do imposto de renda na fonte, segundo os parâmetros acima deline"},{"id":684151107,"data":"2026-07-31","tribunal":"TRT15","orgao":"3ª Seção de Dissídios Individuais","numero":"0014629-97.2024.5.15.0000","classe":"AçãO RESCISóRIA","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26073014182905300000155493739?instancia=2","partes":[{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"TEREZINHA VEIGA DOS SANTOS FERREIRA","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO 3ª SEÇÃO DE DISSÍDIOS INDIVIDUAIS Relator: MARCELO GARCIA NUNES AR 0014629-97.2024.5.15.0000 AUTOR: MUNICIPIO DE PRADOPOLIS RÉU: TEREZINHA VEIGA DOS SANTOS FERREIRA PROCESSO nº 0014629-97.2024.5.15.0000 AÇÃO RESCISÓRIA - 3ª SDI AUTOR: MUNICIPIO DE PRADOPOLIS  RÉ: TEREZINHA VEIGA DOS SANTOS FERREIRA ORIGEM: 1ª VARA DO TRABALHO DE JABOTICABAL RELATOR: MARCELO GARCIA NUNES   Pretende o autor a rescisão parcial do v. acórdão proferido pela 5a Câmara - 3a Turma, de relatoria da Excelentíssima Desembargadora Ana Paula Pellegrina Lockmann, que manteve a r. sentença de origem que condenou o Município ao pagamento do abono assiduidade, nos autos da reclamação trabalhista no 0010881-43.2019.5.15.0029, em trâmite perante a 1a Vara do Trabalho de Jaboticabal, com esteio no art. 966, inciso V, do CPC. Assevera que \"em sede da ADIn (Ação Direta de Inconstitucionalidade) n.o 2054365-04.2022.8.26.0000, em trâmite perante o Tribunal de Justiça do Estado de São Paulo, em sede de julgamento de 01/02/2023, foi proferido Acórdão julgando Procedente a ADIn n.o 0010778-83.2021.5.15.0120 reconhecendo a inconstitucionalidade do Abono Assiduidade. Foi publicado o resultado da sessão de julgamento, tendo havido o trânsito em julgado\". Requer, em consequência, \"com base na inconstitucionalidade superveniente, nos termos do art. 966, V, do CPC, deve ser afastado o direito da Requerida ao recebimento dos valores referentes ao abono assiduidade, afastando-se tal condenação contida na Ação Trabalhista n.o 0010881-43.2019.5.15.0029, bem como se determinando a revogação da Portaria n.o 2.720, de 03 de agosto de 2022 (cópia anexa), no que tange ao abono assiduidade, julgando-se a presente Ação Rescisória TOTALMENTE PROCEDENTE...\" Requereu a concessão de tutela de urgência a fim de que fosse determinada a suspensão da obrigação referente à incorporação imposta nos autos da reclamação trabalhista. Instruiu a exordial com documentos diversos, tendo atribuído à causa o valor de R$ 20.963,67 (vinte mil novecentos e sessenta e três reais e sessenta e sete centavos). Por meio da decisão de ID 072dd7d, foi determinado o regu"},{"id":684159801,"data":"2026-07-31","tribunal":"TRT15","orgao":"EXE4 - Araraquara","numero":"0010593-50.2018.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26073014174314500000302220133?instancia=1","partes":[{"nome":"CAMILA MENOSSI DE AZEVEDO COTRIM","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"RODRIGO OCTAVIO DE LIMA CARVALHO","oab":"SP/143054"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO EXE4 - ARARAQUARA PROCESSO: ATOrd 0010593-50.2018.5.15.0120 AUTOR: CAMILA MENOSSI DE AZEVEDO COTRIM RÉU: MUNICIPIO DE PRADOPOLIS Ficam V. Sa. intimadas da certidão id e375982 - Precatório autuado no GPREC e Pje 2o Grau. OBS: \"...O número do precatório já havia sido informado às partes no último parágrafo do despacho id d8c30fa, de 30/09/2025: \"...Os autos aguardarão o pagamento do Precatório 0019789-06.2024.5.15.0000 - PJE de 2o Grau, cabendo as partes o acompanhamento até sua quitação. ...\"   ...\n\nIntimado(s) / Citado(s)\n - CAMILA MENOSSI DE AZEVEDO COTRIM"},{"id":684207766,"data":"2026-07-31","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010146-81.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26073014484227300000302227464?instancia=1","partes":[{"nome":"MARIA DO CARMO ROSA DA SILVA PINTO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"RAFAEL BOGAS","polo":"A"}],"advogados":[{"nome":"JENNIFER CAROLINA PINTO","oab":"SP/481553"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010146-81.2026.5.15.0120 AUTOR: MARIA DO CARMO ROSA DA SILVA PINTO RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID e71380f proferido nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL DESPACHO Visto. Ficam as partes intimadas  dos  esclarecimentos  conforme petição do perito em ID 719227d Por  cautela,  intimem-se  as  partes  para,  no  prazo  de  5  dias, informarem se pretendem a produção de prova oral em audiência, especificando-as e justificando-as,  sob  pena  de  indeferimento  e  preclusão,  e,  não  havendo,  poderão apresentar suas razões finais, no mesmo prazo, tornando-se em seguida os autos conclusos para julgamento, do qual as partes serão intimadas pelo Diário de Justiça Eletrônico Nacional (DJEN). Intimem-se. ARARAQUARA/SP, 30 de julho de 2026 ANDREA MARIA PFRIMER FALCAO Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - MARIA DO CARMO ROSA DA SILVA PINTO"},{"id":684598663,"data":"2026-07-31","tribunal":"TRT15","orgao":"LIQ2 - Araraquara","numero":"0010188-14.2018.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26073018231517700000302271508?instancia=1","partes":[{"nome":"ANTONIA DE FATIMA JANS DE CEZARE","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"SANDRA PEREIRA PIMENTA GARCIA","polo":"A"}],"advogados":[{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA ATOrd 0010188-14.2018.5.15.0120 AUTOR: ANTONIA DE FATIMA JANS DE CEZARE RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID aab7411 proferido nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL Prioridade(s): Idoso DESPACHO Acerca do laudo pericial retificado, manifestem-se as partes, de forma específica e fundamentada, no prazo de oito dias, sob pena de preclusão. O ente público tem prazo em dobro para sua manifestação. Após, concluso. ARARAQUARA/SP, 30 de julho de 2026 ANDREA MARIA PFRIMER FALCAO Juíza do Trabalho Titular\n\nIntimado(s) / Citado(s)\n - ANTONIA DE FATIMA JANS DE CEZARE"},{"id":684388030,"data":"2026-07-31","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"0000102-30.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ANA CAROLINA MARTINS","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Processo 0000102-30.2026.8.26.0222 (processo principal 1002857-15.2023.8.26.0222) - Cumprimento de sentença - DIREITO PROCESSUAL CIVIL E DO TRABALHO - Ana Carolina Martins - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Assim, HOMOLOGO o cálculo apresentado. Nos termos do COMUNICADO Nº 384/2015, do E. Tribunal de Justiça do Estado de São Paulo, a solicitação de ofício requisitório deverá ser realizada exclusivamente por peticionamento eletrônico, observando-se estritamente as determinações contidas nas portarias nº 8.660/12, 8.941/14 e 9.095/14 do TJSP e Comunicados nº 02/2014 e 01/2015 do DEPRE, cuja solicitação (PRECATÓRIOS ou RPV) somente fica admitida na forma digital, através do portal e-SAJ. Segue manual: http://www.tjsp.jus.br/Download/PeticionamentoEletronico/GuiaPeticionamentoRe quisitorios.pdf?d=1593715571283 Ainda, friso que é obrigatória a indicação dos dados pessoais dos credores (data de nascimento e CPF), a representação por procuradores devidamente habilitados nos autos principais,o cadastro da parte executada e seu respectivo endereço e procurador, a data da intimação da devedora para compensação (decisão que determinou a citação para apresentar embargos e informar débitos líquidos e certos), data do trânsito em julgado sobre a compensação e valor dos honorários advocatícios. Deve haver instrução do incidente com o cálculo homologado, observada a respectiva data-base, bem como a presente decisão homologatória. Não deve haver atualização do cálculo, sendo que esta ocorre por ocasião do pagamento. O valor global da requisição deverá corresponder ao valor total solicitado no Precatório ou na Requisição de Pequeno Valor, portanto, se os honorários forem solicitados através de RPV, o valor global do precatório corresponderá apenas ao valor principal. Os ofícios que não constarem a discriminação de todas as verbas de cada credor, bem como a individualização da verba honorária por credores, e outros dados obrigatórios, serão devolvidos, gerando outro pedido e expedição de novo ofício requisitório, cujo processamento pelo DEPRE obedecerá a data de protocolamento do expediente posterior. A Requisição de Pequeno Valor será encaminhada eletronicamente à Entidade De"},{"id":684392461,"data":"2026-07-31","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1500549-75.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"AURELINA NUNES DE SOUZA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"ANTONIO CARLOS VENTURIN","oab":"SP/126420"}],"texto":"Processo 1500549-75.2025.8.26.0222 - Procedimento Comum Cível - Liminar - PREFEITURA MUNICIPAL DE PRADÓPOLIS - - AURELINA NUNES DE SOUZA - Vistos. Encaminho os autos com vista ao Ministério Público para contrarrazões, facultado à curadoria especial oferecer a peça, se entender pertinente, no prazo legal. Intime-se. - ADV: ANTONIO CARLOS VENTURIN (OAB 126420/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), ANTONIO CARLOS VENTURIN (OAB 126420/SP)"},{"id":659432457,"data":"2026-07-30","tribunal":"TST","orgao":"8ª Turma","numero":"0010906-11.2018.5.15.0120","classe":"AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://consultaprocessual.tst.jus.br/consultaProcessual/resumoForm.do?consulta=1&numeroInt=6555&anoInt=2021","partes":[{"nome":"JAIME ANTONIO DE MATOS","polo":"P"},{"nome":"MUNICÍPIO DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"DR. GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"DR. ADHEMAR RONQUIM FILHO","oab":"SP/223251"},{"nome":"DRA. LAIZA SOARES DONATO","oab":"SP/394178"}],"texto":"Agravante(s): MUNICÍPIO DE PRADÓPOLIS\nADVOGADO: ADHEMAR RONQUIM FILHO\nADVOGADO: LAIZA SOARES DONATO\nAgravado(s): JAIME ANTONIO DE MATOS\nADVOGADO: GILBERTO FAGUNDES DE OLIVEIRA\nGMMHM/dl\n\nD E C I S Ã O\n\nInsurge-se a parte agravante em face da decisão do TRT que denegou seguimento ao seu recurso de revista. Sustenta, em síntese, que o seu apelo trancado reúne condições de admissibilidade.\nO MPT opinou pelo conhecimento e provimento do Recurso de Revista.\nExamino.\nCom efeito, as vias recursais extraordinárias para os tribunais superiores são restritas e não traduzem terceiro grau de jurisdição. Busca-se, efetivamente, assegurar a imperatividade da ordem jurídica constitucional e federal, visando à uniformização da jurisprudência no País.\nTratando-se de recurso de revista, a admissibilidade do apelo só tem pertinência nas estritas hipóteses jurídicas do art. 896, ?a?, ?b? e ?c?, da CLT, respeitados os limites rigorosos dos parágrafos 2º, 7º e 9º do mesmo artigo. Pertinência das Súmulas 266, 333 e 442 do TST.\nEis os termos da decisão agravada:\n\n?PRESSUPOSTOS EXTRÍNSECOS\nTempestivo o recurso (decisão publicada em 21/02/2020; recurso apresentado em 10/03/2020).\nRegular a representação processual (nos termos daSúmula 436, item I/TST).\nIsento de preparo (CLT, art. 790-A e DL 779/69, art. 1º, IV).\nPRESSUPOSTOS INTRÍNSECOS\nRemuneração, Verbas Indenizatórias e Benefícios / Abono.\nRemuneração, Verbas Indenizatórias e Benefícios / Salário / Diferença Salarial.\nLEIS Nºs 8.178/91 E 8.238/91\nNo que se refere ao acolhimento de diferenças salariais, o v. acórdão se fundamentou no conjunto fático-probatório e não violou, de forma direta e literal, os dispositivos constitucionais e legais apontados.\nDesse modo, inadmissível o recurso, pelo teor da Súmula 126 do C. TST e pela ausência dos requisitos exigidos pela alínea \"c\" do art. 896 da CLT.\nAdemais,o recorrente não logrou demonstrar o pretendido dissenso interpretativo, pois se limitou a transcrever os arestos paradigmas, deixando de realizar o indispensável cotejo analítico entre eles e a v. decisão recorrida, descumprindo os requisitos previstos no art. 896, § 8º, da CLT.\nAssim, a orientação da Corte Superior é de atribuir à part"},{"id":683095778,"data":"2026-07-30","tribunal":"TRT15","orgao":"1ª Câmara","numero":"0010715-98.2025.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26072916212695700000155430620?instancia=2","partes":[{"nome":"ANA PAULA RIBEIRO FERNANDES","polo":"A"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO 1ª CÂMARA Relator: RICARDO ANTONIO DE PLATO ROT 0010715-98.2025.5.15.0029 RECORRENTE: ANA PAULA RIBEIRO FERNANDES RECORRIDO: MUNICIPIO DE PRADOPOLIS Ficam as partes intimadas do acórdão proferido no presente processo (Artigo 17 da Resolução CSJT nº 185/2017 c/c Lei nº 13.467/2017). Acesso ao sistema PJe- JT - 2º grau: http://pje.trt15.jus.br/consultaprocessual.  CAMPINAS/SP, 29 de julho de 2026. HENRIQUE ALVES DE SOUSA Diretor de Secretaria\n\nIntimado(s) / Citado(s)\n - ANA PAULA RIBEIRO FERNANDES"},{"id":682340470,"data":"2026-07-30","tribunal":"TJSP","orgao":"2° Vara Judicial da Comarca de Guariba","numero":"4001459-74.2026.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Lista de distribuição","documento":"Outros","meio":"Diário de Justiça Eletrônico Nacional","link":"https://eproc1g.tjsp.jus.br/eproc/externo_controlador.php?acao=processo_distribuicao_listar&sinPesquisar=S&numProcesso=40014597420268260222&hash=03847e43241bfc63f3cce9b591ba9e8f71833c5e157b300a53cdfb51c17f29e8","partes":[{"nome":"JULIA NATANI DE OLIVEIRA SANTOS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"ANA RITA NANZER","oab":"SP/522592"}],"texto":"Processo 4001459-74.2026.8.26.0222 distribuido para 2° Vara Judicial da Comarca de Guariba na data de 28/07/2026."},{"id":682835403,"data":"2026-07-30","tribunal":"TJSP","orgao":"Processamento 4º Grupo - 9ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"2121989-31.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"BLITZTUR AGêNCIA DE TURISMO E VIAGENS LTDA.","polo":"P"},{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"LEANDRO PREDESCHI
