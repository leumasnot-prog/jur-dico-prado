<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Processual de Pradópolis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* ── Tokens: paleta clara completa ─────────────────────────────── */
:root{
  --ground:#F3F5F3; --surface:#FFFFFF; --surface-2:#EDF0EE; --surface-3:#E3E8E5;
  --ink:#141A18; --ink-2:#39433F; --muted:#66716D; --line:#D3DAD6; --line-2:#C0C9C4;
  --accent:#0F4C4A; --accent-soft:#DCE9E6; --accent-ink:#0B3A38;
  --crit:#A32F26; --crit-soft:#F6E2E0;
  --warn:#8A5A00; --warn-soft:#F7ECD6;
  --ok:#3E7C4F;  --ok-soft:#DFEEE2;
  --info:#2E5C86; --info-soft:#DEE9F4;
  --shadow:0 1px 2px rgba(20,26,24,.06), 0 8px 24px -12px rgba(20,26,24,.18);
  --rail:236px; --radius:7px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --slab:"Zilla Slab",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1312; --surface:#141C1A; --surface-2:#1B2422; --surface-3:#243230;
    --ink:#E7EEEB; --ink-2:#BCC9C5; --muted:#8B9894; --line:#2A3735; --line-2:#3A4A47;
    --accent:#57B8AB; --accent-soft:#173330; --accent-ink:#8FD6CC;
    --crit:#E38A82; --crit-soft:#3A1F1C;
    --warn:#DCA950; --warn-soft:#332616;
    --ok:#78C48D;  --ok-soft:#1A2E20;
    --info:#7FAAD4; --info-soft:#1A2833;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1312; --surface:#141C1A; --surface-2:#1B2422; --surface-3:#243230;
  --ink:#E7EEEB; --ink-2:#BCC9C5; --muted:#8B9894; --line:#2A3735; --line-2:#3A4A47;
  --accent:#57B8AB; --accent-soft:#173330; --accent-ink:#8FD6CC;
  --crit:#E38A82; --crit-soft:#3A1F1C;
  --warn:#DCA950; --warn-soft:#332616;
  --ok:#78C48D;  --ok-soft:#1A2E20;
  --info:#7FAAD4; --info-soft:#1A2833;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--slab);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ── Shell ─────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}

.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 16px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.crest{width:32px;height:32px;flex:0 0 32px;border-radius:5px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-family:var(--slab);font-weight:700;font-size:13px}
:root[data-theme="dark"] .crest,
:root:not([data-theme="light"]) .crest{color:#0D1312}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .crest{color:#fff}}
.brand-t{font-family:var(--slab);font-weight:600;font-size:14px;line-height:1.25}
.brand-s{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

.nav{padding:10px 10px;display:flex;flex-direction:column;gap:1px;flex:1}
.nav-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:14px 8px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--radius);
  color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .12s}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav a .ic{width:15px;flex:0 0 15px;opacity:.85}
.nav a .tally{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--surface-2);padding:1px 6px;border-radius:20px}
.nav a.on .tally{background:var(--surface);color:var(--accent-ink)}

.rail-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.rail-foot b{color:var(--ink-2);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:17px}
.topbar .sub{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.sweep{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);
  font-family:var(--mono);padding:4px 9px;background:var(--surface-2);border-radius:20px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 6px}
.view{padding:22px;flex:1;min-width:0}

/* ── Componentes ───────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:14px}
.card-h .hint{font-size:11.5px;color:var(--muted);margin-left:auto}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}

.tag{display:inline-block;padding:1.5px 7px;border-radius:4px;font-size:10.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);
  border:1px solid var(--line)}

.btn{background:var(--surface);border:1px solid var(--line-2);border-radius:5px;padding:5px 11px;
  font-size:12.5px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld input,.fld select{background:var(--surface);border:1px solid var(--line-2);border-radius:5px;
  padding:6px 9px;font-size:13px;width:100%}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;
  position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-2)}
.kpi.crit::before{background:var(--crit)} .kpi.warn::before{background:var(--warn)}
.kpi.ok::before{background:var(--ok)} .kpi.acc::before{background:var(--accent)}
.kpi .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--slab);font-size:29px;font-weight:700;line-height:1.05;margin-top:5px;
  font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:3px}

/* Barras */
.bars{display:flex;flex-direction:column;gap:9px;padding:15px 16px}
.bar-row{display:grid;grid-template-columns:1fr 42px;gap:10px;align-items:center}
.bar-lbl{font-size:12.5px;display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.bar-lbl span:last-child{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.track{height:6px;background:var(--surface-3);border-radius:20px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:20px}
.bar-pct{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}

/* Tabela */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 235px);min-height:280px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:1;
  box-shadow:inset 0 -1px 0 var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.cell-num{font-family:var(--mono);font-size:12px;white-space:nowrap}
.cell-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* Feed bipartido */
.feed{display:grid;grid-template-columns:minmax(330px,400px) 1fr;gap:14px;
  height:calc(100vh - 132px);min-height:520px}
.feed-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:hidden}
.feed-tools{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.feed-search{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
  padding:6px 10px;font-size:13px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;cursor:pointer;
  background:var(--surface-2);border:1px solid transparent;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.feed-scroll{overflow-y:auto;flex:1}
.fitem{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;
  border-left:3px solid transparent;transition:background .1s}
.fitem:hover{background:var(--surface-2)}
.fitem.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.fitem-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.fitem-num{font-family:var(--mono);font-size:12px;font-weight:500}
.fitem-cls{font-size:12px;color:var(--ink-2);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fitem-bot{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:var(--muted)}
.unread{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px}

.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow-y:auto;padding:0}
.reader-h{padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--surface);z-index:2}
.reader-h h2{font-size:16px;margin-bottom:3px}
.reader-body{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.sect{display:flex;flex-direction:column;gap:8px}
.sect-t{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600;display:flex;align-items:center;gap:8px}
.sect-t::after{content:"";flex:1;height:1px;background:var(--line)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0}

.teor{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:14px 16px;
  font-size:12.5px;line-height:1.65;white-space:pre-wrap;max-height:340px;overflow-y:auto;
  font-family:var(--mono)}

.parties{display:flex;flex-direction:column;gap:5px}
.party{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.party.ente{font-weight:600;color:var(--accent-ink)}
.polo{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:0 5px;flex:0 0 auto}

.prazo-box{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.prazo-head{padding:11px 14px;display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border-bottom:1px solid var(--line)}
.prazo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
  border-top:1px solid var(--line)}
.pstep{padding:11px 14px;border-right:1px solid var(--line)}
.pstep:last-child{border-right:none}
.pstep .pl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pstep .pv{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:4px}
.pstep .pn{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.legal{font-size:11.5px;color:var(--muted);line-height:1.5;padding:10px 14px;
  border-top:1px solid var(--line);background:var(--surface-2)}
.legal b{color:var(--ink-2)}

.triage{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;padding:40px;text-align:center}

/* Agenda de prazos */
.agenda{display:flex;flex-direction:column}
.ag-row{display:grid;grid-template-columns:96px 1fr auto;gap:14px;padding:11px 16px;
  border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.ag-row:hover{background:var(--surface-2)}
.ag-row:last-child{border-bottom:none}
.ag-date{font-family:var(--mono);font-size:12.5px;font-weight:500}
.ag-when{font-size:10.5px;color:var(--muted);margin-top:2px}

.split{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.calc{display:flex;flex-direction:column;gap:11px;padding:15px 16px}
.calc-out{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:13px 15px}
.calc-out .big{font-family:var(--slab);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}

.note{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--warn);
  padding:11px 14px;border-radius:0 5px 5px 0;font-size:12.5px;line-height:1.55}
.note b{font-weight:700}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}


/* ── Tooltip pedagógico ────────────────────────────────────────── */
.explica{width:15px;height:15px;flex:0 0 15px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--surface);color:var(--muted);font-size:10px;font-weight:700;line-height:1;
  cursor:help;padding:0;display:inline-grid;place-items:center;vertical-align:middle;
  margin-left:5px;transition:background .12s,color .12s,border-color .12s}
.explica:hover,.explica[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent-ink);
  border-color:var(--accent)}
.pop{position:fixed;z-index:60;max-width:330px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:7px;box-shadow:var(--shadow);
  padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.pop h4{font-family:var(--slab);font-size:13px;color:var(--ink);margin-bottom:5px}
.pop b{color:var(--ink);font-weight:600}
.pop em{font-style:italic}
.pop::after{content:"";position:absolute;width:9px;height:9px;background:var(--surface);
  border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);transform:rotate(45deg)}
.pop::after{left:var(--seta,16px)}
.pop[data-lado="baixo"]::after{top:-5px}
.pop[data-lado="cima"]::after{bottom:-5px;transform:rotate(225deg)}

/* ── Faixa educativa e banners dispensáveis ────────────────────── */
.faixa{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;margin-bottom:12px;
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
  background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;line-height:1.55}
.faixa b{font-weight:700}
.faixa .fechar{margin-left:auto;background:none;border:0;color:inherit;cursor:pointer;
  font-size:15px;line-height:1;padding:0 2px;opacity:.65}
.faixa .fechar:hover{opacity:1}

/* ── Estados vazios que ensinam ────────────────────────────────── */
.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;
  padding:36px 28px;text-align:center;line-height:1.6}
.empty strong{display:block;color:var(--ink);font-family:var(--slab);font-size:14px;
  font-weight:600;margin-bottom:5px}
.empty .btn{margin-top:11px}
.empty.bom strong{color:var(--ok)}

/* ── Tour guiado ───────────────────────────────────────────────── */
.tour-mask{position:fixed;inset:0;z-index:70;background:rgba(12,20,18,.55);
  pointer-events:auto}
.tour-hole{position:fixed;z-index:71;border-radius:7px;pointer-events:none;
  box-shadow:0 0 0 3px var(--accent), 0 0 0 9999px rgba(12,20,18,.55);
  transition:all .28s ease-out}
@media (prefers-reduced-motion:reduce){.tour-hole{transition:none}}
.tour-balao{position:fixed;z-index:72;max-width:360px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);padding:15px 17px}
.tour-balao h3{font-size:14px;margin-bottom:6px}
.tour-balao p{font-size:13px;color:var(--ink-2);line-height:1.6;margin:0}
.tour-balao b{color:var(--ink);font-weight:600}
.tour-rodape{display:flex;align-items:center;gap:9px;margin-top:13px}
.tour-passos{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tour-rodape .btn{margin-left:auto}
.tour-inicio{position:fixed;inset:0;z-index:72;display:grid;place-items:center;
  background:rgba(12,20,18,.55)}
.tour-inicio .cx{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;
  padding:22px 26px;max-width:400px;box-shadow:var(--shadow);text-align:center}
.tour-inicio h3{font-size:16px;margin-bottom:7px}
.tour-inicio p{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:15px}
.tour-inicio .acoes{display:flex;gap:9px;justify-content:center}

@media (max-width:1080px){
  .feed{grid-template-columns:1fr;height:auto}
  .feed-list{max-height:380px}
  .split{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto}
  .brand{border-bottom:none;border-right:1px solid var(--line)}
  .nav{flex-direction:row;padding:8px;gap:4px}
  .nav-lbl,.rail-foot{display:none}
  .nav a .tally{display:none}
  .view{padding:14px}
}
</style>

</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="crest">PR</div>
      <div>
        <div class="brand-t">Departamento Jurídico</div>
        <div class="brand-s">Pradópolis · SP</div>
      </div>
    </div>
    <nav class="nav" id="nav">

ao":"4ª Câmara","numero":"0010296-96.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Pauta de julgamento","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/consultaprocessual/pautas#4CAM-2-2026-09-10","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"VALNISON BORGES DE OLIVEIRA","polo":"A"},{"nome":"VALNISON BORGES DE OLIVEIRA","polo":"P"}],"advogados":[{"nome":"ODAIR JOSE BARCELOS DA SILVA","oab":"SP/314524"}],"texto":"PAUTA DE JULGAMENTO\n\nÓrgão julgador: 4ª Câmara\nSessão: Extraordinária Virtual\nData da sessão: 10/09/2026, às 13:00\n\nProcesso: 0010296-96.2025.5.15.0120\nRelator(a): RITA DE CASSIA PENKAL BERNARDINO DE SOUZA\n\nFicam as partes e seus advogados intimados de que o processo acima identificado foi incluído na pauta da sessão de julgamento indicada, podendo ser julgado nesta ou nas sessões subsequentes.\n\nA pauta completa está disponível em: https://pje.trt15.jus.br/consultaprocessual/pautas#4CAM-2-2026-09-10"},{"id":715073020,"data":"2026-09-02","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1502933-16.2022.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1502933-16.2022.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Cuida-se de medida ao alcance da parte exequente e que pode ajustar convênio com aquelas entidades organizadores de bancos de dados ou contratar diretamente a inclusão. O artigo 782 do CPC deve ser reservado às ações judiciais em que a parte não tenha possibilidade de acesso àquelas entidades para inclusão nos bancos de dados de restrição de crédito. Indefiro a inclusão do nome da parte executada nos cadastros de proteção ao crédito, uma vez que não cabe ao Judiciário negativar o nome do devedor. É de se observar que a redação do § 3º do artigo 781 do Código de Processo Civil não deixa dúvidas de que a inclusão do nome do executado em cadastros de inadimplentes é mera faculdade do juiz, não havendo qualquer obrigatoriedade neste sentido. Há precedente do Egrégio TJSP esposando do mesmo entendimento: AGRAVO DE INSTRUMENTO. ESTABELECIMENTO DE ENSINO. AÇÃO MONITÓRIA. DECISÃO QUE INDEFERIU O PEDIDO DE INSCRIÇÃO DO NOME DA EXECUTADA NOS ÓRGÃOS DE PROTEÇÃO AO CRÉDITO VIA SERASAJUD. FACULDADE DO JUIZ. NEGAÇÃO QUE NÃO GERA PREJUÍZO À AGRAVANTE. DECISÃO AGRAVADA MANTIDA. Agravo de instrumento improvido. (...) A inclusão do nome do executado em cadastros de inadimplentes é, de fato, uma possibilidade em fase de cumprimento de sentença trazida pelo §3º do art. 782 do CPC, entretanto, trata-se de uma faculdade e não um dever do juiz, pois o legislador optou por utilizar o verbo poder. Com efeito, verifica-se que o r. Juízo a quo entendeu que a medida pleiteada não prescinde da intervenção do Poder Judiciário e muito bem fundamentou sua decisão no sentido de não efetuar a inclusão do débito via SERASAJUD (TJSP, Agravo de Instrumento nº 2198861- 68.2018.8.26.0000, 34ª Câmara de Direito Privado, Rel. Des. Cristina Zucchi, j. 22.01.2019) Admitir-se de forma indiscriminada que o Poder Judiciário seja intermediário destes serviços o que implica não só a inclusão do nome do devedor, como também sua exclusão, conforme §4º do art. 782 do CPC seria comprometer a própria eficiência da atividade jurisdicional, já sobrecarregada com a existência de incontáveis processos que"},{"id":715405523,"data":"2026-09-02","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000266-92.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 0000266-92.2026.8.26.0222 (processo principal 1000572-78.2025.8.26.0222) - Cumprimento de sentença - Garantias Constitucionais - Clovis Bronzati - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Manifeste(m)-se a(s) parte(s) exequente(s), no prazo de 15 dias, acerca da petição juntada pela parte adversa. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP)"},{"id":715414198,"data":"2026-09-02","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial - UPJ do Colégio Recursal dos Juizados Especiais do Estado de São Paulo - Distribuídos","numero":"1000109-05.2026.8.26.0222","classe":"RECURSO INOMINADO CíVEL","tipo":"Intimação","documento":"Distribuídos","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADóPOLIS","polo":"A"},{"nome":"TALITA FRANKLIN SAMPAIO DE SOUZA","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"PROCESSOS DISTRIBUÍDOS EM 01/09/2026\r\n\r\n1000109-05.2026.8.26.0222; Processo Digital; Recurso Inominado Cível; 2ª Turma Recursal de Fazenda Pública; LÚCIA CANINÉO CAMPANHÃ - COLÉGIO RECURSAL; Fórum de Guariba; Juizado Especial Cível e Criminal; Petição Cível; 1000109-05.2026.8.26.0222; Diárias e Outras Indenizações; Recorrente: Prefeitura Municipal de Pradópolis; Advogado: Wesley Luiz Alves de Paula (OAB: 274238/SP); Recorrida: Talita Franklin Sampaio de Souza; Advogado: Daniel de Souza Silva (OAB: 297740/SP); Pelo presente, FICAM AS PARTES INTIMADAS ACERCA DA DISTRIBUIÇÃO."},{"id":715760212,"data":"2026-09-02","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1501174-56.2018.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1501174-56.2018.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Cumpra-se o v. Acórdão, que reformou a sentença de fls.131-133. Manifeste-se a parte exequente em termos de prosseguimento do feito, no prazo de 15 dias. Intimem-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":715760232,"data":"2026-09-02","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1001257-22.2024.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ELIANA CHRISTINA DA ROCHA RODRIGUES","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"}],"texto":"Processo 1001257-22.2024.8.26.0222 - Procedimento Comum Cível - Equivalência salarial - Eliana Christina da Rocha Rodrigues - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. 1. Cumpra-se o v. acórdão. 2. Requeiram as partes o que de direito, no prazo de 15 dias. 3. Eventual cumprimento de sentença, deverá ser cumprido o disposto no Provimento CG nº 16/2016 e Comunicado CG nº 438/2016. Vale lembrar que uma vez cadastrado o cumprimento de sentença, não mais será necessário fazê-lo, bastando endereçar as futuras petições intermediárias ao número do incidente já protocolizado. 4. Oportunamente, arquivem-se os autos, lançando-se a movimentação pertinente no sistema SAJ. Intime-se a Fazenda Pública pelo portal eletrônico. Intimem-se. - ADV: CLOVIS BRONZATI (OAB 279195/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP)"},{"id":715760248,"data":"2026-09-02","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"0000470-39.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"ALDAIR CANDIDO DE SOUZA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0000470-39.2026.8.26.0222 (processo principal 1000475-20.2021.8.26.0222) - Cumprimento de sentença - Defeito, nulidade ou anulação - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Aldair Candido de Souza - Assim, JULGO EXTINTO o presente incidente com fundamento no art. 924, inciso II, do CPC. Apresente a parte exequente, no prazo de 05 dias, formulário MLE, devidamente preenchido, disponibilizado no site do TJSP. Após, expeça-se MLE em favor da parte exequente, no valor de R$ 4.123,94, corrigidos até a data do levantamento.. Considerando que o presente foi distribuído após 03.01.2024 (Comunicado Conjunto nº 951/2023), recolha a parte executada a taxa judiciária, no prazo de 60 dias, observando-se o disposto no art. 4º, IV, da Lei nº 11.608/03, com redação dada pela Lei nº 17.785/23, sob pena de inscrição em dívida ativa. Na inércia, expeça-se a CDA. Cumpra a z. serventia o art. 1.098 das NSCGJ, certificando-se nos autos. Após, arquivem-se os autos, lançando-se a movimentação pertinente no sistema SAJ/PG5. Intime-se o ente público pelo portal eletrônico. P. I. C. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), ALDAIR CANDIDO DE SOUZA (OAB 201321/SP)"},{"id":716017859,"data":"2026-09-02","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial - UPJ do Colégio Recursal dos Juizados Especiais do Estado de São Paulo","numero":"1002580-28.2025.8.26.0222","classe":"RECURSO INOMINADO CíVEL","tipo":"Intimação","documento":"Intimação de acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MARCELA ORNELLAS DE AMEIDA RAMOS","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"}],"texto":"INTIMAÇÃO DE ACÓRDÃO\r\n\r\nNº 1002580-28.2025.8.26.0222 - Processo Digital - Recurso Inominado Cível - Guariba - Recorrente: Prefeitura Municipal de Pradópolis - Recorrida: Marcela Ornellas de Ameida Ramos - Magistrado(a) Isabel Cristina Alonso Bezerra Zara - Colégio Recursal - Negaram provimento ao recurso, por V. U. - RECURSO INOMINADO. DIREITO ADMINISTRATIVO. COMARCA DE GUARIBA. SERVIDORA PÚBLICA MUNICIPAL CELETISTA. PROFESSORA DE EDUCAÇÃO BÁSICA II. RECEBIMENTO DA CARGA SUPLEMENTAR. SENTENÇA DE PROCEDÊNCIA MANTIDA.I. CASO EM EXAME(1) AÇÃO DECLARATÓRIA, COM PEDIDO DE RESTITUIÇÃO DE VALORES, PARA RECEBIMENTO DA VERBA “CARGA SUPLEMENTAR”, NOS TERMOS DA LCM Nº 83/2001.II. QUESTÃO EM DISCUSSÃO (2) A QUESTÃO EM DISCUSSÃO CONSISTE EM DEFINIR (I) COMPETÊNCIA DA JUSTIÇA COMUM PARA A MATÉRIA; E (II) SER OU NÃO POSSÍVEL O PAGAMENTO DA VERBA PLEITEADA AOS DOCENTES QUE EXERCERAM CARGA HORÁRIA SUPLEMENTAR NO MUNICÍPIO DE PRADÓPOLIS.III. RAZÕES DE DECIDIR E TESE(3) REJEITADA A PRELIMINAR DE INCOMPETÊNCIA ABSOLUTA. EXEGESE DO TEMA 1143 DO C. STF. A JUSTIÇA COMUM É COMPETENTE PARA JULGAR AÇÃO AJUIZADA POR SERVIDOR CELETISTA CONTRA O PODER PÚBLICO, EM QUE SE PLEITEIA PARCELA DE NATUREZA ADMINISTRATIVA. (4) A LEI COMPLEMENTAR MUNICIPAL Nº 83/2001 INSTITUIU O PLANO DE CARREIRA E A REMUNERAÇÃO DO MAGISTÉRIO PÚBLICO MUNICIPAL E DISPÔS A JORNADA DE TRABALHO DOS PROFESSORES DE EDUCAÇÃO BÁSICA II. (5) OS DOCENTES QUE ULTRAPASSAREM A JORNADA DE TRINTA HORAS SEMANAIS TERÃO DIREITO À RETRIBUIÇÃO PECUNIÁRIA POR HORA PRESTADA A TÍTULO DE CARGA SUPLEMENTAR DE TRABALHO DOCENTE, OU DO OCUPANTE DE FUNÇÃO ATIVIDADE, POR HORA DA CARGA HORÁRIA, CORRESPONDENTE A 1/100 (UM CEM AVOS) DO VALOR FIXADO PARA A JORNADA INICIAL DE TRABALHO DOCENTE DA ESCALA DE VENCIMENTOS CLASSE DOCENTE, DE ACORDO COM O NÍVEL EM QUE ESTIVER ENQUADRADO O SERVIDOR. NO DIAPASÃO: “DIREITO ADMINISTRATIVO. RECURSO INOMINADO. SERVIDOR PÚBLICO MUNICIPAL. PROFESSOR DE EDUCAÇÃO BÁSICA II. REGIME CELETISTA. PRETENSÃO DE CONDENAÇÃO DO MUNICÍPIO DE PRADÓPOLIS AO PAGAMENTO DAS DIFERENÇAS REMUNERATÓRIAS DECORRENTES DO EXERCÍCIO DE CARGA SUPLEMENTAR ENTRE 2018 E 2023, COM REFLEXOS NO 13º SALÁRIO, FÉRIAS E FGTS. POSSIBILIDADE. PRELIMINAR D"},{"id":713869461,"data":"2026-09-01","tribunal":"TRT15","orgao":"9ª Câmara","numero":"0010684-96.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Pauta de julgamento","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/consultaprocessual/pautas#9CAM-2-2026-09-09","partes":[{"nome":"GABRIELA FERNANDA MARONESI MARCOLINO","polo":"A"},{"nome":"GABRIELA FERNANDA MARONESI MARCOLINO","polo":"P"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"}],"texto":"PAUTA DE JULGAMENTO\n\nÓrgão julgador: 9ª Câmara\nSessão: Extraordinária Telepresencial\nData da sessão: 09/09/2026, às 10:30\n\nProcesso: 0010684-96.2025.5.15.0120\nRelator(a): JOSE PEDRO DE CAMARGO RODRIGUES DE SOUZA\n\nFicam as partes e seus advogados intimados de que o processo acima identificado foi incluído na pauta da sessão de julgamento indicada, podendo ser julgado nesta ou nas sessões subsequentes.\n\nA pauta completa está disponível em: https://pje.trt15.jus.br/consultaprocessual/pautas#9CAM-2-2026-09-09"},{"id":713417650,"data":"2026-09-01","tribunal":"TJSP","orgao":"Distribuição de Feitos me":"JOSE EDUARDO BUSCARDI COSTANTINI","polo":"A"},{"nome":"MARCIA FERREIRA DOS SANTOS","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"},{"nome":"VITORIA MANTOAN PADILHA","polo":"A"}],"advogados":[{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO LIQ2 - ARARAQUARA PROCESSO: ATOrd 0011081-97.2021.5.15.0120 AUTOR: JOEDSON CIRILO DA SILVA RÉU: MUNICIPIO DE PRADOPOLIS Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL   Considerando que o patrono do reclamante indicou conta bancária de titularidade de sociedade de advogados para fins de liberação dos créditos, faz-se necessária a observância do art. 15, §3º, da Lei 8.906/94 (Estatuto da OAB), bem como do art. 105, §3º, do CPC, os quais estabelecem que a procuração deve conter o nome da sociedade de advogados, seu número de registro na OAB e o endereço completo. Isto posto, concedo o prazo de 5 dias para regularização da representação processual, a fim de que os valores possam ser liberados na conta de titularidade da sociedade de advogados. Alternativamente, poderão ser indicados os dados bancários da pessoa física do advogado, para que os créditos possam ser liberados em seu favor. Intime-se. .\n\nIntimado(s) / Citado(s)\n - JOEDSON CIRILO DA SILVA"},{"id":714469145,"data":"2026-09-01","tribunal":"TRT15","orgao":"2ª Câmara","numero":"0011040-73.2025.5.15.0029","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26083118350504500000157720377?instancia=2","partes":[{"nome":"MARCOS ADRIEL LIMA CARDOSO","polo":"A"},{"nome":"MARCOS ADRIEL LIMA CARDOSO","polo":"P"},{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"MUNICIP /SP); Advogado: Gilberto Fagundes de Oliveira (OAB: 325606/SP); Advogado: Clovis Bronzati (OAB: 279195/SP)"},{"id":713756091,"data":"2026-09-01","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1001695-14.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"IGOR SOUZA PINA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"FABIO EDUARDO DE LAURENTIZ","oab":"SP/170930"},{"nome":"VICTÓRIA VITTI DE LAURENTIZ","oab":"SP/393965"}],"texto":"Processo 1001695-14.2025.8.26.0222 - Procedimento Comum Cível - Responsabilidade do Fornecedor - Igor Souza Pina - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - reitero o teor da decisão de f. 235-238: \"Trata-se de ação de indenização por danos materiais e morais proposta por Igor Souza Pina em face do Departamento de Estradas de Rodagem do Estado de São Paulo - DER/SP e do Município de Pradópolis.Alega o autor que, em 13 de março de 2025, trafegava com sua motocicleta pela Rodovia Mário Donegá (SP-291), quando foi atingido por caminhão que perdeu o controle da direção, invadiu a pista contrária e colidiu frontalmente com seu veículo.Sustenta que a perda de controle do caminhão decorreu da existência de óleo derramado sobre a pista de rolamento, circunstância que teria sido previamente comunicada aos órgãos públicos responsáveis, sem que fossem adotadas providências para sinalização, limpeza ou interdição do local.Afirma que, em decorrência do acidente, sofreu amputação transtibial do membro inferior esquerdo, passando a suportar danos materiais, morais, estéticos e existenciais, além de redução permanente de sua capacidade laborativa, postulando, ainda, pensionamento mensal, nos termos do artigo 950 do Código Civil.Em contestação (fls. 131/143), o DER/SP sustentou que sua responsabilidade, na hipótese, é subjetiva, fundada na demonstração de falta do serviço. No mérito, alegou ausência de comprovação da existência de óleo sobre a pista, afirmando que o acidente decorreu exclusivamente da perda de dirigibilidade do caminhão em razão da pista molhada pelas chuvas, circunstância apta a afastar o nexo causal e a responsabilidade da autarquia. Impugnou, ainda, os danos alegados e o pedido de pensionamento.O Município de Pradópolis contestou às fls. 144/167 e suscitou preliminar de ilegitimidade passiva, sustentando que o acidente ocorreu em rodovia estadual submetida à administração exclusiva do DER/SP. No mérito, pugnou pela improcedência dos pedidos, alegando ausência de omissão específica, inexistência de nexo causal e culpa exclusiva de terceiro.Houve réplica (fls. 171/180).As partes especificaram provas.Passo ao saneamento.MANTENHO a gratuidade da justiça anteri"},{"id":713830505,"data":"2026-09-01","tribunal":"TJSP","orgao":"Distribuição de Direito Público, Câm. Espec. e Meio Amb. - Rua dos Sorocabanos, 608 - Sala 02 - Ipiranga","numero":"1002320-48.2025.8.26.0222","classe":"APELAçãO CíVEL","tipo":"Intimação","documento":"Distribuídos","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MARIA DE FáTIMA ALMEIDA ZEQUIM","polo":"A"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"PROCESSOS DISTRIBUÍDOS EM 31/08/2026\r\n\r\n1002320-48.2025.8.26.0222; Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011; Apelação Cível; 10ª Câmara de Direito Público; MARTIN VARGAS; Foro de Guariba; 2° Vara Judicial; Procedimento Comum Cível; 1002320-48.2025.8.26.0222; Reajustes de Remuneração, Proventos ou Pensão; Apelante: Maria de Fátima Almeida Zequim (Justiça Gratuita); Advogado: Daniel de Souza Silva (OAB: 297740/SP); Apelado: Município de Pradópolis; Advogado: Wesley Luiz Alves de Paula (OAB: 274238/SP) (Procurador);"},{"id":713844477,"data":"2026-09-01","tribunal":"TJSP","orgao":"Processamento 7º Grupo - 14ª Câmara Direito Público - Praça Almeida Jr., 72 - 1º andar, sala 12","numero":"1502967-88.2022.8.26.0222","classe":"APELAçãO CíVEL","tipo":"Intimação","documento":"Despacho","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"JOSE DONARIO DIAS","polo":"P"},{"nome":"MUNICíPIO DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"DESPACHO\r\n\r\nNº 1502967-88.2022.8.26.0222 - Processo Digital. Petições para juntada devem ser apresentadas exclusivamente por meio eletrônico, nos termos do artigo 7º da Res. 551/2011 - Apelação Cível - Guariba - Apelante: Município de Pradópolis - Apelado: Jose Donario Dias - Apelação Cível Processo nº 1502967-88.2022.8.26.0222 Relator(a): MARCOS PIMENTEL TAMASSIA Órgão Julgador: 14ª Câmara de Direito Público SESSÃO DE JULGAMENTO NA MODALIDADE VIRTUAL - RESOLUÇÃO CNJ 591/24 Data da pauta: 14/09/2026 às 00:01 Número da pauta: 772 Íntegra da pauta de julgamento: https://esaj.tjsp.jus.br/pauta-julgamento-virtual Torno público, nos termos da Resolução n.º 984/2025, que regulamenta o julgamento eletrônico no âmbito do Tribunal de Justiça do Estado de São Paulo, por meio do sistema SAJ e, em conformidade com a Resolução CNJ n.º 591/2024, que os presentes autos serão julgados eletronicamente em sessão virtual. Eventuais pedidos de DESTAQUE (oposição ao julgamento virtual), deverão ser feitos, por meio eletrônico, no portal do ESAJ (https://esaj.tjsp.jus.br/pauta-julgamento-virtual) (Selecione o Órgão julgador e em seguida a data da sessão virtual e clique em \"consultar\"> localize o processo na pauta e clique em \"acompanhar julgamento\"> na parte inferior estará habilitado o pedido de \"destaque\" e \"esclarecimento\"), até 48 (quarenta e oito) horas antes do início da sessão e deferido pelo(a) Relator(a). NOTA: DESTAQUES DEFERIDOS NÃO DISPENSAM AS PARTES DE REALIZAR INSCRIÇÃO PARA PREFERÊNCIA SIMPLES OU SUSTENTAÇÃO ORAL, PERMANECENDO OBRIGATÓRIA A REALIZAÇÃO DE INSCRIÇÃO PELAS PARTES NA SESSÃO QUE VIER A SER DESIGNADA. Nas hipóteses de cabimento de SUSTENTAÇÃO ORAL, é facultado o seu envio por meio eletrônico, no próprio processo, não sendo aceito outro meio, após a publicação da pauta e até 48 (quarenta e oito) horas antes de iniciado o julgamento em ambiente virtual, conforme manual de peticionamento no site: https://www.tjsp.jus.br/Download/PeticionamentoEletronico/Manual_PETIC_ELETRONICO_SAJSG_Julg_Virtual.Pdf MEMORIAIS deverão ser encaminhados, exclusivamente, para os e-mails institucionais dos gabinetes disponíveis em: https://www.tjsp.jus.br/CanaisComunicacao/EmailsI"},{"id":714156826,"data":"2026-09-01","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"1001695-14.2025.8.26.0222","classe":"PROCEDIMENTO COMUM CíVEL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"IGOR SOUZA PINA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"FABIO EDUARDO DE LAURENTIZ","oab":"SP/170930"},{"nome":"VICTÓRIA VITTI DE LAURENTIZ","oab":"SP/393965"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 1001695-14.2025.8.26.0222 - Procedimento Comum Cível - Responsabilidade do Fornecedor - Igor Souza Pina - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - F. 243-244. Considerando haver a indicação de testemunhas, com endereços físicos e pedido de intimação por esse juízo, intimem-se as testemunhas residentes nessa Comarca, por mandado a ser cumprido em caráter de urgência, para comparecerem pessoalmente à sala de audiências da 1ª Vara Judicial da Comarca de Guariba, situada na Rua Feres Sadala, nº 761, Centro, Guariba/SP, no dia 09 de setembro de 2026, às 16h, a fim de prestarem depoimentos, em audiência de instrução e julgamento designada nos presentes autos. Com relação à testemunha que reside na Comarca de Serrana-SP, com urgência, comunique-se e solicite à Administração daquele juízo disponibilização para uso de sala passiva no dia e horário da audiência, para a testemunha. Encaminhe-se por e-mail o link devido. Expeça-se mandado, a ser cumprido em caráter de urgência, para intimação da testemunha. Considerando a necessidade de viabilizar a participação da testemunha no ato por videoconferência, deverá o Oficial de Justiça, quando do cumprimento da diligência, solicitar e certificar nos autos número de telefone celular com aplicativo WhatsApp para envio do respectivo link de acesso. Caso a pessoa intimada informe não possuir habilidade para utilização de telefone celular, acesso à internet ou condições técnicas para participação remota, deverá ser orientada a comparecer ao Fórum de sua Comarca de residência, a fim de participar do ato por intermédio da sala passiva disponibilizada pela unidade judiciária local. Cientifiquem-se, as testemunhas, de que seus comparecimentos são obrigatórios, devendo portarem documento oficial de identificação com foto, ficando advertidas das consequências legais decorrentes de não comparecimentos injustificados. F. 248 e 249. Considerando que a testemunha Fábio Conrado Moraes, qualificada como Diretor do Departamento de Trânsito e Transportes do Município de Pradópolis, foi arrolada pela própria parte, sirva a presente decisão como ofício de requisição, ficando a cargo exclusivo da parte arrolante a adoção de todas as pro"},{"id":714555578,"data":"2026-09-01","tribunal":"TJSP","orgao":"Foro de Guariba - 2° Vara Judicial","numero":"1500082-62.2026.8.26.0222","classe":"EXECUçãO FISCAL","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"A"}],"advogados":[{"nome":"LAIZA SOARES DONATO","oab":"MG/130719"}],"texto":"Processo 1500082-62.2026.8.26.0222 - Execução Fiscal - Dívida Ativa - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. Defiro o requerimento da parte exequente e determino a pesquisa de veículos em nome da(s) parte(s) executada(s), via RENAJUD. Em caso positivo, determino, desde já, a restrição de transferência daqueles que forem encontrados sem qualquer tipo de restrição. Com a resposta positiva, manifeste-se a parte exequente, no prazo de 05 (cinco) dias, requerendo e providenciando o necessário para a penhora. Intime-se. - ADV: LAIZA SOARES DONATO (OAB 130719/MG)"},{"id":711673532,"data":"2026-08-31","tribunal":"TRT15","orgao":"Gabinete da Desembargadora Dora Rossi Goes Sanches - 14ª Câmara","numero":"0011032-17.2025.5.15.0120","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Lista de distribuição","documento":"Distribuição","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/visualizacao/26082800300183200000157500491?instancia=2","partes":[{"nome":"MARCELLO TEIXEIRA CASTIGLIA","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"SUELI RODRIGUES DE OLIVEIRA","polo":"P"}],"advogados":[{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"}],"texto":"Processo 0011032-17.2025.5.15.0120 distribuído para 14ª Câmara - Gabinete da Desembargadora Dora Rossi Goes Sanches - 14ª Câmara na data 27/08/2026 \n Para maiores informações, clique no link a seguir: https://pje.trt15.jus.br/pjekz/visualizacao/26082800300183200000157500491?instancia=2"},{"id":712737897,"data":"2026-08-31","tribunal":"TST","orgao":"Subseção II Especializada em Dissídios Individuais","numero":"0052260-12.2023.5.15.0000","classe":"RECURSO ORDINáRIO TRABALHISTA","tipo":"Intimação","documento":"Pauta de Julgamento","meio":"Diário de Justiça Eletrônico Nacional","link":"https://sessao-integracao-backend.prd.rede.tst/documentos/PJe--2960/52260-12.2023.5.15.0000/certidao-inclusao-pauta/MzEvMDgvMjAyNiAwMDowMDowMCMtMjgwMDU2MTg=","partes":[{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"SUELI RODRIGUES DE OLIVEIRA","polo":"P"}],"advogados":[{"nome":"ADEMILSON PEREIRA RIBEIRO","oab":"SP/520340"},{"nome":"PAULO SERGIO MOREIRA DA SILVA","oab":"SP/165937"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Pauta de Julgamento (processos PJe) da Sessão Ordinária da Subseção II Especializada em Dissídios Individuais, a realizar-se no dia 22/9/2026, às 9h00, na modalidade presencial.\n\n1. Da sessão presencial:\n\n1.1. Prazo para inscrição presencial: Relativamente aos processos incluídos na pauta da sessão presencial deverá ser realizada até a hora prevista para o início da sessão (art. 157, caput, do RITST).\n\n1.2. Prazo para inscrição telepresencial: é permitida a participação na sessão presencial, por meio de videoconferência, de advogado com domicílio profissional fora do Distrito Federal, desde que a requeira até o dia anterior ao da sessão, nos termos do art. 937, § 4º, do CPC. Para esse meio de participação, o advogado devidamente inscrito deverá acessar o sistema Zoom, por meio do endereço https://tst-jus-br.zoom.us/my/sesdi2. Somente será admitido o ingresso de advogados previamente inscritos.\n\n\n\nRequerimento: o pedido deverá ser realizado por meio do endereço https://www.tst.jus.br/portal-da-advocacia.\n\nAlém dos processos constantes da presente pauta, poderão ser julgados na Sessão Ordinária da Subseção II Especializada em Dissídios Individuais processos com tramitação no sistema e-SIJ constantes de pauta específica.\n\nProcesso ROT - 52260-12.2023.5.15.0000 incluído na SESSÃO PRESENCIAL.\nRelator: MINISTRO AMAURY RODRIGUES PINTO JUNIOR.\n\nADRIANA MEDEIROS\nSecretária da Subseção II Especializada em Dissídios Individuais."},{"id":712817807,"data":"2026-08-31","tribunal":"TST","orgao":"3ª Turma","numero":"0011297-69.2023.5.15.0029","classe":"AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA","tipo":"Intimação","documento":"DECISÃO MONOCRÁTICA","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.tst.jus.br/pjekz/validacao/26082820074259300000201310232?instancia=3","partes":[{"nome":"MINISTÉRIO PÚBLICO DO TRABALHO","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"A"},{"nome":"VITORIA LUANA LIMA SILVA","polo":"P"}],"advogados":[{"nome":"JOSE ANTONIO FUNNICHELI","oab":"SP/79077"},{"nome":"FERNANDO SCUARCINA","oab":"SP/183555"},{"nome":"GABRIEL FUNICHELLO","oab":"SP/443995"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL SUPERIOR DO TRABALHO 3ª TURMA Relator: JOÃO PEDRO SILVESTRIN AIRR 0011297-69.2023.5.15.0029 AGRAVANTE: MUNICIPIO DE PRADOPOLIS AGRAVADO: VITORIA LUANA LIMA SILVA A secretaria do(a) 3ª Turma intima as partes do processo para tomarem ciência da decisão de id (fb7cfbd) proferida nos autos do processo 0011297-69.2023.5.15.0029 cujo conteúdo, conforme previsão do inciso I, art. 13, da Resolução nº 455/2018 do CNJ e do § 3º, art. 205, do CPC/2015, está transcrito a seguir: Poder Judiciário Justiça do Trabalho Tribunal Superior do Trabalho PROCESSO Nº TST-AIRR - 0011297-69.2023.5.15.0029 AGRAVANTE: MUNICIPIO DE PRADOPOLIS AGRAVADA: VITORIA LUANA LIMA SILVA ADVOGADO: Dr. JOSE ANTONIO FUNNICHELI ADVOGADO: Dr. GABRIEL FUNICHELLO ADVOGADO: Dr. FERNANDO SCUARCINA CUSTOS LEGIS: MINISTÉRIO PÚBLICO DO TRABALHO GDCJPS/Lm/Cv* D E C I S Ã O 1. RELATÓRIO Trata-se de agravo de instrumento interposto à decisão que denegou seguimento ao recurso de revista do ente público quanto ao tema “responsabilidade subsidiária”. Contraminuta às fls. 549/573. A Procuradoria-Geral do Trabalho apresentou manifestação, às fls. 584/585. É o relatório. 2. FUNDAMENTAÇÃO 2.1. AGRAVO DE INSTRUMENTO EM RECURSO DE REVISTA Satisfeitos os pressupostos de admissibilidade recursal, conheço do agravo de instrumento. RESPONSABILIDADE SUBSIDIÁRIA. ENTE PÚBLICO. ADICIONAL DE INSALUBRIDADE. TEMAS 246 E 1.118 DA TABELA DE REPERCUSSÃO GERAL DO STF. Quanto ao tema, a Corte de origem manteve a responsabilidade subsidiária do ente público. À referida decisão a parte recorrente interpôs recurso de revista postulando a revisão do julgado quanto à responsabilidade subsidiária que lhe foi atribuída, sob a alegação de afronta aos arts. 37, II, §2ºe 61,§1º, II, da CF, 8º, da CLT, 71, § 1º, da Lei nº 8.666/93 e de contrariedade à Súmula nº 331, do TST (fls. 442/454) Em análise perfunctória, verifica-se a aparente dissonância da decisão regional com as teses de repercussão geral firmadas pelo STF no julgamento do RE nº 760.931 (Tema 246) e do RE nº 1.298.647 (Tema 1.118), a configurar a transcendência política da causa e a violação do art. 71, § 1º, da Lei nº 8.666/93. Pelo exposto,"},{"id":712524779,"data":"2026-08-31","tribunal":"TRT15","orgao":"CON2 - Araraquara","numero":"0010734-25.2025.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082816335768000000305829153?instancia=1","partes":[{"nome":"MARILZA APARECIDA DIAS ROSSI","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON2 - ARARAQUARA ATOrd 0010734-25.2025.5.15.0120 AUTOR: MARILZA APARECIDA DIAS ROSSI RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência da Decisão ID 7720cca proferida nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL DECISÃO Pressupostos extrínsecos: O recurso interposto pelo(a) reclamante é tempestivo. Regular a representação. Pressupostos intrínsecos: Todas as matérias debatidas preenchem o requisito de admissibilidade. Apresentem os recorridos contrarrazões no prazo legal e, após, remetam-se os autos ao segun ão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"VIVIANE CRISTINA BRONZATI","oab":"SP/444669"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 1000467-67.2026.8.26.0222 - Mandado de Segurança Cível - Garantias Constitucionais - Clovis Bronzati - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - F. 59 e seguintes: defiro. Intime-se a autoridade coatora, para que, no prazo de 48 horas, junte aos autos cópia integral do procedimento administrativo nº 8.945/2026, especialmente a resposta encaminhada ao requerente, a guia ou demonstrativo de cálculo dos custos de reprodução das cópias, os comprovantes da ciência do impetrante acerca dessa exigência e os documentos que evidenciem o alegado agendamento de vista dos autos para o dia 17.07.2026, bem como eventual comunicação de tal ato ao interessado. Após, manifeste-se o impetrante no prazo de dez dias e tornem ao Ministério Público. Int. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), VIVIANE CRISTINA BRONZATI (OAB 444669/SP)"},{"id":710608770,"data":"2026-08-28","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"0001240-66.2025.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0001240-66.2025.8.26.0222 (processo principal 1003212-25.2023.8.26.0222) - Cumprimento de sentença - Garantias Constitucionais - Clovis Bronzati - PREFEITURA MUNICIPAL DE PRADÓPOLIS e outro - Cuida-se de embargos de declaração opostos por Clóvis Bronzatti (fls. 67/75) em relação à decisão proferida às fls. 63/64, que determinou o cancelamento da distribuição do incidente com fulcro no art. 290 do Código de Processo Civil, ante o decurso do prazo sem o recolhimento das taxas devidas e sem a emenda determinada às fls. 54/55. Conheço dos embargos declaratórios, porquanto tempestivos, para, no mérito, rejeitá-los por não vislumbrar qualquer vício apto a ensejar sua procedência. Analisando a decisão publicada, não vislumbro os defeitos apontados, aptos a impedir a exata compreensão e alcance da manifestação judicial, nos moldes do art. 1.022 do Código de Processo Civil. A questão relativa ao indeferimento do cadastro de outros patronos já havia sido expressamente fundamentada pelo Juízo às fls. 47, tendo em vista que a atuação se dá em causa própria e desacompanhada de instrumento de mandato, sendo a intimação direcionada ao advogado postulante plenamente válida (fls. 50, 57, 61 e 66). Outrossim, o comando de fls. 54/55 determinou com clareza a necessidade de emenda para cisão dos ritos incompatíveis e o recolhimento da taxa judiciária de início da fase executiva, determinação que restou desatendida no prazo legal (fls. 62), ensejando a aplicação do art. 290 do Código de Processo Civil e da legislação de custas correlata (fls. 63/64). Pretende o embargante, na realidade, a modificação do entendimento externado pelo magistrado, o que só é possível em sede de recurso cabível. Com efeito, os efeitos infringentes nos aclaratórios somente devem ser admitidos excepcionalmente quando existentes as respectivas hipóteses de cabimento, o que não é o caso da hipótese presente. Se o embargante não concorda com a fundamentação expendida na decisão embargada, afinal, as decisões judiciais nem sempre satisfazem os interesses daqueles que procuram o Judiciário, e já que a questão não comporta solução pela via estreita e bem definida dos embargos de declaração, deve a irresi"},{"id":710608771,"data":"2026-08-28","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"0000032-13.2026.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"},{"nome":"RJM HOLDING EMPREENDIMENTOS E PARTICIPAçõES LTDA","polo":"A"}],"advogados":[{"nome":"JACI ALVES RIBEIRO","oab":"SP/200451"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0000032-13.2026.8.26.0222 (processo principal 1000651-91.2024.8.26.0222) - Cumprimento de sentença - Garantias Constitucionais - Rjm Holding Empreendimentos e Participações Ltda - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Homologo os cálculos apresentados pelo exequente (f. 20), para que produzam os legais efeitos de direito, observando-se a anuência da parte contrária (f. 25). Escoado o prazo para recurso, certifique-se o trânsito em julgado. Por fim, ao vencedor cumpre pontuar que em se tratando de incidente de cumprimento de sentença contra Fazenda Pública, no âmbito da Justiça Comum Estadual, nenhum pagamento deverá ser mais realizado neste feito. Em face do Comunicado nº 394/2015 (SEMA), a partir de 2/7/2015, o processamento das requisições de Precatório e RPV somente serão admitidas no formato digital, tanto para processos físicos como digitais. Atentem-se os peticionários credores para as orientações constantes da Portaria 9.816/2019 e Comunicado Conjunto 1212/2018, ambos da Secretaria da Presidência do E. Tribunal de Justiça, bem como do Comunicado Conjunto 1323/2018 da Secretaria de Primeira Instância e Comunicado Conjunto nº2240/219 DJE de 18 de novembro de 2019). Destarte, providenciem-se estes o peticionamento eletrônico para requisição dos RPV(s) e/ou PRECATÓRIO, como incidente processual, através do Portal e-SAJ, petição intermediária, requisitório de pequeno valor (classe 1266) ou precatório (classe 1265), categoria incidente processual, com o devido preenchimento dos dados, anexando as principais peças abaixo mencionadas, informando nestes autos o número do incidente. Em caso simultâneo de RPV e Precatório, deverão ser formados dois procedimentos. Com fulcro no art. 1.000, parágrafo único do CPC, ausente interesse recursal, o trânsito em julgado se dará de imediato nesta data, valendo a presente como certidão. Fixo o prazo de 15 dias para criação dos incidentes pelo patrono(a)(s) do(a)(s) credor(a)(es), findo os quais arquivem-se os autos. Int. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), JACI ALVES RIBEIRO (OAB 200451/SP)"},{"id":710608777,"data":"2026-08-28","tribunal":"TJSP","orgao":"Foro de Guariba - 1ª Vara Judicial","numero":"0001836-50.2025.8.26.0222","classe":"CUMPRIMENTO DE SENTENçA","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CLOVIS BRONZATI","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"}],"texto":"Processo 0001836-50.2025.8.26.0222 (processo principal 1003212-25.2023.8.26.0222) - Cumprimento de sentença - Garantias Constitucionais - Clovis Bronzati - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Homologo os cálculos apresentados pelo exequente/executado (f. 01/09), para que produzam os legais efeitos de direito, observando-se a anuência da parte contrária (f. 62). Escoado o prazo para recurso, certifique-se o trânsito em julgado. Por fim, ao vencedor cumpre pontuar que em se tratando de incidente de cumprimento de sentença contra Fazenda Pública, no âmbito da Justiça Comum Estadual, nenhum pagamento deverá ser mais realizado neste feito. Em face do Comunicado nº 394/2015 (SEMA), a partir de 2/7/2015, o processamento das requisições de Precatório e RPV somente serão admitidas no formato digital, tanto para processos físicos como digitais. Atentem-se os peticionários credores para as orientações constantes da Portaria 9.816/2019 e Comunicado Conjunto 1212/2018, ambos da Secretaria da Presidência do E. Tribunal de Justiça, bem como do Comunicado Conjunto 1323/2018 da Secretaria de Primeira Instância e Comunicado Conjunto nº2240/219 DJE de 18 de novembro de 2019). Destarte, providenciem-se estes o peticionamento eletrônico para requisição dos RPV(s) e/ou PRECATÓRIO, como incidente processual, através do Portal e-SAJ, petição intermediária, requisitório de pequeno valor (classe 1266) ou precatório (classe 1265), categoria incidente processual, com o devido preenchimento dos dados, anexando as principais peças abaixo mencionadas, informando nestes autos o número do incidente. Em caso simultâneo de RPV e Precatório, deverão ser formados dois procedimentos. Com fulcro no art. 1.000, parágrafo único do CPC, ausente interesse recursal, o trânsito em julgado se dará de imediato nesta data, valendo a presente como certidão. Fixo o prazo de 15 dias para criação dos incidentes pelo patrono(a)(s) do(a)(s) credor(a)(es), findo os quais arquivem-se os autos. Int. - ADV: WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP)"},{"id":710797559,"data":"2026-08-28","tribunal":"TJSP","orgao":"Foro de Guariba - Juizado Especial  Cível e Criminal","numero":"1000068-38.2026.8.26.0222","classe":"Procedimento do Juizado Especial da Fazenda Pública","tipo":"Intimação","documento":"Intimação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"G FARIA EMPREENDIMENTOS ADMINISTRACAO E PARTICIPACOES LTDA","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"TONY RAFAEL BICHARA","oab":"SP/239949"},{"n p.jus.br","partes":[{"nome":"MARIA REGILDA REGO VIEIRA DOS SANTOS","polo":"A"},{"nome":"PREFEITURA MUNICIPAL DE PRADÓPOLIS","polo":"P"}],"advogados":[{"nome":"GILBERTO FAGUNDES DE OLIVEIRA","oab":"SP/325606"},{"nome":"CLOVIS BRONZATI","oab":"SP/279195"},{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"}],"texto":"Processo 0000849-77.2026.8.26.0222 (processo principal 1001261-59.2024.8.26.0222) - Cumprimento de sentença - Limite de Carga Horária - Jornada Semanal - Maria Regilda Rego Vieira dos Santos - PREFEITURA MUNICIPAL DE PRADÓPOLIS - Vistos. 1. A interpretação sistemática da Lei Estadual nº 11.608/03 evidencia que, sendo o ente público isento da taxa judiciária, não se justifica exigir recolhimento antecipado pela parte exequente não beneficiária da justiça gratuita, pois isso acarretaria ressarcimento posterior incompatível com a lógica da sucumbência e com a própria isenção legal. Assim, é descabida a exigência de recolhimento na fase de execução. 2. Considerando a natureza ilíquida do título judicial transitado em julgado, o percentual referente aos honorários advocatícios sucumbenciais será definido após a consolidação do débito principal. 3. Preenchidos os requisitos do art. 534 do CPC, recebo o pedido de cumprimento de sentença. Intime-se, via portal eletrônico, a Fazenda Pública para que apresente, nos próprios autos, impugnação sobre o valor principal, no prazo de 30 dias. Intime-se. - ADV: GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP), WESLEY LUIZ ALVES DE PAULA (OAB 274238/SP), CLOVIS BRONZATI (OAB 279195/SP), GILBERTO FAGUNDES DE OLIVEIRA (OAB 325606/SP)"},{"id":711302336,"data":"2026-08-28","tribunal":"TJSP","orgao":"Recursos Tribunais Superiores Direito Privado 3 - Extr., Esp. e Ord. - Pátio do Colégio, 73 - 5º andar","numero":"2087616-71.2026.8.26.0000","classe":"AGRAVO DE INSTRUMENTO","tipo":"Intimação","documento":"VISTA","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"MUNICíPIO DE PRAD rmino a designação de perícia contábil. Intime-se o (a) perito (a) contábil, BRUNA PEIA, para que entregue seu laudo em 20 dias úteis, observando os limites e parâmetros traçados pelo julgado. Ainda, havendo honorários periciais arbitrados na fase de conhecimento, de responsabilidade da reclamada, bem como custas não recolhidas, estas parcelas deverão compor o cálculo, obrigatoriamente. Com a apresentação do laudo, as partes deverão se manifestar para os fins do art. 879, § 2º, da CLT, no prazo de oito dias, independentemente de nova notificação. Havendo ente público, este deverá ser intimado diretamente, com prazo em dobro para sua manifestação. Quando da apresentação do laudo, o (a) perito (a) deverá observar os seguintes parâmetros: CORREÇÃO MONETÁRIA: Para processos ajuizados antes de 30/8/24: a) a correção do débito trabalhista pelos índices de atualização monetária e juros (IPCA-E + TR) relativos ao mês subsequente à prestação dos serviços até o ajuizamento da ação (conforme determinado pelo efeito vinculante do julgamento dos processos ADC 58, ADC 59, ADI 5.867 E ADI 6.021 pelo Eg. STF e pelo caput do art. 39 da Lei 8.177/91); b) a aplicação da Selic a partir do ajuizamento da ação até 29/8/24 (conforme determinado pelo efeito vinculante do julgamento dos processos ADC 58, ADC 59, ADI 5.867 E ADI 6.021 pelo Eg. STF); e c) a partir de 30.08.2024, a aplicação, sobre o débito consolidado até 29/8/24, do IPCA (art. 389, parágrafo único, CC/02) e juros pela taxa legal (SELIC - IPCA) (art. 406, §§ 1° e 3°, do CC/02). d) a correção da indenização por danos fixada ou alterada até 29/8/24 pela aplicação da taxa SELIC (que compreende juros e atualização) a partir do ajuizamento da ação, conforme dispos"},{"id":709780652,"data":"2026-08-27","tribunal":"TRT15","orgao":"CON1 - Araraquara","numero":"0010714-97.2026.5.15.0120","classe":"AçãO TRABALHISTA - RITO ORDINáRIO","tipo":"Intimação","documento":"Notificação","meio":"Diário de Justiça Eletrônico Nacional","link":"https://pje.trt15.jus.br/pjekz/validacao/26082615523505400000305468670?instancia=1","partes":[{"nome":"DOUGLAS RAFAEL DE SOUSA","polo":"A"},{"nome":"FERNANDA RANGEL","polo":"A"},{"nome":"MUNICIPIO DE PRADOPOLIS","polo":"P"}],"advogados":[{"nome":"TANIA APARECIDA FONZARE DE SOUZA","oab":"SP/322908"},{"nome":"ALDAIR CANDIDO DE SOUZA","oab":"SP/201321"},{"nome":"LAIS CRISTINA DE SOUZA","oab":"SP/319009"}],"texto":"PODER JUDICIÁRIO JUSTIÇA DO TRABALHO TRIBUNAL REGIONAL DO TRABALHO DA 15ª REGIÃO CON1 - ARARAQUARA ATOrd 0010714-97.2026.5.15.0120 AUTOR: DOUGLAS RAFAEL DE SOUSA RÉU: MUNICIPIO DE PRADOPOLIS INTIMAÇÃO Fica V. Sa. intimado para tomar ciência do Despacho ID cd7ed73 proferido nos autos. Órgão Julgador de Origem: 2ª VARA DO TRABALHO DE JABOTICABAL DESPACHO Visto. Para atuar como perito do Juízo para apuração da insalubridade e/ou periculosidade alegada pelo reclamante, nomeio FERNANDA RANGEL. Concede-se às partes o prazo até 11/09/2026 para apresentação de quesitos, indicação de assistente técnico e documentos necessários para a realização da(s) perícia(s), tais como: PPRA/LTCAT, PCMSO, PPP e ficha de EPI's no PJE. Ainda, nesse prazo, deverão informar o local exato para realização da perícia. No mesmo prazo, poderá a reclamada providenciar o depósito dos honorários periciais prévios, no valor de R$1.000,00, diretamente na conta a ser informada pelo perito, com comprovação nos autos. O perito deverá informar nos autos os dados, hora e local da realização de seus atos (diligências), no prazo até dia 23/09/2026, oportunidade em que também deverá informar dados de conta bancária para eventual crédito referente a despesas prévias periciais. Fica desde logo definido que os trabalhos periciais deverão iniciar somente a partir do dia 05/10/2026. Para realização do trabalho pericial e entrega do laudo técnico, concede-se ao perito o prazo até 05/11/2026. O perito ficará ciente da sua nomeação e do prazo acima assinalado através da inclusão deste processo no seu painel de trabalho no sistema do PJ-e. Caberá aos advogados das partes dar ciência a seus clientes e assistentes técnicos, bem como acessar os autos no PJe, até o dia 28/09/2026, para fim de tomar ciência dos dados, hora e local da diligência, independentemente de intimação. As partes poderão se manifestar sobre o laudo pericial no prazo de 06/11/2026 a 12/11/2026. Para a resposta às impugnações das partes, se forem específicas, fundamentadas e acompanhadas de questões suplementares, o perito apresentará seus esclarecimentos no prazo de 13/11/2026 a 19/11/2026. Não serão admitidas novas impugnações ao laudo pericial. "},{"id":709197134,"data":"2026-08-27","tribunal":"TJSP","orgao":"Unidade de Processamento Judicial - UPJ do Colégio Recursal dos Juizados Especiais do Estado de São Paulo","numero":"1002583-80.2025.8.26.0222","classe":"RECURSO INOMINADO CíVEL","tipo":"Intimação","documento":"Intimação de acórdão","meio":"Diário de Justiça Eletrônico Nacional","link":"https://www.dje.tjsp.jus.br","partes":[{"nome":"CRISTIANE DE SOUZA","polo":"P"},{"nome":"PREFEITURA MUNICIPAL DE PRADóPOLIS","polo":"A"}],"advogados":[{"nome":"WESLEY LUIZ ALVES DE PAULA","oab":"SP/274238"},{"nome":"DANIEL DE SOUZA SILVA","oab":"SP/297740"}],"texto":"INTIMAÇÃO DE ACÓRDÃO\r\n\r\nNº 1002583-80.2025.8.26.0222 - Processo Digital - Recurso Inominado Cível - Guariba - Recorrente: Prefeitura Municipal de Pradópolis - Recorrida: Cristiane de Souza - Magistrado(a) Ana Carla Criscione dos Santos - Colégio Recursal - Negaram provimento ao recurso, por V. U. - DIREITO ADMINISTRATIVO. RECURSO INOMINADO. PROFESSOR. PISO SALARIAL DOCENTE INCLUÍDO NA BASE DE CÁLCULO DA CARGA HORÁRIA SUPLEMENTAR (CHS) - O ABONO COMPLEMENTAR, POR SUA NATUREZA REMUNERATÓRIA E CARÁTER PERMANENTE, DEVE INTEGRAR A BASE DE CÁLCULO DA CARGA SUPLEMENTAR, CONFORME A LEGISLAÇÃO ESTADUAL - NÃO HÁ VIOLAÇÃO A DISPOSITIVOS CONSTITUCIONAIS OU LEGAIS, POIS O DIREITO RECLAMADO DECORRE DAS DISPOSIÇÕES CONTIDAS NA LEGISLAÇÃO, QUE DEVERIAM TER SIDO OBSERVA
