# Deploy no Render (https://render.com) — plano gratuito serve para começar.
# O banco é o Neon, externo: assim o acervo sobrevive a qualquer redeploy.
services:
  - type: web
    name: painel-juridico-pradopolis
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Contexto na RAIZ do repo, não em backend/: o Dockerfile copia a
    # biblioteca do MCP (pyproject.toml, src/) de fora de backend/, e o Docker
    # recusa copiar de fora do contexto de build.
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Cole a connection string do Neon. Precisa de ?sslmode=require
      # e do driver asyncpg: postgresql+asyncpg://...
      - key: DATABASE_URL
        sync: false
      # Gere com: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: JWT_SECRET
        generateValue: true
      - key: JURIDICO_NOME_PARTE
        value: PRADOPOLIS
      - key: JURIDICO_TERMOS_CONFIRMACAO
        value: MUNICIPIO,PREFEITURA
      - key: JURIDICO_UF
        value: SP
      - key: VARREDURA_ATIVA
        value: "true"
      - key: VARREDURA_HORA
        value: "06:00"
      # PAINEL_BASE_URL precisa ser a URL pública que o Render atribuir a este
      # serviço (ex.: https://painel-juridico-pradopolis.onrender.com) — é
      # dela que saem os links das mensagens do Hermes.
      - key: PAINEL_BASE_URL
        sync: false
      # Sem estas três, o serviço sobe igual e o Hermes fica mudo — não são
      # obrigatórias para o primeiro deploy. Ver backend/DEPLOY.md, §6.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID_GRUPO
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
