[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "painel-juridico-pradopolis"
version = "0.1.0"
description = "Serviço de acervo processual do Departamento Jurídico de Pradópolis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    # O domínio processual vem do MCP: cálculo de prazo, DJEN, DataJud.
    "mcp-juridico-brasil",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

# alembic/ fica fora do pacote: e script de migracao, nao codigo distribuivel.
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
mcp-juridico-brasil = { path = "..", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
